      schema:
        type: string
        pattern: ^dlv_[0-9a-f]{20}$
    DatabaseWatchId:
      name: watch_id
      in: path
      description: Database watch identifier, derived from the watched schema and table.
      required: true
      schema:
        type: string
        pattern: ^pgcf_watch_[0-9a-f]{8}$
    DatabaseScheduleName:
      name: name
      in: path
      description: Database schedule name, unique per project environment.
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_-]{0,62}$
    ProjectCursor:
      name: cursor
      in: query
      description: Opaque continuation cursor returned by the preceding project page.
      required: false
      schema:
        $ref: "#/components/schemas/Ulid"
    ProjectLimit:
      name: limit
      in: query
      description: Maximum number of projects to return.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    EnvironmentId:
      name: environment_id
      in: path
      description: Environment identifier.
      required: true
      schema:
        $ref: "#/components/schemas/Ulid"
    SecretName:
      name: secret_name
      in: path
      description:
        Uppercase environment-variable name. Set refuses a name starting with OHMYHOST_ and the
        platform names BETTER_AUTH_SECRET, BETTER_AUTH_URL, DATABASE_URL, HYPERDRIVE, ASSETS, FILES,
        IMAGES and STORAGE with a 400 whose detail is "Secret name is reserved.". Delete refuses the
        installed platform keys OHMYHOST_AI_KEY, OHMYHOST_MAIL_KEY, OHMYHOST_STORAGE_KEY,
        OHMYHOST_BROWSER_KEY and BETTER_AUTH_SECRET with the same detail.
      required: true
      schema:
        type: string
        pattern: ^[A-Z][A-Z0-9_]{0,127}$
    FeedbackId:
      name: feedback_id
      in: path
      description: Feedback receipt identifier returned on submission.
      required: true
      schema:
        $ref: "#/components/schemas/Ulid"
    OperationId:
      name: operation_id
      in: path
      description: Operation identifier.
      required: true
      schema:
        $ref: "#/components/schemas/Ulid"
    DeploymentId:
      name: deployment_id
      in: path
      description: Deployment identifier.
      required: true
      schema:
        $ref: "#/components/schemas/Ulid"
    TargetDeploymentId:
      name: target_deployment_id
      in: path
      description: Immutable deployment selected as the rollback target.
      required: true
      schema:
        $ref: "#/components/schemas/Ulid"
    SourceDeploymentId:
      name: source_deployment_id
      in: path
      required: true
      description: Current succeeded dev deployment whose immutable artifact will be promoted.
      schema:
        $ref: "#/components/schemas/Ulid"
    DeploymentCursor:
      name: cursor
      in: query
      description: Opaque continuation cursor returned by the preceding deployment page.
      required: false
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]+$
    DeploymentLimit:
      name: limit
      in: query
      description: Maximum number of deployments to return.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ProjectFilter:
      name: project_id
      in: query
      description: Restricts the page to one visible project.
      required: false
      schema:
        $ref: "#/components/schemas/Ulid"
    OperationFilter:
      name: operation_id
      in: query
      description: Restricts the page to one visible operation.
      required: false
      schema:
        $ref: "#/components/schemas/Ulid"
  responses:
    Preview:
      description: The authorized preview and its private capability URL. Do not cache or publish the URL.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Preview" }
    AcceptedOperation:
      description: The mutation was accepted for asynchronous processing.
      headers:
        Location:
          description: Relative URL of the durable operation resource.
          required: true
          schema:
            type: string
            pattern: ^/v1/operations/[0-9A-HJKMNP-TV-Z]{26}$
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Operation"
    AcceptedProject:
      description: The project creation was accepted for asynchronous provisioning.
      headers:
        Location:
          description: Relative URL of the durable operation resource.
          required: true
          schema:
            type: string
            pattern: ^/v1/operations/[0-9A-HJKMNP-TV-Z]{26}$
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProjectCreateOperation"
    Problem:
      description: The request failed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ResourceNotFound:
      description: The resource does not exist or is not visible to the authenticated principal.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            resourceNotFound:
              value:
                type: https://docs.ohmyho.st/errors/resource-not-found
                title: Resource not found
                status: 404
                code: resource_not_found
                request_id: req_01J00000000000000000000000
                retryable: false
                suggested_action: Check the resource identifier and your access scope.
    IdempotencyConflict:
      description: The idempotency key was already used with a different canonical request.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IdempotencyConflictProblem"
          examples:
            reusedKey:
              value:
                type: https://docs.ohmyho.st/errors/idempotency-key-reused
                title: Idempotency key reused
                status: 409
                code: idempotency_key_reused
                request_id: req_01J00000000000000000000000
                retryable: false
                suggested_action: Retry with a new idempotency key.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: WorkOS access JWT or a user-owned WorkOS API key. User keys are bound to one
        organization and restricted to their enabled product permissions. Session-only onboarding
        and session revocation require an interactive access JWT. No cookie session is assumed.
    MakeActionBearer:
      type: http
      scheme: bearer
      description: A secret execution key scoped to one bound Make action, prefixed omh_make_v1.
  schemas:
    JobPublishRequest:
      type: object
      additionalProperties: false
      required:
        - source_revision
        - context_path
        - dockerfile
        - entrypoint
        - max_runtime_seconds
        - max_build_credit_micros
      properties:
        source_revision:
          type: string
          pattern: ^(?!0{40})[0-9a-f]{40}$
        context_path:
          type: string
          minLength: 1
          maxLength: 256
          description: Relative path within the selected source revision.
          pattern: ^(?:\.|(?!\.{1,2}(?:/|$))[A-Za-z0-9_.-]+(?:/(?!\.{1,2}(?:/|$))[A-Za-z0-9_.-]+)*)$
        dockerfile:
          type: string
          minLength: 1
          maxLength: 256
          description: Relative path within the selected source revision.
          pattern: ^(?!\.{1,2}(?:/|$))[A-Za-z0-9_.-]+(?:/(?!\.{1,2}(?:/|$))[A-Za-z0-9_.-]+)*$
        entrypoint:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 256
            pattern: ^[^\u0000]+$
          minItems: 1
          maxItems: 32
        max_runtime_seconds:
          type: integer
          minimum: 1
          maximum: 60
        max_build_credit_micros:
          type: string
          pattern: ^(0|[1-9][0-9]{0,15})$
          description: Integer microcredits. One credit equals 1000000 microcredits.
    JobVersionAccepted:
      type: object
      additionalProperties: false
      required:
        - version_id
        - name
        - state
        - max_build_credit_micros
      properties:
        version_id:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,62}$
        state:
          type: string
          enum:
            - queued
        max_build_credit_micros:
          type: string
          pattern: ^(0|[1-9][0-9]{0,15})$
          description: Integer microcredits. One credit equals 1000000 microcredits.
    JobVersionView:
      type: object
      additionalProperties: false
      required:
        - version_id
        - name
        - source_revision
        - max_runtime_seconds
        - region
        - state
        - charged_micros
      properties:
        version_id:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,62}$
        source_revision:
          type: string
          pattern: ^(?!0{40})[0-9a-f]{40}$
        max_runtime_seconds:
          type: integer
          minimum: 1
          maximum: 60
        region:
          type: string
          enum:
            - eu
            - us
        state:
          type: string
          enum:
            - queued
            - building
            - ready
            - failed
        charged_micros:
          anyOf:
            - type: string
              pattern: ^(0|[1-9][0-9]{0,15})$
              description: Integer microcredits. One credit equals 1000000 microcredits.
            - type: "null"
    JobQuoteRequest:
      type: object
      additionalProperties: false
      required:
        - version_id
        - input_refs
        - max_runtime_seconds
      properties:
        version_id:
          $ref: "#/components/schemas/Ulid"
        input_refs:
          type: array
          items:
            $ref: "#/components/schemas/Ulid"
          maxItems: 16
        parameters_ref:
          anyOf:
            - $ref: "#/components/schemas/Ulid"
            - type: "null"
        max_runtime_seconds:
          type: integer
          minimum: 1
          maximum: 60
    JobQuoteView:
      type: object
      additionalProperties: false
      required:
        - quote_id
        - version_id
        - rate_card_id
        - max_credit_micros
        - expires_at
      properties:
        quote_id:
          $ref: "#/components/schemas/Ulid"
        version_id:
          $ref: "#/components/schemas/Ulid"
        rate_card_id:
          type: string
        max_credit_micros:
          type: string
          pattern: ^(0|[1-9][0-9]{0,15})$
          description: Integer microcredits. One credit equals 1000000 microcredits.
        expires_at:
          type: string
          format: date-time
    JobStartRequest:
      type: object
      additionalProperties: false
      required:
        - quote_id
        - max_credit_micros
      properties:
        quote_id:
          $ref: "#/components/schemas/Ulid"
        max_credit_micros:
          type: string
          pattern: ^(0|[1-9][0-9]{0,15})$
          description: Integer microcredits. One credit equals 1000000 microcredits.
    JobRunAccepted:
      type: object
      additionalProperties: false
      required:
        - run_id
        - state
        - max_credit_micros
        - status_url
        - next_poll_after_seconds
      properties:
        run_id:
          $ref: "#/components/schemas/Ulid"
        state:
          type: string
          enum:
            - queued
        max_credit_micros:
          type: string
          pattern: ^(0|[1-9][0-9]{0,15})$
          description: Integer microcredits. One credit equals 1000000 microcredits.
        status_url:
          type: string
        next_poll_after_seconds:
          type: integer
          minimum: 1
    JobRunView:
      type: object
      additionalProperties: false
      required:
        - run_id
        - version_id
        - state
        - created_at
        - started_at
        - finished_at
        - cancelled_at
        - max_credit_micros
        - charged_micros
        - outputs
        - next_poll_after_seconds
      properties:
        run_id:
          $ref: "#/components/schemas/Ulid"
        version_id:
          $ref: "#/components/schemas/Ulid"
        state:
          type: string
          enum:
            - queued
            - starting
            - running
            - cancelling
            - succeeded
            - cancelled
            - failed
            - timed_out
        created_at:
          type: string
          format: date-time
        started_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        finished_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        cancelled_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        max_credit_micros:
          type: string
          pattern: ^(0|[1-9][0-9]{0,15})$
          description: Integer microcredits. One credit equals 1000000 microcredits.
        charged_micros:
          anyOf:
            - type: string
              pattern: ^(0|[1-9][0-9]{0,15})$
              description: Integer microcredits. One credit equals 1000000 microcredits.
            - type: "null"
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/Ulid"
          maxItems: 16
        next_poll_after_seconds:
          anyOf:
            - type: integer
              minimum: 1
            - type: "null"
    JobUploadRequest:
      type: object
      additionalProperties: false
      required:
        - kind
        - size_bytes
        - media_type
      properties:
        kind:
          type: string
          enum:
            - input
            - parameters
        size_bytes:
          type: integer
          minimum: 0
          maximum: 67108864
        media_type:
          type: string
          pattern: ^[a-z0-9][a-z0-9.+-]{0,63}/[a-z0-9][a-z0-9.+-]{0,63}$
          description: Lowercase MIME type. Parameters files require application/json and are limited to 65536 bytes.
    JobUploadGrant:
      type: object
      additionalProperties: false
      required:
        - file_id
        - url
        - method
        - expires_at
      properties:
        file_id:
          $ref: "#/components/schemas/Ulid"
        url:
          type: string
          format: uri
        method:
          type: string
          enum:
            - PUT
        expires_at:
          type: string
          format: date-time
    JobDownloadGrant:
      type: object
      additionalProperties: false
      required:
        - url
        - method
        - expires_at
      properties:
        url:
          type: string
          format: uri
        method:
          type: string
          enum:
            - GET
        expires_at:
          type: string
          format: date-time
    Preview:
      type: object
      additionalProperties: false
      required:
        [
          id,
          project_id,
          environment,
          status,
          url,
          source,
          applied_source,
          ready_to_show,
          expires_at,
          failure,
          retry_after_seconds,
          data,
        ]
      properties:
        id: { $ref: "#/components/schemas/Ulid" }
        project_id: { $ref: "#/components/schemas/Ulid" }
        environment: { type: string, enum: [dev, prod] }
        status: { type: string, enum: [cold, starting, ready, sleeping] }
        url:
          {
            type: string,
            format: uri,
            description: Private capability URL. It stops working at expires_at; preview_open then creates a new preview with a new URL.,
          }
        source:
          description: The saved version selected for this preview, or null if there is none.
          $ref: "#/components/schemas/PreviewSource"
        applied_source:
          description: The version applied to the preview, or null if no version has been applied.
          $ref: "#/components/schemas/PreviewSource"
        ready_to_show:
          type: boolean
          description: True when the preview is ready and its applied version has the same sequence
            as the saved version. The database never delays it; the preview shows the app, and
            saving data works once the app is published.
        expires_at:
          type: string
          format: date-time
          description: The immutable deadline, 24 hours after the preview was created. Activity, rotation and saves never move it.
        failure:
          description: Why the last start attempt failed, or null. A failure of an older saved version is not reported.
          $ref: "#/components/schemas/PreviewFailure"
        retry_after_seconds:
          description: Seconds before another start attempt is made after a failure that a retry can change, or null.
          oneOf:
            - type: "null"
            - { type: integer, minimum: 1, maximum: 10 }
        data:
          description: What the app's database holds, for information only (it never delays ready_to_show), or null until a version has been applied and its database recorded.
          $ref: "#/components/schemas/PreviewData"
    PreviewData:
      oneOf:
        - type: "null"
        - type: object
          additionalProperties: false
          required: [state, environment, shares_data_with, options, pending_files]
          properties:
            state:
              type: string
              enum: [not_required, needs_database, migrations_pending, ready]
              description: not_required (the app declares no database), needs_database (declared, the environment has none), migrations_pending (a saved migration file is not applied there, or no finished migration job confirms the applied names and contents) or ready.
            environment: { type: string, enum: [dev, prod] }
            shares_data_with:
              oneOf:
                - type: "null"
                - { type: string, enum: [prod] }
              description: prod when this Dev database is also Prod's, otherwise null.
            options:
              type: array
              minItems: 1
              maxItems: 2
              description: The environment sets the user may choose to apply the files in (Dev needs a Paid workspace and a Dev site, otherwise prod only); with more than one environment, call database_migrate once per environment, dev first.
              items:
                type: array
                minItems: 1
                maxItems: 2
                items: { type: string, enum: [dev, prod] }
            pending_files:
              type: array
              maxItems: 20
              description: Saved migration files the environment's database does not hold yet.
              items: { type: string, minLength: 1, maxLength: 512 }
    PreviewFailure:
      oneOf:
        - type: "null"
        - type: object
          additionalProperties: false
          required: [code, retryable, next_step]
          properties:
            code:
              type: string
              enum:
                - source_migration_filename_noncanonical
                - source_refused
                - source_configuration_missing
                - source_unavailable
                - admission_credits
                - admission_scope
                - startup_install_failed
                - startup_server_not_ready
                - startup_server_exited
                - startup_failed
                - backup_recovery
                - containment
                - native_auth_launch_unavailable
                - native_preparing
                - paid_plan_required
            retryable: { type: boolean }
            next_step: { type: string, minLength: 1, maxLength: 1200 }
            detail:
              type: object
              additionalProperties: false
              description: The refused migration files, or the refused rule and file.
              properties:
                paths:
                  type: array
                  maxItems: 5
                  items: { type: string, minLength: 1, maxLength: 200 }
                rule: { type: string, minLength: 1, maxLength: 200 }
                path: { type: string, minLength: 1, maxLength: 200 }
    PreviewSource:
      oneOf:
        - type: "null"
        - type: object
          additionalProperties: false
          required: [sequence, commit_sha]
          properties:
            sequence: { type: integer, minimum: 1, maximum: 9007199254740991 }
            commit_sha: { type: string, pattern: "^(?!0{40}$)[0-9a-f]{40}$" }
    ConnectionBegin:
      type: object
      additionalProperties: false
      required: [provider]
      dependentRequired:
        project_id: [environment_id]
        environment_id: [project_id]
      properties:
        provider: { const: make }
        project_id: { $ref: "#/components/schemas/Ulid" }
        environment_id: { $ref: "#/components/schemas/Ulid" }
    MakeCredentialRequestCreate:
      type: object
      additionalProperties: false
      required: [provider_organization_id, team_id, selections]
      properties:
        provider_organization_id: { type: integer, minimum: 1, maximum: 9007199254740991 }
        team_id: { type: integer, minimum: 1, maximum: 9007199254740991 }
        selections:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/MakeCredentialSelection" }
    MakeCredentialSelection:
      type: object
      additionalProperties: false
      required: [app_name, app_version]
      anyOf:
        - required: [module_ids]
        - required: [endpoint_names]
      properties:
        app_name:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,128}$"
          description: A Make standard app identifier.
        app_version: { type: integer, minimum: 1, maximum: 9007199254740991 }
        module_ids:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items: { type: string, pattern: "^[A-Za-z0-9_.:-]{1,128}$" }
        endpoint_names:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    MakeCredentialRequestResult:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { enum: [created, running, uncertain, reconnect_required] }
        request_id: { type: string, pattern: "^[a-f0-9]{64}$" }
        provider_status: { type: string, minLength: 1, maxLength: 64 }
        authorization_url:
          type: string
          format: uri
          description: Private Make link available only on create or replay.
        expires_at: { type: [string, "null"], format: date-time }
    MakeCredentialRequestStatus:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { enum: [created, running, uncertain, reconnect_required] }
        request_id: { type: string, pattern: "^[a-f0-9]{64}$" }
        provider_status: { type: string, minLength: 1, maxLength: 64 }
        expires_at: { type: [string, "null"], format: date-time }
    MakeActionBindingRequest:
      type: object
      additionalProperties: false
      required: [project_id, environment_id, import_id, action]
      properties:
        project_id: { $ref: "#/components/schemas/Ulid" }
        environment_id: { $ref: "#/components/schemas/Ulid" }
        import_id: { $ref: "#/components/schemas/Ulid" }
        action:
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind, app_name, app_version, endpoint_name]
              properties:
                kind: { const: endpoint }
                app_name: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
                app_version: { type: integer, minimum: 1, maximum: 9007199254740991 }
                endpoint_name: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
            - type: object
              additionalProperties: false
              required: [kind, scenario_id, method, path_prefix]
              properties:
                kind: { const: scenario }
                scenario_id: { type: integer, minimum: 1, maximum: 9007199254740991 }
                method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
                path_prefix:
                  type: string
                  minLength: 1
                  maxLength: 2048
                  description: Origin-relative path prefix the owner permits on the bound Make API Shell.
    MakeActionBinding:
      type: object
      additionalProperties: false
      required: [binding_id, execution_key]
      properties:
        binding_id: { $ref: "#/components/schemas/Ulid" }
        execution_key: { type: string, description: Secret capability for this action. }
    MakeActionRunRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input: { type: object, additionalProperties: true }
    MakeActionRunSuccess:
      oneOf:
        - type: object
          additionalProperties: false
          required: [state, output]
          properties:
            state: { const: completed }
            output: { description: Bounded JSON response envelope returned by Make. }
        - type: object
          additionalProperties: false
          required: [state]
          properties:
            state: { const: already_completed }
    MakeActionInvalidRequest:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { const: invalid_request }
    MakeActionDenied:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { enum: [denied, reconnect_required] }
    MakeActionConflict:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { enum: [conflict, running] }
    MakeActionRateLimited:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { const: rate_limited }
    MakeActionUncertain:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { const: uncertain }
    MakeActionUnavailable:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { const: unavailable }
    ConnectionImportRequest:
      type: object
      additionalProperties: false
      required: [project_id, environment_id, provider_organization_id, team_id, connection_id]
      properties:
        project_id: { $ref: "#/components/schemas/Ulid" }
        environment_id: { $ref: "#/components/schemas/Ulid" }
        provider_organization_id: { type: integer, minimum: 1 }
