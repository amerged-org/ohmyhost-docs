openapi: 3.1.2
info:
  title: ohmyho.st API
  version: 0.0.0
  description: >-
    Public REST API for ohmyho.st hosting, projects, domains, email, credits and exports.
    Documentation: https://docs.ohmyho.st.
    Public source repositories: https://github.com/amerged-org/ohmyhost (platform) and
    https://github.com/amerged-org/cloudflare-postgres (managed PostgreSQL / PGCF).
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://app.ohmyho.st
    description: Production control API
  - url: https://dev.app.ohmyho.st
    description: Development control API
security:
  - BearerAuth: []
x-ohmyhost-mcp-workflows:
  - name: connection_status
    title: Read protected connection status
    description: Read protected secret/GitHub handoff state without credentials.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
  - name: connection_revoke
    title: Revoke this remote connection
    description: Revoke only the current remote connection through its existing consent workflow.
    annotations:
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: true
      openWorldHint: false
  - name: api_reference
    title: Read the Master Tool Contract
    description:
      "Find documented API operations, exact schemas and remote MCP support in the deployed Master
      Tool Contract. This documentation lookup executes no API operation."
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false

paths:
  /v1/projects/{project_id}/environments/{environment_id}/job-definitions/{name}/versions:
    post:
      operationId: publishContainerJobVersion
      x-ohmyhost-mcp:
        disposition: named
        tool_names: [container_job_version_publish]
        adapter: generated
        tool:
          name: container_job_version_publish
          title: Publish a finite job version
          description: "Publish one project job from its immutable saved source revision. Supply its build context, Dockerfile, argv and maximum accepted build charge in microcredits. Returns a queued build. Reuse the idempotency key only for this request."
          annotations:
            {
              "readOnlyHint": false,
              "destructiveHint": false,
              "idempotentHint": true,
              "openWorldHint": false,
            }
      summary: Publish a finite job version
      description: "Publish one project job from its immutable saved source revision. Supply its build context, Dockerfile, argv and maximum accepted build charge in microcredits. Returns a queued build. Reuse the idempotency key only for this request."
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - {
            "name": "name",
            "in": "path",
            "required": true,
            "schema": { "type": "string", "pattern": "^[a-z][a-z0-9-]{0,62}$" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { "$ref": "#/components/schemas/JobPublishRequest" }
      responses:
        "202":
          description: Publish a finite job version.
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/JobVersionAccepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "402": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
      x-ohmyhost-resource-disclosure: indistinguishable-not-found
      x-ohmyhost-idempotency:
        canonicalRequestVersion: v1
        identicalRequest: replay-stored-response
        changedRequest: 409-idempotency-key-reused
  /v1/projects/{project_id}/environments/{environment_id}/job-definitions/{name}/versions/{version_id}:
    get:
      operationId: getContainerJobVersion
      x-ohmyhost-mcp:
        disposition: named
        tool_names: [container_job_version_get]
        adapter: generated
        tool:
          name: container_job_version_get
          title: Read a finite job version
          description: "Read this project's job version and build status. A ready version can be quoted for execution."
          annotations:
            {
              "readOnlyHint": true,
              "destructiveHint": false,
              "idempotentHint": true,
              "openWorldHint": false,
            }
      summary: Read a finite job version
      description: "Read this project's job version and build status. A ready version can be quoted for execution."
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/RequestId"
        - {
            "name": "name",
            "in": "path",
            "required": true,
            "schema": { "type": "string", "pattern": "^[a-z][a-z0-9-]{0,62}$" },
          }
        - {
            "name": "version_id",
            "in": "path",
            "required": true,
            "schema": { "$ref": "#/components/schemas/Ulid" },
          }
      responses:
        "200":
          description: Read a finite job version.
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/JobVersionView" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "402": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
      x-ohmyhost-resource-disclosure: indistinguishable-not-found
  /v1/projects/{project_id}/environments/{environment_id}/job-quotes:
    post:
      operationId: quoteContainerJobRun
      x-ohmyhost-mcp:
        disposition: named
        tool_names: [container_job_quote]
        adapter: generated
        tool:
          name: container_job_quote
          title: Quote a finite job run
          description: "Return the expiring maximum run charge in microcredits for a ready version, ordered private file IDs and optional parameters file. Quoting is free."
          annotations:
            {
              "readOnlyHint": true,
              "destructiveHint": false,
              "idempotentHint": false,
              "openWorldHint": false,
            }
      summary: Quote a finite job run
      description: "Return the expiring maximum run charge in microcredits for a ready version, ordered private file IDs and optional parameters file. Quoting is free."
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { "$ref": "#/components/schemas/JobQuoteRequest" }
      responses:
        "200":
          description: Quote a finite job run.
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/JobQuoteView" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "402": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
      x-ohmyhost-resource-disclosure: indistinguishable-not-found
  /v1/projects/{project_id}/environments/{environment_id}/job-runs:
    post:
      operationId: startContainerJobRun
      x-ohmyhost-mcp:
        disposition: named
        tool_names: [container_job_start]
        adapter: generated
        tool:
          name: container_job_start
          title: Start a finite job run
          description: "Accept a previously quoted job, reserve up to the specified microcredits and queue its isolated container. A retry with the same idempotency key returns the original acceptance."
          annotations:
            {
              "readOnlyHint": false,
              "destructiveHint": false,
              "idempotentHint": true,
              "openWorldHint": false,
            }
      summary: Start a finite job run
      description: "Accept a previously quoted job, reserve up to the specified microcredits and queue its isolated container. A retry with the same idempotency key returns the original acceptance."
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { "$ref": "#/components/schemas/JobStartRequest" }
      responses:
        "202":
          description: Start a finite job run.
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/JobRunAccepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "402": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
      x-ohmyhost-resource-disclosure: indistinguishable-not-found
      x-ohmyhost-idempotency:
        canonicalRequestVersion: v1
        identicalRequest: replay-stored-response
        changedRequest: 409-idempotency-key-reused
  /v1/projects/{project_id}/environments/{environment_id}/job-runs/{run_id}:
    get:
      operationId: getContainerJobRun
      x-ohmyhost-mcp:
        disposition: named
        tool_names: [container_job_get]
        adapter: generated
        tool:
          name: container_job_get
          title: Read a finite job run
          description: "Read the job state, confirmed cost and ordered output file IDs. Poll at the returned interval. Output IDs become available on success."
          annotations:
            {
              "readOnlyHint": true,
              "destructiveHint": false,
              "idempotentHint": true,
              "openWorldHint": false,
            }
      summary: Read a finite job run
      description: "Read the job state, confirmed cost and ordered output file IDs. Poll at the returned interval. Output IDs become available on success."
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/RequestId"
        - {
            "name": "run_id",
            "in": "path",
            "required": true,
            "schema": { "$ref": "#/components/schemas/Ulid" },
          }
      responses:
        "200":
          description: Read a finite job run.
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/JobRunView" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "402": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
      x-ohmyhost-resource-disclosure: indistinguishable-not-found
  /v1/projects/{project_id}/environments/{environment_id}/job-runs/{run_id}/cancel:
    post:
      operationId: cancelContainerJobRun
      x-ohmyhost-mcp:
        disposition: named
        tool_names: [container_job_cancel]
        adapter: generated
        tool:
          name: container_job_cancel
          title: Cancel a finite job run
          description: "Request cancellation of exactly one run. A queued job incurs no run cost. A running job settles measured duration up to its cap. Poll for confirmation."
          annotations:
            {
              "readOnlyHint": false,
              "destructiveHint": true,
              "idempotentHint": true,
              "openWorldHint": false,
            }
      summary: Cancel a finite job run
      description: "Request cancellation of exactly one run. A queued job incurs no run cost. A running job settles measured duration up to its cap. Poll for confirmation."
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/RequestId"
        - {
            "name": "run_id",
            "in": "path",
            "required": true,
            "schema": { "$ref": "#/components/schemas/Ulid" },
          }
      responses:
        "200":
          description: Cancel a finite job run.
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/JobRunView" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "402": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
      x-ohmyhost-resource-disclosure: indistinguishable-not-found
  /v1/projects/{project_id}/environments/{environment_id}/job-inputs:
    post:
      operationId: createContainerJobUpload
      x-ohmyhost-mcp:
        disposition: named
        tool_names: [container_job_input_upload]
        adapter: generated
        tool:
          name: container_job_input_upload
          title: Request a private job input upload
          description: "Create a short-lived PUT grant for one bounded private input or parameters file. Upload the exact bytes with the declared Content-Type. The file ID is then available for a quote."
          annotations:
            {
              "readOnlyHint": false,
              "destructiveHint": false,
              "idempotentHint": false,
              "openWorldHint": false,
            }
      summary: Request a private job input upload
      description: "Create a short-lived PUT grant for one bounded private input or parameters file. Upload the exact bytes with the declared Content-Type. The file ID is then available for a quote."
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { "$ref": "#/components/schemas/JobUploadRequest" }
      responses:
        "201":
          description: Request a private job input upload.
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/JobUploadGrant" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "402": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
      x-ohmyhost-resource-disclosure: indistinguishable-not-found
  /v1/projects/{project_id}/environments/{environment_id}/job-runs/{run_id}/outputs/{file_id}/download:
    post:
      operationId: createContainerJobDownload
      x-ohmyhost-mcp:
        disposition: named
        tool_names: [container_job_output_download]
        adapter: generated
        tool:
          name: container_job_output_download
          title: Request a private job result download
          description: "Get a short-lived GET grant for one committed output of a successful run. Anyone holding this temporary URL can download that file until its expiry."
          annotations:
            {
              "readOnlyHint": false,
              "destructiveHint": false,
              "idempotentHint": false,
              "openWorldHint": false,
            }
      summary: Request a private job result download
      description: "Get a short-lived GET grant for one committed output of a successful run. Anyone holding this temporary URL can download that file until its expiry."
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/RequestId"
        - {
            "name": "run_id",
            "in": "path",
            "required": true,
            "schema": { "$ref": "#/components/schemas/Ulid" },
          }
        - {
            "name": "file_id",
            "in": "path",
            "required": true,
            "schema": { "$ref": "#/components/schemas/Ulid" },
          }
      responses:
        "200":
          description: Request a private job result download.
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/JobDownloadGrant" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "402": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
      x-ohmyhost-resource-disclosure: indistinguishable-not-found
  /v1/projects/{project_id}/preview:
    get:
      operationId: getProjectPreview
      x-ohmyhost-mcp:
        disposition: named
        tool_names: [preview_get]
        adapter: existing
      summary: Read the preview for a project environment
      description: Requires project write permission to retrieve the private capability URL. Free projects have Prod; Paid projects can also have Dev.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/PreviewEnvironment"
      responses:
        "200": { $ref: "#/components/responses/Preview" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
      x-ohmyhost-resource-disclosure: indistinguishable-not-found
    post:
      operationId: openProjectPreview
      x-ohmyhost-mcp:
        disposition: named
        tool_names: [preview_open]
        adapter: existing
      summary: Open or create a project environment preview
      description: Requires project write permission. Returns the preview's URL or creates a preview, and creates a new one with a new URL once the previous one has passed its 24 hours. Opening its URL starts a sleeping preview; source saves update it independently of deployments. When a start failed, `failure` carries a code and the next step; the call does not wait for the full bound.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/PreviewEnvironment"
      responses:
        "200": { $ref: "#/components/responses/Preview" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
      x-ohmyhost-resource-disclosure: indistinguishable-not-found
    delete:
      operationId: stopProjectPreview
      x-ohmyhost-mcp:
        disposition: named
        tool_names: [preview_stop]
        adapter: existing
      summary: Stop a project environment preview
      description: Stops the runtime and removes its backups while preserving the URL until its deadline. Repeat uncertain calls with the same idempotency key.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/PreviewEnvironment"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/Preview" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
      x-ohmyhost-resource-disclosure: indistinguishable-not-found
  /v1/projects/{project_id}/preview/token:
    post:
      operationId: rotateProjectPreviewToken
      x-ohmyhost-mcp:
        disposition: named
        tool_names: [preview_rotate]
        adapter: existing
      summary: Rotate a preview capability URL
      description: Invalidates the previous URL and closes its existing connections before returning the new URL. Repeat uncertain calls with the same idempotency key.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/PreviewEnvironment"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/Preview" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
      x-ohmyhost-resource-disclosure: indistinguishable-not-found
  /v1/organizations/{organization_id}/connections:
    get:
      operationId: listConnections
      x-ohmyhost-mcp:
        disposition: named
        tool_names: [integration_connection_list]
        adapter: existing
      summary: List connection grants
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: organization_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Ulid" }
        - name: scope
          in: query
          required: false
          description: Select workspace grants; omit for the legacy unfiltered list.
          schema: { type: string, enum: [workspace] }
      responses:
        "200":
          description: Connection result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionGrantList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
      x-ohmyhost-resource-disclosure: indistinguishable-not-found
  /v1/organizations/{organization_id}/connections/providers:
    get:
      operationId: listConnectionProviders
      x-ohmyhost-mcp:
        disposition: named
        tool_names: [integration_connection_providers]
        adapter: generated
        tool:
          name: integration_connection_providers
          title: Check connection provider availability
          description: Check which SaaS connection providers are available to this workspace and whether discovery is ready.
          annotations:
            readOnlyHint: true
            destructiveHint: false
            idempotentHint: true
            openWorldHint: false
      summary: List available connection providers
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: organization_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Ulid" }
      responses:
        "200":
          description: Connection result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionProviders" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
      x-ohmyhost-resource-disclosure: indistinguishable-not-found
  /v1/organizations/{organization_id}/connections/begin:
    post:
      operationId: beginConnection
      x-ohmyhost-mcp:
        disposition: protected-handoff
        tool_names: [integration_connection_begin]
        adapter: existing
        reason: The workspace owner gives provider consent through a protected browser link.
      summary: Start an owner consent handoff
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: organization_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Ulid" }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectionBegin" }
      responses:
        "201":
          description: Connection result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionHandoff" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
      x-ohmyhost-resource-disclosure: indistinguishable-not-found
  /v1/organizations/{organization_id}/connections/requests/{request_id}:
    get:
      operationId: getConnectionRequest
      x-ohmyhost-mcp:
        disposition: named
        tool_names: [integration_connection_status]
        adapter: existing
      summary: Read a consent handoff status
