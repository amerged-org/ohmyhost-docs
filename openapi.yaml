      required: [status, next_step]
      properties:
        status: { type: string, const: not_set_up }
        next_step: { type: string, minLength: 1, maxLength: 500 }
    NativeAuthConfiguration:
      type: object
      additionalProperties: false
      required:
        [
          enabled,
          configurationRevision,
          revocationEpoch,
          signupPolicy,
          canonicalOrigin,
          applicationName,
          allowedRedirectPaths,
          resetPasswordPath,
          invitationPath,
          readiness,
        ]
      properties:
        enabled:
          {
            type: boolean,
            description: Persistent Owner setting; source deployment cannot clear a pause.,
          }
        configurationRevision: { type: integer, minimum: 0 }
        revocationEpoch: { type: integer, minimum: 0 }
        signupPolicy: { type: string, enum: [open, invite-only] }
        canonicalOrigin: { type: [string, "null"], format: uri }
        applicationName: { type: string, minLength: 1, maxLength: 128 }
        allowedRedirectPaths:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items: { $ref: "#/components/schemas/NativeAuthRedirectPath" }
        resetPasswordPath: { $ref: "#/components/schemas/NativeAuthRedirectPath" }
        invitationPath: { $ref: "#/components/schemas/NativeAuthRedirectPath" }
        readiness:
          type: object
          additionalProperties: false
          required: [paid, sender, origin, storage]
          properties:
            paid: { type: boolean }
            sender: { type: boolean }
            origin: { type: boolean }
            storage: { type: boolean }
    NativeAuthConfigurationUpdate:
      type: object
      additionalProperties: false
      required: [configurationRevision, enabled, signupPolicy, applicationName]
      description: The revision must match current configuration; a stale write returns 409. Omitted optional values are preserved. A null canonicalOrigin selects the primary origin; explicit origins must be currently approved for this project and environment. Changing origin advances the revocation epoch. Both form paths must be in the resulting redirect allowlist.
      properties:
        configurationRevision: { type: integer, minimum: 0 }
        enabled: { type: boolean }
        signupPolicy: { type: string, enum: [open, invite-only] }
        applicationName: { type: string, minLength: 1, maxLength: 128 }
        canonicalOrigin: { type: [string, "null"], format: uri }
        allowedRedirectPaths:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items: { $ref: "#/components/schemas/NativeAuthRedirectPath" }
        resetPasswordPath: { $ref: "#/components/schemas/NativeAuthRedirectPath" }
        invitationPath: { $ref: "#/components/schemas/NativeAuthRedirectPath" }
    NativeAuthRedirectPath:
      type: string
      maxLength: 256
      pattern: '^/(?!/)(?!.*//)(?!\.{1,2}(?:/|$))(?!.*\/\.{1,2}(?:/|$))[A-Za-z0-9/_~.-]*$'
      description: Absolute application path without query, fragment, percent escapes, backslashes or dot segments.
    NativeAuthProviderStatus:
      type: object
      additionalProperties: false
      required:
        [
          provider,
          enabled,
          configured,
          clientId,
          secretPresent,
          callbackUrl,
          scopes,
          lastSuccessfulFlowAt,
        ]
      description: Configuration presence does not establish provider approval or a successful flow.
      properties:
        provider: { type: string, enum: [google, github] }
        enabled: { type: boolean }
        configured: { type: boolean }
        clientId: { type: [string, "null"] }
        secretPresent: { type: boolean }
        callbackUrl:
          {
            type: [string, "null"],
            format: uri,
            description: Null until a canonical origin is ready.,
          }
        scopes: { type: array, items: { type: string } }
        lastSuccessfulFlowAt: { type: [string, "null"], format: date-time }
    NativeAuthProviderUpdate:
      type: object
      additionalProperties: false
      required: [configurationRevision, enabled]
      description: The revision must match current configuration. Secrets are write-only and never echoed in responses or replay receipts.
      properties:
        configurationRevision: { type: integer, minimum: 0 }
        enabled: { type: boolean }
        clientId: { type: string, minLength: 1, maxLength: 1024 }
        clientSecret:
          type: string
          minLength: 1
          maxLength: 5120
          writeOnly: true
          description: At most 5120 UTF-8 bytes. The value is accepted only by this write-only operation.
