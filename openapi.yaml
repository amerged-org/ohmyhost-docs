    RepositoryConfigurationDiagnostic:
      type: object
      description: Bounded field facts for a schema-invalid repository-root ohmyhost.yaml.
      additionalProperties: false
      required: [code, path, fields, example]
      properties:
        code: { const: repository_configuration_invalid }
        path: { const: ohmyhost.yaml }
        fields:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [path, expected]
            properties:
              path:
                type: string
                minLength: 1
                maxLength: 240
                pattern: '^(?:\$|(?:/[A-Za-z0-9_-]{1,64})+)$'
                description: JSON Pointer to the field or the object containing an unexpected field. "$" refers to the document.
              expected:
                type: string
                minLength: 1
                maxLength: 512
                description: Expected value, type or constraint from the configuration rules.
        example:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [framework, package_manager, runtime]
              properties:
                framework:
                  type: string
                  enum: [astro, functions, nextjs, tanstack-start, vite-static]
                package_manager:
                  type: string
                  enum: [bun, npm, pnpm, yarn]
                runtime:
                  type: string
                  enum: [edge, functions, static]
    ProjectCreateOperation:
      type: object
      description:
        Durable record of an accepted project creation. project_id identifies the new project; it
        is returned unchanged by an identical idempotent replay.
      additionalProperties: false
      required:
        - id
        - state
        - created_at
        - updated_at
        - project_id
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        state:
          type: string
          enum:
            - queued
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        project_id:
          $ref: "#/components/schemas/Ulid"
    Operation:
      type: object
      description:
        Durable record returned for an accepted asynchronous mutation. Optional reconciliation
        is a current observation for queued/running work, separate from immutable terminal state. A
        completed reconciliation attempt alone does not mean the operation succeeded.
      additionalProperties: false
      required:
        - id
        - state
        - created_at
        - updated_at
      properties:
        blocking_operation_id:
          description: The active operation holding this queued operation's project mutation claim.
          $ref: "#/components/schemas/Ulid"
        deployment_id:
          description:
            The deployment this operation created (deploy, promotion or rollback), in every state.
            After a failure, read its diagnostics with deployment logs.
          $ref: "#/components/schemas/Ulid"
        id:
          $ref: "#/components/schemas/Ulid"
        state:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - cancelled
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        result:
          type: object
          additionalProperties: true
        error:
          $ref: "#/components/schemas/OperationFailure"
        progress:
          $ref: "#/components/schemas/OperationDeploymentProgress"
        reconciliation:
          $ref: "#/components/schemas/OperationReconciliation"
        work:
          $ref: "#/components/schemas/OperationWork"
    OperationWork:
      type: object
      description: Current work on an operation status read. Usual duration is an estimate in seconds.
      additionalProperties: false
      required: [kind, step, age_seconds, usual_duration_seconds]
      properties:
        kind:
          type: string
          enum:
            [
              project_create,
              development_environment_add,
              project_handle_change,
              deployment,
              deployment_promotion,
              deployment_rollback,
              source_link,
              source_initialize,
              source_save,
              project_delete,
              project_data_change,
              database_compute_change,
              database_migration,
              database_write,
              project_recovery,
              other,
            ]
        step:
          type: string
          pattern: "^[a-z][a-z_]{0,63}$"
          description: During provider verification the last recorded check can be verifying_source, verifying_build, verifying_database, verifying_runtime_secrets, verifying_storage, verifying_gateway or verifying_app_runtime. Historical work without a recorded phase carries the general recovery step.
        age_seconds: { type: integer, minimum: 0 }
        usual_duration_seconds: { type: integer, minimum: 1 }
        wait_reason: { type: string, pattern: "^[a-z][a-z_]{0,63}$" }
        next_step: { type: string, minLength: 1, maxLength: 500 }
    OperationDeploymentProgress:
      type: object
      additionalProperties: false
      description:
        Current deployment dependency observation, separate from immutable operation history.
        Poll the same operation; mail readiness does not mean application activation.
      required:
        [phase, project_id, deployment_id, observed_at, next_poll_after_seconds, suggested_action]
      properties:
        mail:
          $ref: "#/components/schemas/DeploymentMailProgress"
        build_completed_at:
          type: string
          format: date-time
          description:
            Actual successful build completion time when this operation ran a build; omitted for
            reused artifacts without a current build.
        phase:
          type: string
          enum: [queued, building, publishing, waiting_for_mail, mail_status_unavailable]
        project_id:
          $ref: "#/components/schemas/Ulid"
        deployment_id:
          $ref: "#/components/schemas/Ulid"
        observed_at:
          type: string
          format: date-time
        next_poll_after_seconds:
          type: integer
          const: 60
        suggested_action:
          type: string
          minLength: 1
          maxLength: 500
    DeploymentMailProgress:
      type: object
      additionalProperties: false
      required: [domain, status, configured_at, dns_records]
      description: Current mail verification details, present only while waiting_for_mail. Follow these records without rebuilding the deployment.
      properties:
        domain: { type: string, minLength: 1, maxLength: 253 }
        status:
          {
            type: string,
            enum:
              [configured, delegation_required, ready, verification_pending, verification_failed],
          }
        configured_at: { type: string, format: date-time }
        observed_at: { type: string, format: date-time }
        verification_issue:
          oneOf:
            - type: string
              enum:
                [
                  identity_missing,
                  identity_verification_failed,
                  dkim_verification_failed,
                  dkim_records_changed,
                  tenant_association_missing,
                ]
            - type: "null"
        next_check_after_seconds:
          oneOf:
            - { type: integer, enum: [60, 3600] }
            - { type: "null" }
        sending: { type: string, enum: [disabled, pending, ready, failed] }
        receiving: { type: string, enum: [disabled, pending, ready, failed] }
        dns_records:
          type: array
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [type, name, value, status]
            properties:
              type: { type: string, enum: [MX, TXT, CNAME] }
              name: { type: string, minLength: 1, maxLength: 253 }
              value: { type: string, minLength: 1, maxLength: 4096 }
              status: { type: string, minLength: 1, maxLength: 64 }
              priority: { type: integer, minimum: 0, maximum: 65535 }
    MigrationFailureDiagnostic:
      type: object
      additionalProperties: false
      required: [reason, file]
      description: Validated migration metadata only; contains no SQL, values or PostgreSQL message. Statement index is one-based and is present only for a failed customer statement.
      properties:
        reason:
          { type: string, enum: [catalog_changed, execution_failed, ledger_conflict, not_admitted] }
        file:
          oneOf:
            - { type: string, maxLength: 512 }
            - { type: "null" }
        statement_index: { type: integer, minimum: 1, maximum: 9007199254740991 }
        sqlstate: { type: string, pattern: "^[0-9A-Z]{5}$" }
    OperationReconciliation:
      type: object
      additionalProperties: false
      required: [state, attempt_id, observed_at, suggested_action]
      properties:
        state:
          type: string
          enum: [required, pending]
        attempt_id:
          oneOf:
            - $ref: "#/components/schemas/Ulid"
            - type: "null"
          description:
            Active attempt for pending reconciliation; null when a new confirmed reconciliation is
            required.
        observed_at:
          type: string
          format: date-time
        suggested_action:
          type: string
          minLength: 1
          maxLength: 500
        code: { type: string, const: reconciliation_required }
        failing_step:
          type: string
          enum: [provider_verification, workflow_execution, dispatch, workflow_recovery]
        cause:
          type: string
          enum: [provider_observation_uncertain, workflow_ended, delivery_unconfirmed, unknown]
        can_reconcile:
          type: boolean
          description: The recorded recovery budget allows one attempt. This does not guarantee recovery will succeed.
    ProviderReconciliationAttempt:
      type: object
      description: Provider-neutral status of one idempotent reconciliation attempt.
      additionalProperties: false
      required:
        - reconciliation_id
        - operation_id
        - state
      properties:
        reconciliation_id:
          $ref: "#/components/schemas/Ulid"
        operation_id:
          $ref: "#/components/schemas/Ulid"
        state:
          type: string
          enum:
            - completed
            - pending
            - uncertain
    IdempotencyConflictProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          properties:
            code:
              const: idempotency_key_reused
    OperationEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - operation_id
        - project_id
        - type
        - occurred_at
      properties:
        event_id:
          $ref: "#/components/schemas/Ulid"
        operation_id:
          $ref: "#/components/schemas/Ulid"
        project_id:
          $ref: "#/components/schemas/Ulid"
        type:
          type: string
          enum:
            - OperationQueued
            - OperationStarted
            - OperationSucceeded
            - OperationFailed
            - OperationCancelled
        occurred_at:
          type: string
          format: date-time
        failure:
          $ref: "#/components/schemas/OperationFailure"
    ProjectNotesReceipt:
      type: object
      additionalProperties: false
      required: [version, updated_at]
      properties:
        version: { type: integer, minimum: 1, maximum: 2147483647 }
        updated_at: { type: string, format: date-time }
    DatabaseCompute:
      type: object
      additionalProperties: false
      required: [project_id, environment, data_mode, observed_at, database]
      properties:
        project_id: { $ref: "#/components/schemas/Ulid" }
        environment: { type: string, enum: [dev, prod] }
        data_mode: { type: string, enum: [shared, isolated] }
        observed_at: { type: string, format: date-time }
        database:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/FixedDatabaseCompute"
    FixedDatabaseCompute:
      type: object
      additionalProperties: false
      description: Fixed resources; storage includes engine and WAL overhead. First provisioning is distinct from a sleeping database.
      required:
        [
          provider,
          size_class_id,
          memory_mib,
          cpu_millicores,
          storage_mib,
          max_connections,
          suspend_timeout_seconds,
          state,
          pending_state,
          disabled,
          region,
        ]
      properties:
        provider: { type: string, const: pgcf }
        size_class_id:
          { type: string, enum: [r256-s500m, r512-s1g, r1024-s2g, r2048-s4g, r4096-s8g] }
        memory_mib: { type: integer, enum: [256, 512, 1024, 2048, 4096] }
        cpu_millicores: { type: integer, enum: [250, 500, 1000, 2000] }
        storage_mib: { type: integer, enum: [500, 1024, 2048, 4096, 8192] }
        max_connections: { type: integer, enum: [20, 40, 80, 160, 200] }
        suspend_timeout_seconds: { type: integer, minimum: 60, maximum: 900 }
        state: { type: string, enum: [provisioning, cold, warm, suspended, error] }
        pending_state:
          { type: [string, "null"], enum: [provisioning, cold, warm, suspended, error, null] }
        disabled: { type: boolean }
        region: { type: string, enum: [us, eu] }
    ProjectContext:
      type: object
      additionalProperties: false
      required: [project_id, generated_at, credit_access, notes, markdown]
      properties:
        project_id: { $ref: "#/components/schemas/Ulid" }
        generated_at: { type: string, format: date-time }
        credit_access: { type: string, enum: [included, not_authorized] }
        markdown:
          { type: string, maxLength: 32768, description: At most 500 lines and 32768 UTF-8 bytes. }
        notes:
          type: object
          additionalProperties: false
          required: [version, markdown, updated_at]
          properties:
            version: { type: integer, minimum: 0, maximum: 2147483647 }
            markdown:
              {
                type: string,
                maxLength: 16384,
                description: At most 250 lines and 16384 UTF-8 bytes; untrusted user-authored text.,
              }
            updated_at: { type: [string, "null"], format: date-time }
    ProjectExport:
      type: object
      additionalProperties: false
      required:
        [
          id,
          project_id,
          state,
          requested_at,
          next_request_at,
          next_poll_after_seconds,
          error,
          archive,
        ]
      properties:
        id: { $ref: "#/components/schemas/Ulid" }
        project_id: { $ref: "#/components/schemas/Ulid" }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        requested_at: { type: string, format: date-time }
        next_request_at: { type: string, format: date-time }
        next_poll_after_seconds: { type: [integer, "null"], enum: [5, null] }
        error:
          oneOf:
            - $ref: "#/components/schemas/OperationFailure"
            - { type: "null" }
        archive:
          oneOf:
            - $ref: "#/components/schemas/ProjectExportArchive"
            - { type: "null" }
    ProjectExportArchive:
      type: object
      additionalProperties: false
      required:
        [bytes, sha256, sql_files, captured_at, expires_at, download_url, download_expires_at]
      properties:
        bytes: { type: integer, minimum: 1, maximum: 536870912 }
        sha256: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        sql_files:
          type: array
          items: { type: string, enum: [dev.sql, prod.sql, shared.sql, auth.sql] }
          minItems: 1
          maxItems: 3
          uniqueItems: true
          enum:
            - [dev.sql]
            - [prod.sql]
            - [dev.sql, prod.sql]
            - [shared.sql]
            - [auth.sql]
            - [dev.sql, auth.sql]
            - [prod.sql, auth.sql]
            - [dev.sql, prod.sql, auth.sql]
            - [shared.sql, auth.sql]
          description: dev.sql and/or prod.sql for isolated data, or shared.sql for shared data; auth.sql may accompany either or stand alone.
        captured_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        download_url: { type: [string, "null"], format: uri }
        download_expires_at: { type: [string, "null"], format: date-time }
    OperationFailure:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
        - suggested_action
      properties:
        migration:
          $ref: "#/components/schemas/MigrationFailureDiagnostic"
          description: Safe reason and file metadata for database_migration_failed and database_migrate_failed when recorded.
        code:
          type: string
          enum:
            - operation_failed
            - operation_abandoned
            - native_auth_launch_unavailable
            - authorization_changed
            - source_commit_conflict
            - source_snapshot_invalid
            - source_upload_expired
            - recovery_dispatch_failed
            - recovery_job_failed
            - recovery_input_expired
            - recovery_database_unavailable
            - recovery_checksum_mismatch
            - recovery_scope_unavailable
            - recovery_archive_too_large
            - build_not_started
            - build_failed
            - database_write_rejected
            - database_write_unavailable
            - database_write_outcome_unknown
            - database_compute_failed
            - database_compute_plan_changed
            - database_compute_rejected
            - database_migration_failed
            - database_migrate_failed
            - database_migrate_unavailable
            - insufficient_organization_credits
            - project_budget_exceeded
            - paid_plan_required
            - runtime_candidate_failed
            - runtime_candidate_rejected
            - storage_jurisdiction_conflict
            - provider_state_absent
            - auto_deploy_plan_rejected
            - auto_deploy_repository_renamed
            - promotion_source_stale
            - promotion_target_stale
            - project_handle_taken
            - managed_source_dispatch_failed
        message:
          type: string
          minLength: 1
          maxLength: 512
        retryable:
          type: boolean
          const: false
          description: A terminal operation cannot be retried in place; follow suggested_action.
        suggested_action:
          type: string
          minLength: 1
          maxLength: 500
        detail:
          type: string
          minLength: 1
          maxLength: 2000
          description:
            Present only on auto_deploy_plan_rejected when planning the pushed commit returned a
            typed refusal. It is the same fixed catalog sentence that the planning 409 problem
            returns as detail, naming the file, the rule and the required change.
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - audit_event_id
        - project_id
        - event_type
        - actor_type
        - actor_id
        - payload
        - occurred_at
      properties:
        audit_event_id:
          $ref: "#/components/schemas/Ulid"
        project_id:
          $ref: "#/components/schemas/Ulid"
        operation_id:
          $ref: "#/components/schemas/Ulid"
        event_type:
          type: string
          minLength: 1
        actor_type:
          type: string
          minLength: 1
        actor_id:
          type: string
          minLength: 1
        payload:
          $ref: "#/components/schemas/AuditPayloadSummary"
        occurred_at:
          type: string
          format: date-time
    AuditPayloadSummary:
      type: object
      description: A redacted, public summary of an internal audit payload.
      additionalProperties: false
      required:
        - summary
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 512
    AuditEventPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        next_cursor:
          type:
            - string
            - "null"
          pattern: ^[A-Za-z0-9_-]+$
    Ulid:
      type: string
      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
    ProjectDataChangeKind:
      type: string
      enum:
        - isolate_prod_keeps_data
        - isolate_dev_keeps_data
        - share_prod_keeps_data
        - reset_dev
      description:
        Owner-confirmed assignment change. No application data is copied; physical resources
        are provisioned lazily.
    ProjectDataChangeRequest:
      type: object
      additionalProperties: false
      required:
        - change
      properties:
        change:
          $ref: "#/components/schemas/ProjectDataChangeKind"
    ProjectDataChangePlan:
      type: object
      additionalProperties: false
      required:
        - action
        - project_id
        - change
        - data_mode_before
        - data_mode_after
        - effects
        - destructive_effects
        - redeploy_environments
        - risks
        - resource_etag
        - confirmation_token
        - created_at
        - expires_at
      properties:
        action:
          type: string
          const: data_change
        project_id:
          $ref: "#/components/schemas/Ulid"
        change:
          $ref: "#/components/schemas/ProjectDataChangeKind"
        data_mode_before:
          type: string
          enum:
            - shared
            - isolated
        data_mode_after:
          type: string
          enum:
            - shared
            - isolated
        effects: &a1
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 2000
        destructive_effects: *a1
        redeploy_environments:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum:
              - dev
              - prod
        risks: *a1
        resource_etag:
          type: string
          pattern: ^"sha256-[a-f0-9]{64}"$
          description: Send as If-Match with this plan's confirmation token.
        confirmation_token:
          $ref: "#/components/schemas/ConfirmationToken"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      description:
        An action-bound ten-minute plan naming retained, retired and lazily created data areas.
        The workspace Owner confirms its destructive effects before execution.
