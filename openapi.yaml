      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectDataChangeRequest"

components:
  headers:
    ETag:
      description: Opaque version of this response body. Not accepted as If-Match.
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 128
    XRequestId:
      description: Correlates the request with operations, events, logs, and audit records.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  parameters:
    AuditCursor:
      name: cursor
      in: query
      description: Opaque continuation cursor returned by the preceding page.
      required: false
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]+$
    AuditLimit:
      name: limit
      in: query
      description: Maximum number of audit events to return.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Identifies one mutation and its canonical request payload.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      description:
        Use resource_etag from a fresh rollback, promotion, deletion or data-change plan. For a
        project address change, use etag from project status; an ETag from another representation is
        not accepted.
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 128
    ConfirmationToken:
      name: X-Confirmation-Token
      in: header
      description: Ten-minute token bound to the planned action, project, target resource, and resource ETag.
      required: true
      schema:
        $ref: "#/components/schemas/ConfirmationToken"
    RequestId:
      name: X-Request-Id
      in: header
      description: Optional caller-provided correlation identifier.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ProjectId:
      name: project_id
      in: path
      description: Project identifier.
      required: true
      schema:
        $ref: "#/components/schemas/Ulid"
    DatabaseAccessId:
      name: access_id
      in: path
      description: Issued database credential identifier.
      required: true
      schema:
        $ref: "#/components/schemas/Ulid"
    DatabaseEnvironmentFilter:
      name: environment
      in: query
      description: Restrict the listing to one application environment.
      required: false
      schema:
        type: string
        enum: [dev, prod]
    ProjectCursor:
      name: cursor
      in: query
      description: Opaque continuation cursor returned by the preceding project page.
      required: false
      schema:
        $ref: "#/components/schemas/Ulid"
    ProjectLimit:
      name: limit
      in: query
      description: Maximum number of projects to return.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    EnvironmentId:
      name: environment_id
      in: path
      description: Environment identifier.
      required: true
      schema:
        $ref: "#/components/schemas/Ulid"
    SecretName:
      name: secret_name
      in: path
      description: Uppercase environment-variable name.
      required: true
      schema:
        type: string
        pattern: ^[A-Z][A-Z0-9_]{0,127}$
    FeedbackId:
      name: feedback_id
      in: path
      description: Feedback receipt identifier returned on submission.
      required: true
      schema:
        $ref: "#/components/schemas/Ulid"
    OperationId:
      name: operation_id
      in: path
      description: Operation identifier.
      required: true
      schema:
        $ref: "#/components/schemas/Ulid"
    DeploymentId:
      name: deployment_id
      in: path
      description: Deployment identifier.
      required: true
      schema:
        $ref: "#/components/schemas/Ulid"
    TargetDeploymentId:
      name: target_deployment_id
      in: path
      description: Immutable deployment selected as the rollback target.
      required: true
      schema:
        $ref: "#/components/schemas/Ulid"
    SourceDeploymentId:
      name: source_deployment_id
      in: path
      required: true
      description: Current succeeded dev deployment whose immutable artifact will be promoted.
      schema:
        $ref: "#/components/schemas/Ulid"
    DeploymentCursor:
      name: cursor
      in: query
      description: Opaque continuation cursor returned by the preceding deployment page.
      required: false
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]+$
    DeploymentLimit:
      name: limit
      in: query
      description: Maximum number of deployments to return.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ProjectFilter:
      name: project_id
      in: query
      description: Restricts the page to one visible project.
      required: false
      schema:
        $ref: "#/components/schemas/Ulid"
    OperationFilter:
      name: operation_id
      in: query
      description: Restricts the page to one visible operation.
      required: false
      schema:
        $ref: "#/components/schemas/Ulid"
  responses:
    AcceptedOperation:
      description: The mutation was accepted for asynchronous processing.
      headers:
        Location:
          description: Relative URL of the durable operation resource.
          required: true
          schema:
            type: string
            pattern: ^/v1/operations/[0-9A-HJKMNP-TV-Z]{26}$
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Operation"
    Problem:
      description: The request failed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ResourceNotFound:
      description: The resource does not exist or is not visible to the authenticated principal.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            resourceNotFound:
              value:
                type: https://docs.ohmyho.st/errors/resource-not-found
                title: Resource not found
                status: 404
                code: resource_not_found
                request_id: req_01J00000000000000000000000
                retryable: false
                suggested_action: Check the resource identifier and your access scope.
    IdempotencyConflict:
      description: The idempotency key was already used with a different canonical request.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IdempotencyConflictProblem"
          examples:
            reusedKey:
              value:
                type: https://docs.ohmyho.st/errors/idempotency-key-reused
                title: Idempotency key reused
                status: 409
                code: idempotency_key_reused
                request_id: req_01J00000000000000000000000
                retryable: false
                suggested_action: Retry with a new idempotency key.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: WorkOS access JWT or a user-owned WorkOS API key. User keys are bound to one
        organization and restricted to their enabled product permissions. Session-only onboarding
        and session revocation require an interactive access JWT. No cookie session is assumed.
  schemas:
    ManagedMailDomainRequest:
      type: object
      additionalProperties: false
      required: [domain, sending, receiving]
      properties:
        domain: { type: string, minLength: 4, maxLength: 253 }
        sending: { type: boolean }
        receiving: { type: boolean }
    ManagedMailWebhookRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
    ManagedMailDnsRecord:
      type: object
      additionalProperties: false
      required: [type, name, value, purpose, status]
      properties:
        type: { type: string, enum: [TXT, CNAME, MX] }
        name: { type: string }
        value: { type: string }
        purpose: { type: string }
        status: { type: string }
        priority: { type: integer, minimum: 0, maximum: 65535 }
    ManagedMailDomain:
      type: object
      additionalProperties: false
      required:
        [
          domain_id,
          domain,
          environment_id,
          sending,
          receiving,
          status,
          configured_at,
          observed_at,
          dns_records,
          webhook,
          next_check_after_seconds,
        ]
      properties:
        domain_id: { $ref: "#/components/schemas/Ulid" }
        domain: { type: string }
        environment_id: { $ref: "#/components/schemas/Ulid" }
        sending: { type: string, enum: [disabled, pending, ready, failed] }
        receiving: { type: string, enum: [disabled, pending, ready, failed] }
        status: { type: string, enum: [ready, verification_pending] }
        configured_at: { type: string, format: date-time }
        observed_at: { type: [string, "null"], format: date-time }
        dns_records:
          type: array
          items: { $ref: "#/components/schemas/ManagedMailDnsRecord" }
        dns:
          type: object
          additionalProperties: false
          required: [status, records]
          properties:
            status: { type: string, enum: [configured, action_required, conflict] }
            records:
              type: array
              items: { $ref: "#/components/schemas/ManagedMailDnsRecord" }
        webhook:
          type: [object, "null"]
          additionalProperties: false
          required: [url, verified]
          properties:
            url: { type: string, format: uri }
            verified: { type: boolean }
        next_check_after_seconds: { type: [integer, "null"], enum: [60, null] }
    ManagedMailWebhook:
      type: object
      additionalProperties: false
      required: [url, signing_secret, status]
      properties:
        url: { type: string, format: uri }
        signing_secret:
          {
            type: string,
            description: Server-only signing secret. Never log or send it to the browser.,
          }
        status: { type: string, const: verification_required }
    ManagedMailDisabled:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: disabled }
    ManagedMailDomainDeleted:
      type: object
      additionalProperties: false
      required: [status, domain, dns_records]
      properties:
        status: { type: string, const: deleted }
        domain: { type: string }
        dns_records:
          type: array
          description: Records ohmyho.st no longer manages; remove them from the domain's DNS.
          items: { $ref: "#/components/schemas/ManagedMailDnsRecord" }
    ManagedMailExpired:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: expired }
    ManagedMailRetryResult:
      type: object
      additionalProperties: false
      required: [attempted]
      properties:
        attempted: { type: boolean }
        delivered: { type: boolean }
    ManagedMailMessagePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [message_id, received_at, state, attempts]
            properties:
              message_id: { $ref: "#/components/schemas/Ulid" }
              received_at: { type: string, format: date-time }
              state:
                { type: string, enum: [pending, delivering, delivered, delivery_failed, expired] }
              attempts: { type: integer, minimum: 0, maximum: 4 }
    ManagedMailContentResult:
      oneOf:
        - $ref: "#/components/schemas/ManagedMailExpired"
        - $ref: "#/components/schemas/ManagedMailContent"
    ManagedMailContent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          domain,
          received_at,
          expires_at,
          from,
          to,
          subject,
          text,
          html,
          message_id,
          attachments,
        ]
      properties:
        id: { $ref: "#/components/schemas/Ulid" }
        domain: { type: string }
        received_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        from: { type: string }
        to: { type: array, items: { type: string } }
        subject: { type: string }
        text: { type: [string, "null"] }
        html: { type: [string, "null"] }
        message_id: { type: string }
        attachments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, filename, content_type, download_path]
            properties:
              id: { type: string }
              filename: { type: [string, "null"] }
              content_type: { type: string }
              download_path: { type: string }
    FeatureVoteChoices:
      type: array
      minItems: 3
      maxItems: 3
      description: One entry for each roadmap topic; no personal data or other browsers' votes.
      items:
        type: object
        additionalProperties: false
        required: [feature, choice]
        properties:
          feature: { type: string, enum: [eu, iso27001, soc2] }
          choice: { type: [string, "null"], enum: [up, down, null] }
    FeatureVoteState:
      type: object
      additionalProperties: false
      required: [votes]
      properties:
        votes:
          $ref: "#/components/schemas/FeatureVoteChoices"
    UserApiKeyId:
      type: string
      pattern: "^api_key_[A-Za-z0-9_]{1,120}$"
    UserApiKey:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organization_id,
          name,
          obfuscated_value,
          permissions,
          expires_at,
          created_at,
          last_used_at,
        ]
      properties:
        id: { $ref: "#/components/schemas/UserApiKeyId" }
        organization_id: { $ref: "#/components/schemas/Ulid" }
        name: { type: string, minLength: 1, maxLength: 128 }
        obfuscated_value: { type: string, pattern: '^sk_(?:\.\.\.|…)[A-Za-z0-9_-]{1,12}$' }
        permissions:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, pattern: "^[A-Za-z0-9_.*:-]{1,128}$" }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
    UserApiKeyCreation:
      type: object
      additionalProperties: false
      required: [request_id, replayed, key, value]
      properties:
        request_id: { $ref: "#/components/schemas/Ulid" }
        replayed: { type: boolean }
        key: { $ref: "#/components/schemas/UserApiKey" }
        value: { type: [string, "null"], pattern: "^sk_[A-Za-z0-9_-]{20,128}$" }
      oneOf:
        - properties: { replayed: { const: false }, value: { type: string } }
        - properties: { replayed: { const: true }, value: { type: "null" } }
    UserApiKeyPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/UserApiKey" }
        next_cursor: { type: [string, "null"], pattern: "^api_key_[A-Za-z0-9_]{1,120}$" }
    CreditMicros:
      type: string
      pattern: ^(0|[1-9][0-9]{0,18})$
      description: Non-negative microcredits, at most 9223372036854775807. One credit equals 1000000
        microcredits.
    BillingTaxIssue:
      description: Verified issue on an existing Stripe invoice; no new purchase is needed.
      type: [object, "null"]
      additionalProperties: false
      required: [code, invoice_id, observed_at, required_action]
      properties:
        code:
          type: string
          enum:
            [
              billing_tax_location_required,
              billing_tax_calculation_failed,
              billing_tax_configuration_required,
            ]
        invoice_id: { type: string, pattern: "^in_[A-Za-z0-9_]{1,253}$" }
        observed_at: { type: string, format: date-time }
        required_action: { type: string, enum: [open_billing_portal, contact_support] }
    BillingRecharge:
      type: object
      additionalProperties: false
      required:
        [
          organization_id,
          portal_available,
          enabled,
          revision,
          status,
          monthly_limit_minor,
          spent_minor,
          currency,
          amount_minor,
          credits,
          threshold_credits,
          setup_url,
          invoice_url,
          billing_issue,
        ]
      properties:
        organization_id: { $ref: "#/components/schemas/Ulid" }
        portal_available:
          type: boolean
          description:
            An existing customer in this billing account is ready for a hosted billing-portal
            handoff; this does not imply a paid subscription.
        enabled: { type: boolean }
        revision: { type: integer, minimum: 0 }
        status:
          {
            type: string,
            enum:
              [
                off,
                setup_required,
                on,
                payment_required,
                monthly_limit,
                needs_reconciliation,
                tax_required,
              ],
          }
        monthly_limit_minor: { type: integer, minimum: 1000, maximum: 100000 }
        spent_minor: { type: integer, minimum: 0 }
        currency: { type: string, const: usd }
        amount_minor: { type: integer, const: 900 }
        credits: { type: integer, const: 1000 }
        threshold_credits: { type: integer, const: 100 }
        setup_url: { type: [string, "null"], format: uri, maxLength: 8192 }
        invoice_url: { type: [string, "null"], format: uri, maxLength: 8192 }
        billing_issue: { $ref: "#/components/schemas/BillingTaxIssue" }
    BillingCheckout:
      type: object
      additionalProperties: false
      required:
        [
          organization_id,
          checkout_id,
          offer,
          state,
          payment_confirmed,
          url,
          expires_at,
          packs,
          credited_micros,
          revoked_micros,
          paid_until,
          required_action,
          billing_issue,
        ]
      properties:
        organization_id: { $ref: "#/components/schemas/Ulid" }
        checkout_id: { $ref: "#/components/schemas/Ulid" }
        offer: { type: string, enum: [topup, paid] }
        state: { type: string, enum: [open, complete, expired] }
        payment_confirmed: { type: boolean }
        url: { type: [string, "null"], format: uri, maxLength: 8192 }
        expires_at: { type: string, format: date-time }
        packs: { type: integer, minimum: 1, maximum: 100 }
        credited_micros: { type: string, pattern: "^(0|[1-9][0-9]{0,18})$" }
        revoked_micros: { type: string, pattern: "^(0|[1-9][0-9]{0,18})$" }
        paid_until: { type: [string, "null"], format: date-time }
        required_action:
          type: string
          enum: [none, complete_checkout, open_billing_portal, contact_support]
          description:
            Human payment handoff. Complete the returned Checkout URL, request a fresh billing
            portal URL to correct billing details, or contact ohmyho.st when tax configuration
            requires review. none includes a draft invoice awaiting automatic processing; it is not
            a claim of current Paid coverage. Never infer renewal success from the historical
            payment_confirmed flag.
        billing_issue: { $ref: "#/components/schemas/BillingTaxIssue" }
    BillingPortal:
      type: object
      additionalProperties: false
      required: [organization_id, url, created_at]
      properties:
        organization_id: { $ref: "#/components/schemas/Ulid" }
        url: { type: string, format: uri, maxLength: 8192 }
        created_at: { type: string, format: date-time }
    OrganizationCredits:
      type: object
      additionalProperties: false
      required:
        [
          organization_id,
          unit,
          as_of,
          available_micros,
          reserved_micros,
          spent_micros,
          expired_micros,
          platform_overrun_micros,
          grace_started_at,
          grace_expires_at,
          active_meters,
          rate_cards,
        ]
      properties:
        organization_id:
          $ref: "#/components/schemas/Ulid"
        unit:
          type: string
          const: microcredits
        as_of:
          type: string
          format: date-time
        available_micros:
          $ref: "#/components/schemas/CreditMicros"
        reserved_micros:
          $ref: "#/components/schemas/CreditMicros"
        spent_micros:
          $ref: "#/components/schemas/CreditMicros"
        expired_micros:
          $ref: "#/components/schemas/CreditMicros"
        platform_overrun_micros:
          $ref: "#/components/schemas/CreditMicros"
        grace_started_at:
          type: [string, "null"]
          format: date-time
          description: First confirmed exhaustion in this continuous period; null while funded.
        grace_expires_at:
          type: [string, "null"]
          format: date-time
          description:
            Seven days after first confirmed exhaustion. Existing services and domains are retained
            during this grace; no automatic data deletion. Explicit project stop budgets are
            separate.
        active_meters:
          type: array
          items:
            type: string
            pattern: ^[a-z0-9_.-]{1,128}$
        rate_cards:
          type: array
          maxItems: 4
          description:
            Published integer prices, newest first. A published rate is not proof of enabled
            billing; only active_meters names currently billed sources. Builds retain their accepted
            quote. Provider cost is a list-price basis before platform allowances, not an invoice.
          items:
            $ref: "#/components/schemas/PublishedCreditRateCard"
    UsageTotal:
      type: string
      description: Non-negative integer aggregate, serialized exactly without floating-point rounding.
      pattern: "^(0|[1-9][0-9]{0,37})$"
    OrganizationCreditUsage:
      type: object
      additionalProperties: false
      required: [organization_id, month, as_of, unit, data, next_cursor]
      properties:
        organization_id:
          $ref: "#/components/schemas/Ulid"
        month:
          type: string
          pattern: "^20[0-9]{2}-(0[1-9]|1[0-2])$"
        as_of:
          type: string
          format: date-time
        unit:
          type: string
          const: microcredits
        next_cursor:
          oneOf:
            - $ref: "#/components/schemas/Ulid"
            - type: "null"
        data:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [project_id, reserved_micros, meters]
            properties:
              project_id:
                $ref: "#/components/schemas/Ulid"
              reserved_micros:
                $ref: "#/components/schemas/UsageTotal"
              meters:
                type: array
                maxItems: 1000
                items:
                  type: object
                  additionalProperties: false
                  required:
                    [
                      environment_id,
                      meter,
                      unit,
                      rate_card_id,
                      quantity,
                      charged_micros,
                      funded_micros,
                      platform_overrun_micros,
                    ]
                  properties:
                    environment_id:
                      oneOf:
                        - $ref: "#/components/schemas/Ulid"
                        - type: "null"
                    meter:
                      type: string
                      pattern: "^[A-Za-z0-9_.:/-]{1,128}$"
                    unit:
                      type: string
                      pattern: "^[A-Za-z0-9_.:/-]{1,128}$"
                    rate_card_id:
                      type: string
                      pattern: "^[A-Za-z0-9_.:/-]{1,128}$"
                    quantity:
                      $ref: "#/components/schemas/UsageTotal"
                    charged_micros:
                      $ref: "#/components/schemas/UsageTotal"
                    funded_micros:
                      $ref: "#/components/schemas/UsageTotal"
                    platform_overrun_micros:
                      $ref: "#/components/schemas/UsageTotal"
    PublishedCreditRateCard:
      type: object
      additionalProperties: false
      required: [id, currency, published_at, effective_from, rates]
      properties:
        id:
          type: string
          pattern: ^[a-z0-9_.-]{1,128}$
        currency:
          type: string
          const: USD
        published_at:
          type: string
          format: date-time
        effective_from:
          type: string
          format: date-time
        rates:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [meter, unit, units_per_charge, provider_cost_micros, credit_micros]
            properties:
              meter:
                type: string
                pattern: ^[a-z0-9_.-]{1,128}$
              unit:
                type: string
                pattern: ^[a-z0-9_.-]{1,128}$
              units_per_charge:
                type: string
                pattern: ^[1-9][0-9]{0,18}$
              provider_cost_micros:
                type: string
                pattern: ^(0|[1-9][0-9]{0,18})$
                description:
                  Provider list-cost basis for units_per_charge, in USD micro-units (1000000 equals 1
                  USD), before shared allowances and discounts.
              credit_micros:
                $ref: "#/components/schemas/CreditMicros"
    SetProjectCreditBudgetRequest:
      type: object
      additionalProperties: false
      required: [amount_micros, mode]
      properties:
        amount_micros:
          oneOf:
            - $ref: "#/components/schemas/CreditMicros"
            - type: "null"
        mode:
          type: string
          enum: [continue, stop]
    ProjectCreditBudget:
      type: object
      additionalProperties: false
      required:
        [
          project_id,
          amount_micros,
          mode,
          used_micros,
          reserved_micros,
          period_start,
          period_end,
          as_of,
        ]
      properties:
        project_id:
          $ref: "#/components/schemas/Ulid"
        amount_micros:
          oneOf:
            - $ref: "#/components/schemas/CreditMicros"
            - type: "null"
        mode:
          type: string
          enum: [continue, stop]
        used_micros:
          $ref: "#/components/schemas/CreditMicros"
        reserved_micros:
          $ref: "#/components/schemas/CreditMicros"
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        as_of:
          type: string
          format: date-time
    CreateCloudflareDnsAuthorizationRequest:
      type: object
      additionalProperties: false
      required:
        - zone
      properties:
        zone:
          type: string
          minLength: 4
          maxLength: 253
          pattern: '^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'
    CloudflareDnsAuthorization:
      type: object
      description: Short-lived credential-free redirect information for one Cloudflare OAuth authorization.
      additionalProperties: false
      required:
        - authorization_id
        - authorization_url
        - expires_at
      properties:
        authorization_id:
          $ref: "#/components/schemas/Ulid"
        authorization_url:
          type: string
          format: uri
          minLength: 20
          maxLength: 4096
          pattern: '^https://dash\.cloudflare\.com/oauth2/auth\?'
        expires_at:
          type: string
          format: date-time
    CloudflareDnsAuthorizationStatus:
      type: object
      description: Credential-free project authorization state. Without an authorization, status is
        not_authorized, zone and expires_at are null, and scopes is empty. All other states name the
        actual customer zone; no platform or customer zone is inferred.
      additionalProperties: false
      required:
        - status
        - zone
        - scopes
        - expires_at
      properties:
        status:
          type: string
          enum:
            - not_authorized
            - pending
            - authorized
            - expired
            - revoked
        zone:
          type: [string, "null"]
          minLength: 4
          maxLength: 253
          pattern: '^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'
        scopes:
          type: array
          uniqueItems: true
          maxItems: 2
          items:
            type: string
            enum:
              - dns.write
              - zone.read
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    PaidDomainRequest:
      type: object
      additionalProperties: false
      required: [hostname]
      properties:
        hostname:
          type: string
          minLength: 4
          maxLength: 253
          pattern: '^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'
    PaidDomainPlan:
      type: object
      additionalProperties: false
      required: [status, hostname, environment, cname_target, effects, risks]
      properties:
        status: { type: string, const: planned }
        hostname: { type: string, minLength: 4, maxLength: 253 }
        environment: { type: string, const: prod }
        cname_target: { type: string, enum: [customers.omh.st, customers.ohmyho.st] }
        effects:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 512 }
        risks:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 512 }
    PaidDomain:
      type: object
      description:
        awaiting_deployment means the requested hostname is declared but not provisioned. Its hostname
        is present, suspension_reason, custom_hostname_status, ssl_status and url are null, and
        validation_records is empty. Authorize Cloudflare, deploy to Prod, then repeat the same apply.
      additionalProperties: false
      required:
        - status
        - suspension_reason
        - hostname
        - environment
        - cname_target
        - custom_hostname_status
        - ssl_status
        - validation_records
        - url
      properties:
        status:
          type: string
          enum:
            [
              not_configured,
              awaiting_deployment,
              pending,
              active,
              reconciliation_required,
              deleted,
              suspended,
            ]
        suspension_reason:
          type: [string, "null"]
          enum:
            [paid_plan_required, insufficient_organization_credits, project_budget_exceeded, null]
          description:
            Non-null only while suspended by the same Paid, credit-grace or stop-budget policy used
            by the gateway. DNS/TLS receipts remain intact; url is null while suspended.
        hostname:
          oneOf:
            - type: string
              minLength: 4
              maxLength: 253
            - type: "null"
        environment: { type: string, const: prod }
        cname_target: { type: string, enum: [customers.omh.st, customers.ohmyho.st] }
        custom_hostname_status:
          type: [string, "null"]
        ssl_status:
          type: [string, "null"]
        validation_records:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [type, name, content, purpose]
            properties:
              type: { type: string, enum: [CNAME, TXT] }
              name: { type: string, minLength: 1, maxLength: 253 }
              content: { type: string, minLength: 1, maxLength: 2048 }
              purpose: { type: string, enum: [traffic, ownership, ssl, dcv_delegation] }
        url:
          oneOf:
            - type: string
              format: uri
              pattern: ^https://
            - type: "null"
    PutEnvironmentSecretRequest:
      type: object
      additionalProperties: false
      required:
        - value
      properties:
        value:
          type: string
          description: Write-only plaintext value. It is encrypted before persistence and never returned.
          minLength: 1
          maxLength: 5120
          writeOnly: true
    EnvironmentSecret:
      type: object
      description: Environment secret metadata. The plaintext and ciphertext are never returned.
      additionalProperties: false
      required:
        - name
        - revision
        - key_version
        - created_at
        - updated_at
        - desired_generation
        - applied_generation
        - delivery_state
        - runtime_provider
        - applied_secret_count
        - last_error
      properties:
        name:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,127}$
        revision:
          type: integer
          minimum: 1
        key_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        desired_generation:
          type: integer
          minimum: 0
        applied_generation:
          type: integer
          minimum: 0
        delivery_state:
          type: string
          enum: [not_deployed, pending, ready, failed]
        runtime_provider:
          type: [string, "null"]
          enum: [wfp, null]
        applied_secret_count:
          type: integer
          minimum: 0
          maximum: 100
        last_error:
          type: [string, "null"]
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
    EnvironmentSecretPage:
      type: object
      additionalProperties: false
      required:
        - items
        - desired_generation
        - applied_generation
        - delivery_state
        - runtime_provider
        - applied_secret_count
        - last_error
      properties:
        items:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/EnvironmentSecret"
        desired_generation:
          type: integer
          minimum: 0
        applied_generation:
          type: integer
          minimum: 0
        delivery_state:
          type: string
          enum: [not_deployed, pending, ready, failed]
        runtime_provider:
          type: [string, "null"]
          enum: [wfp, null]
        applied_secret_count:
          type: integer
          minimum: 0
          maximum: 100
        last_error:
          type: [string, "null"]
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
    DeleteEnvironmentSecretResult:
      type: object
      additionalProperties: false
      required:
        - name
        - status
        - desired_generation
        - applied_generation
        - delivery_state
        - runtime_provider
        - applied_secret_count
        - last_error
      properties:
        name:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,127}$
        status:
          type: string
          enum:
            - deleted
            - absent
        desired_generation:
          type: integer
          minimum: 0
        applied_generation:
          type: integer
          minimum: 0
        delivery_state:
          type: string
          enum: [not_deployed, pending, ready, failed]
        runtime_provider:
          type: [string, "null"]
          enum: [wfp, null]
        applied_secret_count:
          type: integer
          minimum: 0
          maximum: 100
        last_error:
          type: [string, "null"]
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
    LinkProjectSourceRequest:
      type: object
      additionalProperties: false
      required:
        - repository_owner
        - repository_name
      properties:
        repository_owner:
          type: string
          minLength: 1
          maxLength: 39
          pattern: ^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$
        repository_name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9._-]+$
    ConfigureSourceAutoDeployRequest:
      type: object
      additionalProperties: false
      required: [branch, enabled]
      properties:
        branch:
          type: string
          description:
            Exact Git branch accepted by Git check-ref-format branch rules; control/space,
            dot-lock, reflog, range and metacharacter forms are rejected.
          minLength: 1
          maxLength: 1024
          pattern: '^(?!.*(?:\.\.|@\{|//|\\|[~^:?*\[\]\x00-\x20\x7f]))(?!.*(?:^|/)\.)(?!.*(?:^|/)[^/]*\.lock(?:/|$))(?!.*\.$)[A-Za-z0-9][A-Za-z0-9._/-]{0,1023}$'
        enabled:
          type: boolean
    SourceAutoDeploy:
      type: object
      additionalProperties: false
      description:
        Push-to-deploy configuration. Generation 0 with null branch, ref, grant_status and
        updated_at means auto-deploy was never configured for this project.
      required: [branch, ref, environment, enabled, generation, grant_status, updated_at]
      properties:
        branch:
          type: [string, "null"]
        ref:
          type: [string, "null"]
          pattern: ^refs/heads/
        environment:
          type: string
          enum: [dev]
        enabled:
          type: boolean
        generation:
          type: integer
          minimum: 0
        grant_status:
          type: [string, "null"]
          enum: [active, revoked, null]
        updated_at:
          type: [string, "null"]
          format: date-time
    ConnectGithubOrganizationRequest:
      type: object
      additionalProperties: false
    GithubOrganizationConnection:
      type: object
      additionalProperties: false
      required:
        [
          connection_id,
          organization_id,
          installation_id,
          account_id,
          account_login,
          account_type,
          github_user_id,
          github_user_login,
          connected_at,
          revoked_at,
          settings_url,
        ]
      properties:
        connection_id: { $ref: "#/components/schemas/Ulid" }
        organization_id: { $ref: "#/components/schemas/Ulid" }
        installation_id: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
        account_id: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
        account_login: { type: string, minLength: 1, maxLength: 39 }
        account_type: { type: string, enum: [User, Organization] }
        github_user_id: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
        github_user_login: { type: string, minLength: 1, maxLength: 39 }
        connected_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        settings_url: { type: string, format: uri }
    GithubOrganizationConnectionStatus:
      type: object
      additionalProperties: false
      required: [status, connection]
      properties:
        status: { type: string, enum: [not_connected, connected, revoked] }
        connection:
          oneOf:
            - $ref: "#/components/schemas/GithubOrganizationConnection"
            - type: "null"
    GithubConnectionAuthorization:
      type: object
      additionalProperties: false
      required: [authorization_id, status, last_failure, authorization_url, expires_at, connection]
      properties:
        authorization_id: { type: [string, "null"], pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$" }
        status: { type: string, enum: [pending, authorizing, connected, failed, expired] }
        last_failure:
          type: [string, "null"]
          enum:
            [
              installation_access_required,
              account_admin_required,
              authorization_code_rejected,
              provider_unavailable,
              expired,
              session_inactive,
              denied,
              code_spent,
              state_unknown,
              null,
            ]
        authorization_url:
          type: [string, "null"]
          format: uri
          description:
            One GitHub browser authorization link when pending; contains only the bound single-use
            state, never a provider credential.
        expires_at: { type: [string, "null"], format: date-time }
        connection:
          oneOf:
            - $ref: "#/components/schemas/GithubOrganizationConnection"
            - type: "null"
    GithubSourceAuthorization:
      type: object
      additionalProperties: false
      required:
        [
          authorization_id,
          status,
          last_failure,
          authorization_url,
          installation_url,
          expires_at,
          operation_id,
          installation_id,
          repository_id,
          repository_owner,
          repository_name,
        ]
      properties:
        authorization_id:
          $ref: "#/components/schemas/Ulid"
        status:
          type: string
          enum: [pending, authorizing, authorized, failed, expired]
        last_failure:
          type: [string, "null"]
          description:
            Why the last callback did not finish. A pending authorization that carries one is
            resumable; resolve the named cause, then open authorization_url again without a new key.
          enum:
            - repository_not_installed
            - repository_access_required
            - authorization_code_rejected
            - provider_unavailable
            - expired
            - session_inactive
            - denied
            - code_spent
            - null
        authorization_url:
          type: [string, "null"]
          format: uri
          description:
            Open only when pending; contains the single-use state and PKCE challenge, never a
            provider credential.
        installation_url:
          type: [string, "null"]
          format: uri
          description:
            Install or update the GitHub App's selected repository access before authorizing, if
            required.
        expires_at:
          type: string
          format: date-time
        operation_id:
          type: [string, "null"]
          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
        installation_id:
          type: [string, "null"]
          pattern: ^[1-9][0-9]*$
        repository_id:
          type: [string, "null"]
          pattern: ^[1-9][0-9]*$
        repository_owner:
          type: string
        repository_name:
          type: string
    ProjectSource:
      oneOf:
        - $ref: "#/components/schemas/GithubProjectSource"
        - $ref: "#/components/schemas/ManagedProjectSource"
    ProjectSourceBinding:
      oneOf:
        - $ref: "#/components/schemas/GithubSourceBinding"
        - $ref: "#/components/schemas/ManagedProjectSource"
    ProjectSourceResponse:
      oneOf:
        - $ref: "#/components/schemas/GithubProjectSource"
        - $ref: "#/components/schemas/GithubSourceBinding"
        - $ref: "#/components/schemas/ManagedProjectSource"
    GithubProjectSource:
      type: object
      additionalProperties: false
