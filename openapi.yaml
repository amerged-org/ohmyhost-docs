          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 20
        repository_full_name:
          type: string
          minLength: 3
          maxLength: 201
          pattern: ^[^/]+/[^/]+$
        status:
          type: string
          enum:
            - pending
            - ready
            - failed
            - revoked
        linked_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        failure_summary:
          type: string
          minLength: 1
          maxLength: 512
    GithubSourceBinding:
      type: object
      additionalProperties: false
      required:
        - provider
        - source_connection_id
        - source_generation
        - installation_id
        - repository_full_name
        - status
        - linked_at
        - updated_at
      properties:
        source_connection_id: { $ref: "#/components/schemas/Ulid" }
        source_generation: { type: integer, minimum: 1, maximum: 2147483646 }
        provider:
          type: string
          const: github
        installation_id:
          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 20
        repository_full_name:
          type: string
          minLength: 3
          maxLength: 201
          pattern: ^[^/]+/[^/]+$
        status:
          type: string
          enum:
            - pending
            - ready
            - failed
            - revoked
        linked_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        failure_summary:
          type: string
          minLength: 1
          maxLength: 512
    CommitSha:
      type: string
      pattern: ^[a-f0-9]{40}$
    NullableCommitSha:
      type: [string, "null"]
      pattern: ^[a-f0-9]{40}$
    SourceGeneration:
      type: integer
      minimum: 0
      maximum: 2147483646
    ManagedSourcePath:
      type: string
      minLength: 1
      maxLength: 240
      description: Printable ASCII USTAR-compatible relative repository path without dot segments, backslashes, Git metadata or credential files. Environment secrets use the protected secret form; .env.example is allowed.
    SourceContentBase64:
      type: string
      contentEncoding: base64
      maxLength: 2796204
      pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
    SourceMessage:
      type: string
      minLength: 1
      maxLength: 200
    SourceManifestFile:
      type: object
      additionalProperties: false
      required: [path, sha256, byte_length, executable]
      properties:
        path: { $ref: "#/components/schemas/ManagedSourcePath" }
        sha256: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        byte_length: { type: integer, minimum: 0, maximum: 2097152 }
        executable: { type: boolean }
    SourceManifest:
      type: array
      maxItems: 2000
      items: { $ref: "#/components/schemas/SourceManifestFile" }
    ManagedProjectSource:
      type: object
      additionalProperties: false
      required:
        [
          provider,
          source_connection_id,
          source_generation,
          namespace,
          repository_name,
          branch,
          current_commit_sha,
          status,
          linked_at,
          updated_at,
        ]
      properties:
        initialization_operation_id:
          $ref: "#/components/schemas/Ulid"
          description: Actual source initialization child operation, when one exists; present only while pending or failed.
        initialization_error_code:
          type: string
          description: Canonical public operation failure code for failed initialization; never a provider error.
        provider: { type: string, const: managed }
        source_connection_id: { $ref: "#/components/schemas/Ulid" }
        source_generation: { $ref: "#/components/schemas/SourceGeneration" }
        namespace: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,127}$" }
        repository_name: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,127}$" }
        branch: { type: string, const: main }
        current_commit_sha: { $ref: "#/components/schemas/NullableCommitSha" }
        status: { type: string, enum: [pending, ready, failed, revoked] }
        linked_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ManagedSourceInitializeRequest:
      type: object
      additionalProperties: false
