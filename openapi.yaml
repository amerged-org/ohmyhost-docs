        changes:
          type: array
          maxItems: 4000
          items:
            type: object
            additionalProperties: false
            required:
              [path, change, before_sha256, after_sha256, before_executable, after_executable]
            properties:
              path: { $ref: "#/components/schemas/ManagedSourcePath" }
              change: { type: string, enum: [added, modified, deleted] }
              before_sha256: { type: [string, "null"], pattern: "^sha256:[a-f0-9]{64}$" }
              after_sha256: { type: [string, "null"], pattern: "^sha256:[a-f0-9]{64}$" }
              before_executable: { type: [boolean, "null"] }
              after_executable: { type: [boolean, "null"] }
    FunctionRun:
      type: object
      additionalProperties: false
      required:
        [
          id,
          deployment_id,
          cron,
          scheduled_at,
          state,
          attempt,
          status_code,
          started_at,
          finished_at,
        ]
      properties:
        id: { $ref: "#/components/schemas/Ulid" }
        deployment_id: { $ref: "#/components/schemas/Ulid" }
        cron: { type: string, maxLength: 64 }
        scheduled_at: { type: string, format: date-time }
        state: { type: string, enum: [due, running, retry, succeeded, failed, skipped] }
        attempt: { type: integer, minimum: 0, maximum: 3 }
        status_code: { type: [integer, "null"], minimum: 100, maximum: 599 }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    FunctionRunPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/FunctionRun" }
    DeploymentDiagnostic:
      type: object
      additionalProperties: false
      required: [id, source, code, message, occurred_at]
      properties:
        id: { $ref: "#/components/schemas/Ulid" }
        source: { type: string, enum: [build, control, runtime, function] }
        code: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,63}$" }
        message: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,127}$" }
        exception_class: { type: string, maxLength: 128 }
        file:
          type: string
          maxLength: 512
          description: The diagnostic may identify a file without a line or column. Unavailable coordinates are omitted.
        line: { type: integer, minimum: 1 }
        column: { type: integer, minimum: 0 }
        route: { type: string, maxLength: 512 }
        request_id: { type: string, maxLength: 128 }
        trace_id: { type: string, maxLength: 128 }
        duration_ms: { type: integer, minimum: 0, maximum: 900000 }
        excerpt:
          type: string
          minLength: 1
          maxLength: 16384
          description:
            "Diagnostic output with control characters removed before storage. On BUILD_FAILED
            this is the tail of the install/build log (newest lines last), which may include a
            platform packaging diagnostic. On HEALTH_CHECK_FAILED this is the head of the body the health check was answered with (at most
            4096 characters, never a header). A running application holds its environment's secrets
            and this answer is not scanned for them, so, like a query of the project's database, a
            HEALTH_CHECK_FAILED excerpt is returned only to an owner of the project; never answer a
            health check with a secret."
        excerpt_truncated:
          type: boolean
          description:
            Whether output was omitted from excerpt (earlier build output, or the rest of the
            health answer). Present exactly when excerpt is present.
        status_code:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status the health check was answered with; present only on
            HEALTH_CHECK_FAILED. The probe is a cookieless GET of route that follows no redirect, so
            a 3xx is unhealthy too.
        occurred_at: { type: string, format: date-time }
    DeploymentDiagnosticPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/DeploymentDiagnostic" }
        next_cursor: { type: string, maxLength: 2048 }
    ProjectDatabaseWriteRequest:
      type: object
      additionalProperties: false
      required: [environment, statement, parameters]
      properties:
        environment: { type: string, enum: [dev, prod] }
        statement:
          type: string
          minLength: 1
          maxLength: 65536
          description:
            One direct INSERT, UPDATE or DELETE, max 64 KiB UTF-8; entire JSON request is limited
            to 65,600 bytes.
        parameters:
          type: array
          maxItems: 100
          items: {}
          description: JSON values, at most 8 levels and 10000 nodes, max 64 KiB encoded.
    ProjectDatabaseWriteReceipt:
      type: object
      additionalProperties: false
      required: [operation_id, environment, state, command, affected_rows, error]
      properties:
        operation_id: { $ref: "#/components/schemas/Ulid" }
        environment: { type: string, enum: [dev, prod] }
        state: { type: string, enum: [running, succeeded, failed] }
        command: { type: [string, "null"], enum: [INSERT, UPDATE, DELETE, null] }
        affected_rows: { type: [integer, "null"], minimum: 0, maximum: 1000 }
        error:
          oneOf:
            - $ref: "#/components/schemas/OperationFailure"
            - type: "null"
    ProjectDatabaseQueryRequest:
      type: object
      additionalProperties: false
      required: [environment, statement, parameters]
      properties:
        environment:
          type: string
          enum: [dev, prod]
        statement:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^\s*(?:[Ss][Ee][Ll][Ee][Cc][Tt]|[Ww][Ii][Tt][Hh])\b'
          description: One SELECT or WITH statement in any letter case, at most 4,096 bytes, without a trailing semicolon, because it runs as a subquery.
        parameters:
          type: array
          maxItems: 32
          items:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: "null"
    ProjectDatabaseQueryResult:
      type: object
      additionalProperties: false
      required: [environment, rows, row_count, truncated]
      properties:
        environment:
          type: string
          enum: [dev, prod]
        rows:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: true
        row_count:
          type: integer
          minimum: 0
          maximum: 100
        truncated:
          type: boolean
    ProjectDatabaseAccessRequest:
      type: object
      additionalProperties: false
      required: [environment]
      properties:
        environment:
          type: string
          enum: [dev, prod]
        mode:
          type: string
          enum: [read, write]
          default: read
          description:
            read joins the read-only role; write joins the restricted runtime role. Neither can
            change schema.
        ttl_seconds:
          type: integer
          minimum: 300
          maximum: 86400
          default: 3600
          description: Credential lifetime between 5 minutes and 24 hours.
        label:
          type: [string, "null"]
          minLength: 1
          maxLength: 64
          description: Optional customer label without control characters or surrounding whitespace.
    ProjectDatabaseAccess:
      type: object
      additionalProperties: false
      required:
        - access_id
        - environment
        - mode
        - role_name
        - host
        - provider
        - transport
        - websocket_url
        - database
        - label
        - state
        - issued_at
        - expires_at
        - revoked_at
        - revocation_reason
      properties:
        access_id: { $ref: "#/components/schemas/Ulid" }
        environment: { type: string, enum: [dev, prod] }
        mode: { type: string, enum: [read, write] }
        role_name:
          type: string
          pattern: ^ohmyho_da_[0-7][0-9a-hjkmnp-tv-z]{25}_[0-9a-z]{8}$
        host: { type: string, minLength: 1, maxLength: 253 }
        database:
          type: string
          pattern: "^[a-z][a-z0-9]{19}$"
          description: The exact 20-character PGCF database identity for WSS.
        provider: { type: string, const: pgcf }
        transport: { type: string, const: wss }
        websocket_url:
          type: string
          format: uri
          description: Verified WSS origin ending in / and matching host. The local bridge adds /v2 and the bound database and user; no public PostgreSQL TCP endpoint.
        label: { type: [string, "null"], minLength: 1, maxLength: 64 }
        state: { type: string, enum: [active, expired, revoked] }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        revocation_reason:
          type: [string, "null"]
          enum: [principal, expired, budget, creation_failed, data_change, null]
    ProjectDatabaseAccessCredential:
      type: object
      additionalProperties: false
      required:
        - connection_uri
        - psql_command
        - access_id
        - environment
        - mode
        - role_name
        - host
        - provider
        - transport
        - websocket_url
        - database
        - label
        - state
        - issued_at
        - expires_at
        - revoked_at
        - revocation_reason
      properties:
        access_id: { $ref: "#/components/schemas/Ulid" }
        environment: { type: string, enum: [dev, prod] }
        mode: { type: string, enum: [read, write] }
        role_name:
          type: string
          pattern: ^ohmyho_da_[0-7][0-9a-hjkmnp-tv-z]{25}_[0-9a-z]{8}$
        host: { type: string, minLength: 1, maxLength: 253 }
        database:
          type: string
          pattern: "^[a-z][a-z0-9]{19}$"
          description: The exact 20-character PGCF database identity for WSS.
        provider: { type: string, const: pgcf }
        transport: { type: string, const: wss }
        websocket_url:
          type: string
          format: uri
          description: Verified WSS origin ending in / and matching host. The local bridge adds /v2 and the bound database and user; no public PostgreSQL TCP endpoint.
        label: { type: [string, "null"], minLength: 1, maxLength: 64 }
        state: { type: string, enum: [active, expired, revoked] }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        revocation_reason:
          type: [string, "null"]
          enum: [principal, expired, budget, creation_failed, data_change, null]
        connection_uri:
          type: string
          format: uri
          description: Returned once as credential material. For PGCF this identifies a WSS transport, never direct public TCP. Never place it in command arguments, files, notes or source.
        psql_command:
          type: string
          description: For PGCF, a secret-free ohmyhost database psql invocation that obtains and revokes its own session credential.
    ProjectDatabaseAccessPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ProjectDatabaseAccess" }
    DatabaseWebhookEventType:
      type: string
      enum:
        - database.created
        - database.ready
        - database.woke
        - database.slept
        - database.suspended
        - database.resized
        - database.deleted
    DatabaseWebhookEventPattern:
      description:
        A platform event type, data.<topic> for the rows of one watched table, or data.* for every
        watched table. A bare * is not accepted and never matches data events.
      oneOf:
        - $ref: "#/components/schemas/DatabaseWebhookEventType"
        - type: string
          pattern: '^data\.(?:\*|[a-z][a-z0-9_]{0,47})$'
    DatabaseTableCreateRequest:
      type: object
      additionalProperties: false
      required: [environment, table, columns]
      properties:
        environment: { type: string, enum: [dev, prod] }
        table:
          type: string
          pattern: "^[a-z_][a-z0-9_]{0,62}$"
          description: Name of the new table in the public schema. Lower-case, not a PostgreSQL
            reserved word and not starting with pg_.
        columns:
          type: array
          minItems: 1
          maxItems: 64
          description: Columns in the order written. Names are unique, and at most one column is an
            identity column.
          items: { $ref: "#/components/schemas/DatabaseTableColumnRequest" }
        primary_key:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          description: Columns of the primary key, each one of the table's columns. Identity and
            primary key columns are NOT NULL; omitted when the table has no primary key.
          items:
            type: string
            pattern: "^[a-z_][a-z0-9_]{0,62}$"
      examples:
        - environment: dev
          table: orders
          columns:
            - { name: id, type: bigint, nullable: false, identity: true }
            - { name: total, type: numeric }
          primary_key: [id]
    DatabaseTableColumnRequest:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name:
          type: string
          pattern: "^[a-z_][a-z0-9_]{0,62}$"
        type: { $ref: "#/components/schemas/DatabaseTableColumnType" }
        nullable:
          type: boolean
          default: true
          description: Whether the column accepts NULL. Identity and primary key columns never do.
        identity:
          type: boolean
          default: false
          description: Generated always as identity. Only integer and bigint columns can be identity
            columns, and an identity column has no default.
        default:
          type: string
          enum: [now, uuid]
          description: now is now() on a timestamptz column; uuid is gen_random_uuid() on a uuid
            column. Omitted when the column has no default.
    DatabaseTableColumnType:
      type: string
      enum:
        [text, integer, bigint, boolean, numeric, double precision, timestamptz, date, uuid, jsonb]
    DatabaseTableColumn:
      type: object
      additionalProperties: false
      required: [name, type, nullable, identity, default]
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/DatabaseTableColumnType" }
        nullable: { type: boolean }
        identity: { type: boolean }
        default: { type: [string, "null"], enum: [now, uuid, null] }
    DatabaseTable:
      type: object
      additionalProperties: false
      required: [environment, schema, table, columns, primary_key, created]
      properties:
        environment: { type: string, enum: [dev, prod] }
        schema: { type: string, const: public }
        table: { type: string }
        columns:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/DatabaseTableColumn" }
        primary_key:
          type: array
          maxItems: 8
          uniqueItems: true
          items: { type: string }
        created:
          type: boolean
          description: true when this request created the table, false when an identical table
            already existed.
    DatabaseTableCreated:
      type: object
      additionalProperties: false
      required: [table]
      properties:
        table: { $ref: "#/components/schemas/DatabaseTable" }
    DatabaseWatchCreateRequest:
      type: object
      additionalProperties: false
      required: [environment, table, columns]
      properties:
        environment: { type: string, enum: [dev, prod] }
        schema:
          type: string
          default: public
          pattern: "^[A-Za-z_][A-Za-z0-9_]{0,62}$"
          description: Schema of the table, public when omitted. The schemas pgcf, ohmyhost,
            information_schema and pg_* cannot be watched.
        table:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]{0,62}$"
          description: Ordinary table owned by the application, created by a deployed migration.
        columns:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          description: Columns published with every event, exactly as written; names are case-sensitive.
          items:
            type: string
            pattern: "^[A-Za-z_][A-Za-z0-9_]{0,62}$"
        operations:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          default: [insert, update, delete]
          description: Row changes that publish an event; all three when omitted.
          items: { type: string, enum: [insert, update, delete] }
      examples:
        - environment: dev
          table: orders
          columns: [id, total]
    DatabaseWatch:
      type: object
      additionalProperties: false
      required: [id, environment, schema, table, columns, operations, topic, event_type]
      properties:
        id:
          type: string
          pattern: ^pgcf_watch_[0-9a-f]{8}$
        environment: { type: string, enum: [dev, prod] }
        schema:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]{0,62}$"
        table:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]{0,62}$"
        columns:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            pattern: "^[A-Za-z_][A-Za-z0-9_]{0,62}$"
        operations:
          type: array
          minItems: 1
          maxItems: 3
          items: { type: string, enum: [insert, update, delete] }
        topic:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,47}$
          description: Topic of the watched table, derived by the platform from its name.
        event_type:
          type: string
          pattern: ^data\.[a-z][a-z0-9_]{0,47}$
          description: Event type of the rows of the table; pass it to a database webhook.
      examples:
        - id: pgcf_watch_0a1b2c3d
          environment: dev
          schema: public
          table: orders
          columns: [id, total]
          operations: [insert, update, delete]
          topic: orders
          event_type: data.orders
    DatabaseWatchPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/DatabaseWatch" }
    DatabaseWatchDeleted:
      type: object
      additionalProperties: false
      required: [id, deleted]
      properties:
        id:
          type: string
          pattern: ^pgcf_watch_[0-9a-f]{8}$
        deleted: { type: boolean, const: true }
    DatabaseWebhookCreateRequest:
      type: object
      additionalProperties: false
      required: [url, event_types]
      properties:
        url:
          type: string
          maxLength: 2048
          pattern: ^https://
          description: HTTPS receiver URL.
        event_types:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items: { $ref: "#/components/schemas/DatabaseWebhookEventPattern" }
        headers:
          type: object
          description:
            Extra headers sent with every delivery. Names are case-insensitive and must be
            unique; content-type, host, content-length, connection, transfer-encoding, user-agent,
            te, upgrade, expect and any name starting with pgcf-, cf- or x-forwarded- are refused.
          maxProperties: 8
          propertyNames:
            type: string
            pattern: ^[A-Za-z][A-Za-z0-9-]{0,63}$
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 512
            pattern: '^[\x21-\x7e]([\x20-\x7e]*[\x21-\x7e])?$'
    DatabaseWebhook:
      type: object
      additionalProperties: false
      required: [id, environment, url, event_types, header_names, created_at]
      properties:
        id:
          type: string
          pattern: ^whk_[a-z0-9]{20}$
        environment: { type: string, enum: [dev, prod] }
        url:
          type: string
          maxLength: 2048
          pattern: ^https://
          description: The receiver URL. Callers without projects:write receive only its origin, because the path or query may carry the receiver's credential.
        event_types:
          type: array
          minItems: 1
          maxItems: 16
          items: { $ref: "#/components/schemas/DatabaseWebhookEventPattern" }
        header_names:
          type: array
          maxItems: 8
          items:
            type: string
            pattern: ^[A-Za-z][A-Za-z0-9-]{0,63}$
          description: Names of the extra headers only; their values are never returned.
        created_at: { type: string, format: date-time }
    DatabaseWebhookCreated:
      type: object
      additionalProperties: false
      required: [id, environment, url, event_types, header_names, created_at, secret]
      properties:
        id:
          type: string
          pattern: ^whk_[a-z0-9]{20}$
        environment: { type: string, enum: [dev, prod] }
        url: { type: string, maxLength: 2048, pattern: ^https:// }
        event_types:
          type: array
          minItems: 1
          maxItems: 16
          items: { $ref: "#/components/schemas/DatabaseWebhookEventPattern" }
        header_names:
          type: array
          maxItems: 8
          items:
            type: string
            pattern: ^[A-Za-z][A-Za-z0-9-]{0,63}$
        created_at: { type: string, format: date-time }
        secret:
          type: string
          minLength: 1
          description: Signing secret, returned only by this creation answer.
    DatabaseWebhookSubscription:
      type: object
      additionalProperties: false
      required: [id, environment, state, generation, provider_id]
      properties:
        id: { $ref: "#/components/schemas/Ulid" }
        environment: { type: string, enum: [dev, prod] }
        state: { type: string, enum: [creating, active, deactivating, inactive] }
        generation: { type: integer, minimum: 1, maximum: 9007199254740991 }
        provider_id: { type: [string, "null"], pattern: "^whk_[a-z0-9]{20}$" }
    DatabaseWebhookSubscriptionActivation:
      type: object
      additionalProperties: false
      required: [id, environment, state, generation, provider_id, secret]
      properties:
        id: { $ref: "#/components/schemas/Ulid" }
        environment: { type: string, enum: [dev, prod] }
        state: { type: string, const: active }
        generation: { type: integer, minimum: 1, maximum: 9007199254740991 }
        provider_id: { type: string, pattern: "^whk_[a-z0-9]{20}$" }
        secret:
          {
            type: string,
            minLength: 1,
            description: Generation signing secret available only on the exact authorized activation or retry.,
          }
    DatabaseWebhookPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/DatabaseWebhook" }
    DatabaseWebhookDeleted:
      type: object
      additionalProperties: false
      required: [id, deleted]
      properties:
        id:
          type: string
          pattern: ^whk_[a-z0-9]{20}$
        deleted: { type: boolean, const: true }
    DatabaseWebhookDelivery:
      type: object
      additionalProperties: false
      required:
        - id
        - event_id
        - event_type
        - webhook_id
        - state
        - attempts
        - created_at
        - next_attempt_at
        - delivered_at
        - last_status
        - last_error
      properties:
        id:
          type: string
          pattern: ^dlv_[0-9a-f]{20}$
        event_id:
          type: string
          pattern: "^(?:evt_[0-9a-f]{20}|[a-z][a-z0-9]{19}:[1-9][0-9]{0,15}:[1-9][0-9]{0,15})$"
        event_type:
          oneOf:
            - $ref: "#/components/schemas/DatabaseWebhookEventType"
            - type: string
              pattern: '^data\.[a-z][a-z0-9_]{0,47}$'
        webhook_id:
          type: string
          pattern: ^whk_[a-z0-9]{20}$
        state: { type: string, enum: [pending, delivered, dead_lettered] }
        attempts: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        next_attempt_at: { type: [string, "null"], format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }
        last_status: { type: [integer, "null"] }
        last_error:
          type: [string, "null"]
          enum: [timeout, network, http, expired, permanent, null]
    DatabaseWebhookDeliveryPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/DatabaseWebhookDelivery" }
        next_cursor:
          type: [string, "null"]
          minLength: 1
          maxLength: 200
    DatabaseWebhookTestResult:
      type: object
      additionalProperties: false
      required: [delivered, status, error, duration_ms]
      properties:
        delivered: { type: boolean }
        status: { type: [integer, "null"] }
        error:
          type: [string, "null"]
          enum: [timeout, network, http, null]
        duration_ms: { type: integer, minimum: 0 }
    DatabaseWebhookReplayAccepted:
      type: object
      additionalProperties: false
      required: [delivery_id, state]
      properties:
        delivery_id:
          type: string
          pattern: ^dlv_[0-9a-f]{20}$
        state: { type: string, const: pending }
    DatabaseScheduleSetRequest:
      type: object
      additionalProperties: false
      required: [statements, confirm]
      oneOf:
        - required: [cron]
        - required: [every_seconds]
      properties:
        cron:
          type: string
          minLength: 9
          maxLength: 120
          description: Five-field cron expression evaluated in UTC. Send exactly one of cron or every_seconds.
        every_seconds:
          type: integer
          minimum: 60
          maximum: 2678400
          description: Interval in seconds between runs. Send exactly one of cron or every_seconds.
        statements:
          type: array
          minItems: 1
          maxItems: 20
          description: Statements run in order by the application's runtime role. At most 16 KiB per statement and 64 KiB in total.
          items:
            type: string
            minLength: 1
            maxLength: 16384
            pattern: '\S'
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 30000
          default: 10000
        enabled:
          type: boolean
          default: true
        confirm:
          type: boolean
          const: true
          description: Confirms that the statements run with the application's runtime role.
    DatabaseSchedule:
      type: object
      additionalProperties: false
      required:
        - name
        - environment
        - cron
        - every_seconds
        - statements
        - timeout_ms
        - enabled
        - next_run_at
        - created_at
      oneOf:
        - properties:
            cron: { type: string, minLength: 9, maxLength: 120 }
            every_seconds: { type: "null" }
        - properties:
            cron: { type: "null" }
            every_seconds: { type: integer, minimum: 60, maximum: 2678400 }
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,62}$
        environment: { type: string, enum: [dev, prod] }
        cron: { type: [string, "null"] }
        every_seconds: { type: [integer, "null"] }
        statements:
          type: array
          maxItems: 20
          items: { type: string }
        timeout_ms: { type: integer, minimum: 1000, maximum: 30000 }
        enabled: { type: boolean }
        next_run_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    DatabaseSchedulePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/DatabaseSchedule" }
    DatabaseScheduleDeleted:
      type: object
      additionalProperties: false
      required: [name, deleted]
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,62}$
        deleted: { type: boolean, const: true }
    DatabaseScheduleRun:
      type: object
      additionalProperties: false
      required:
        - id
        - schedule
        - scheduled_at
        - started_at
        - finished_at
        - outcome
        - sqlstate
        - attempts
        - manual
      properties:
        id: { type: integer, minimum: 0 }
        schedule:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,62}$
        scheduled_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: string, format: date-time }
        outcome:
          type: string
          enum:
            - succeeded
            - failed
            - timed_out
            - outcome_unknown
            - rejected
            - skipped_capacity
            - skipped_suspended
            - skipped_deleted
            - skipped_missed
        sqlstate: { type: [string, "null"] }
        attempts: { type: integer, minimum: 0 }
        manual: { type: boolean }
    DatabaseScheduleRunPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/DatabaseScheduleRun" }
    DatabaseScheduleRunAccepted:
      type: object
      additionalProperties: false
      required: [schedule, state]
      properties:
        schedule:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,62}$
