            connection_uri:
              type: string
              format: uri
              description: Returned exactly once. Use it immediately and never store it in files, notes or source.
            psql_command:
              type: string
              description: The same credential as a ready psql invocation.
    ProjectDatabaseAccessPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ProjectDatabaseAccess" }
    SetDevAccessModeRequest:
