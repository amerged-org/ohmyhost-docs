        referral_url:
          type: string
          format: uri
          pattern: ^https://ohmyho\.st/\?r=ref-[0-7][0-9a-hjkmnp-tv-z]{25}$
    SetPoweredByFlagRequest:
      type: object
      additionalProperties: false
      required: [enabled]
