      summary: Get the current project deployment status
      description: Returns the immutable project handle, current source, default environment, head
        deployment, independently evidenced dev and prod gateway origins, latest operation, and
        cleanup state without exposing provider credentials.
      parameters:
        - $ref: "#/components/parameters/RequestId"
