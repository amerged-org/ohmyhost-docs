        deployment_id: { $ref: "#/components/schemas/Ulid" }
        cron: { type: string, maxLength: 64 }
        scheduled_at: { type: string, format: date-time }
        state: { type: string, enum: [due, running, retry, succeeded, failed] }
        attempt: { type: integer, minimum: 0, maximum: 3 }
        status_code: { type: [integer, "null"], minimum: 100, maximum: 599 }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    FunctionRunPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/FunctionRun" }
    DeploymentDiagnostic:
      type: object
      additionalProperties: false
      required: [id, source, code, message, occurred_at]
      properties:
        id: { $ref: "#/components/schemas/Ulid" }
        source: { type: string, enum: [build, control, runtime, function] }
        code: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,63}$" }
        message: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,127}$" }
        exception_class: { type: string, maxLength: 128 }
        file: { type: string, maxLength: 512 }
        line: { type: integer, minimum: 1 }
        column: { type: integer, minimum: 0 }
        route: { type: string, maxLength: 512 }
        request_id: { type: string, maxLength: 128 }
        trace_id: { type: string, maxLength: 128 }
        duration_ms: { type: integer, minimum: 0, maximum: 900000 }
        excerpt:
          type: string
          minLength: 1
          maxLength: 16384
          description: "The customer's own output with control characters removed before storage: on
            BUILD_FAILED the tail of the install/build output (newest lines last), on
            HEALTH_CHECK_FAILED the head of the body the health check was answered with (at most
            4096 characters, never a header). A running application holds its environment's secrets
            and this answer is not scanned for them, so, like a query of the project's database, a
            HEALTH_CHECK_FAILED excerpt is returned only to an owner of the project; never answer a
            health check with a secret."
        excerpt_truncated:
          type: boolean
          description:
            Whether output was omitted from excerpt (earlier build output, or the rest of the
            health answer). Present exactly when excerpt is present.
        status_code:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status the health check was answered with; present only on
            HEALTH_CHECK_FAILED. The probe is a cookieless GET of route that follows no redirect, so
            a 3xx is unhealthy too.
        occurred_at: { type: string, format: date-time }
    DeploymentDiagnosticPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/DeploymentDiagnostic" }
        next_cursor: { type: string, maxLength: 2048 }
    ProjectDatabaseWriteRequest:
      type: object
      additionalProperties: false
      required: [environment, statement, parameters]
      properties:
        environment: { type: string, enum: [dev, prod] }
        statement:
          type: string
          minLength: 1
          maxLength: 65536
          description:
            One direct INSERT, UPDATE or DELETE, max 64 KiB UTF-8; entire JSON request is limited
            to 65,600 bytes.
        parameters:
          type: array
          maxItems: 100
          items: {}
          description: JSON values, at most 8 levels and 10000 nodes, max 64 KiB encoded.
    ProjectDatabaseWriteReceipt:
      type: object
      additionalProperties: false
      required: [operation_id, environment, state, command, affected_rows, error]
      properties:
        operation_id: { $ref: "#/components/schemas/Ulid" }
        environment: { type: string, enum: [dev, prod] }
        state: { type: string, enum: [running, succeeded, failed] }
        command: { type: [string, "null"], enum: [INSERT, UPDATE, DELETE, null] }
        affected_rows: { type: [integer, "null"], minimum: 0, maximum: 1000 }
        error:
          oneOf:
            - $ref: "#/components/schemas/OperationFailure"
            - type: "null"
    ProjectDatabaseQueryRequest:
      type: object
      additionalProperties: false
      required: [environment, statement, parameters]
      properties:
        environment:
          type: string
          enum: [dev, prod]
        statement:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: ^\s*(?:SELECT|WITH)\b
        parameters:
          type: array
          maxItems: 32
          items:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: "null"
    ProjectDatabaseQueryResult:
      type: object
      additionalProperties: false
      required: [environment, rows, row_count, truncated]
      properties:
        environment:
          type: string
          enum: [dev, prod]
        rows:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: true
        row_count:
          type: integer
          minimum: 0
          maximum: 100
        truncated:
          type: boolean
    ProjectDatabaseAccessRequest:
      type: object
      additionalProperties: false
      required: [environment]
      properties:
        environment:
          type: string
          enum: [dev, prod]
        mode:
          type: string
          enum: [read, write]
          default: read
          description:
            read joins the read-only role; write joins the restricted runtime role. Neither can
            change schema.
        ttl_seconds:
          type: integer
          minimum: 300
          maximum: 86400
          default: 3600
          description: Credential lifetime between 5 minutes and 24 hours.
        label:
          type: [string, "null"]
          minLength: 1
          maxLength: 64
          description: Optional customer label without control characters or surrounding whitespace.
    ProjectDatabaseAccess:
      type: object
      additionalProperties: false
      required:
        - access_id
        - environment
        - mode
        - role_name
        - host
        - database
        - label
        - state
        - issued_at
        - expires_at
        - revoked_at
        - revocation_reason
      properties:
        access_id: { $ref: "#/components/schemas/Ulid" }
        environment: { type: string, enum: [dev, prod] }
        mode: { type: string, enum: [read, write] }
        role_name:
          type: string
          pattern: ^ohmyho_da_[0-7][0-9a-hjkmnp-tv-z]{25}_[0-9a-z]{8}$
        host: { type: string, minLength: 1, maxLength: 253 }
        database: { type: string, const: neondb }
        label: { type: [string, "null"], minLength: 1, maxLength: 64 }
        state: { type: string, enum: [active, expired, revoked] }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
