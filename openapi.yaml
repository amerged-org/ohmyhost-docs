  /v1/organizations/{organization_id}/billing/checkouts:
    post:
      operationId: createBillingCheckout
      summary: Create or resume an owner's hosted Stripe Checkout
      description:
        Returns a human payment URL, never charges a saved card. Paid is USD 10/month; each
        top-up pack is USD 10 before tax; a purchase grants 100 credits per dollar up to USD 100 and
        125 credits per dollar for the part above, so 10 packs grant 10000 and 20 packs grant 22500
        credits. Top-ups require active Paid access and have no time limit during uninterrupted Paid
        membership; remaining top-ups expire when the workspace returns to Free. Monthly Paid
        credits expire at billing-period end without rollover. Retry the same offer, packs and
        Idempotency-Key after uncertainty. Browser return is not payment proof; read this checkout
        and the organization balance. A conflicting or existing subscription returns
        billing_purchase_conflict (409); read the original checkout or request an owner billing
        portal URL instead of another purchase. Works at zero credits.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: organization_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Ulid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [offer, packs]
              properties:
                offer: { type: string, enum: [topup, paid] }
                packs:
                  {
                    type: integer,
                    minimum: 1,
                    maximum: 100,
                    description: Paid requires exactly one pack.,
                  }
      responses:
        "201":
          description: Original checkout and its current provider-observed status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingCheckout" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "402": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/organizations/{organization_id}/billing/checkouts/{checkout_id}:
    get:
      operationId: getBillingCheckout
      summary: Observe and reconcile an owner's original checkout
      description:
        Reads Stripe and reconciles confirmed credits/refunds idempotently. payment_confirmed
        describes the original Checkout, not spendable credit or current Paid entitlement. Read
        organization credits for available funding and the organization account's effective plan
        for Paid coverage; paid_until is the paid Stripe period end, not the end of renewal grace. No new
        purchase intent or payment is created; an uncertain original Checkout can resume using its
        stored identity.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: organization_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Ulid" }
        - name: checkout_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Ulid" }
      responses:
        "200":
          description: Current observed checkout and credit reconciliation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingCheckout" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/organizations/{organization_id}/billing/portal:
    post:
      operationId: createBillingPortal
      summary: Open the owner's Stripe billing portal
      description:
        Creates a short-lived human URL for invoices, payment method updates and cancellation
        at period end. Does not charge or change the subscription itself. Customer and return URL
        are server-selected. Request a fresh URL if the portal has expired. Works at zero credits.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: organization_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Ulid" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: Short-lived portal URL; do not log it or commit it as evidence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingPortal" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/organizations/{organization_id}/billing/recharge:
    get:
      operationId: getBillingRecharge
      summary: Read auto-recharge and the current payment handoff
      description:
        Owner-only. Reads saved consent and gross UTC-month spending; a pending Stripe card
        setup may be resumed. No charge is initiated by reading. Private Stripe URLs must not be
        logged.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: organization_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Ulid" }
      responses:
        "200":
          description: Actual recharge settings; disabled by default.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingRecharge" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    put:
      operationId: configureBillingRecharge
      summary: Enable or disable explicitly authorized auto-recharge
      description:
        Owner-only. An agent must obtain explicit approval for off-session charges and the
        gross monthly spending cap before enabling. Each refill costs USD 9 before tax for 1000
        top-up credits when available credits fall below 100. Active Paid access is required to
        enable recharge and initiate a payment; remaining refill credits expire on downgrade to
        Free. A saved Stripe card is required; follow setup_url if returned. Current revision
        prevents stale edits; retry the original Idempotency-Key and payload after uncertainty.
        Disable prevents new charge initiation; already initiated payments may complete. No
        subscription or Paid features are created.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: organization_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Ulid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, monthly_limit_minor, consent, revision]
              properties:
                enabled: { type: boolean }
                monthly_limit_minor:
                  {
                    type: integer,
                    minimum: 1000,
                    maximum: 100000,
                    description: Gross USD cents per UTC calendar month including tax.,
                  }
                consent:
                  {
                    type: [string, "null"],
                    enum: [off_session_v1, null],
                    description: Explicit Owner consent when enabling; null when disabling.,
                  }
                revision: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Saved policy and optional Stripe card setup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingRecharge" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "402": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/organizations/{organization_id}/credits:
    get:
      operationId: getOrganizationCredits
      summary: Read the owner's shared organization credit pool
      description: Returns posted credits and reservations, in microcredits (one credit is 1000000
        microcredits). Monthly entitlement posting is idempotent. Only the organization Owner may
        read this balance. active_meters names the currently billed sources; unreported usage is not
        included. platform_overrun_micros is recorded platform exposure, not customer debt. Remains
        available at zero credit.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: organization_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Ulid"
      responses:
        "200":
          description: Current organization credit balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationCredits"
        "400":
