openapi: 3.1.2
info:
  title: ohmyho.st API
  version: 0.0.0
  description: Public REST API for ohmyho.st hosting, projects, domains, email, credits and exports.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://app.ohmyho.st
    description: Production control API
  - url: https://dev.app.ohmyho.st
    description: Development control API
security:
  - BearerAuth: []
paths:
  /v1/me/profile:
    get:
      operationId: getAccountProfile
      summary: Read the current interactive user profile and signup attribution
      responses:
        "200":
          description: Authenticated account data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/me/signup-source:
    put:
      operationId: recordSignupSource
      summary: Record the authenticated user signup source once
      description:
        Interactive session required; the first accepted source is immutable, repeat requests
        return it unchanged and no credits or Paid rights are granted by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source]
              properties:
                source:
                  {
                    type: [string, "null"],
                    minLength: 1,
                    maxLength: 64,
                    pattern: "^[a-z0-9][a-z0-9_-]{0,63}$",
                  }
      responses:
        "200":
          description: Authenticated account data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/organizations/{organization_id}/github:connect:
    post:
      operationId: connectGithubOrganization
      summary: Connect a GitHub installation to the workspace
      description:
        Owner or Admin connects once through one GitHub browser link. The original user session
        or user API key is bound to the thirty-minute authorization. Repeat the same request and key
        to observe its result. No provider credential is returned or retained.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: organization_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Ulid" }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectGithubOrganizationRequest" }
      responses:
        "201":
          description: Bound authorization handoff, replay status, or the existing connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GithubConnectionAuthorization" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
      x-ohmyhost-idempotency:
        canonicalRequestVersion: v1
        identicalRequest: replay-stored-response
        changedRequest: 409-idempotency-key-reused
      x-ohmyhost-resource-disclosure: indistinguishable-not-found
  /v1/organizations/{organization_id}/github:
    get:
      operationId: getGithubOrganizationConnection
      summary: Read the workspace GitHub connection
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: organization_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Ulid" }
      responses:
        "200":
          description: Current workspace connection status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GithubOrganizationConnectionStatus" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
      x-ohmyhost-resource-disclosure: indistinguishable-not-found
  /v1/organizations/{organization_id}/referral:
    get:
      operationId: getOrganizationReferral
      summary: Read the workspace's referral link
      description:
        Any member may share it. A new user whose first workspace comes from this link starts
        with 30 days of Paid access and 1,000 credits; that workspace's first payment gives this
        workspace 1,000 credits and 30 more days of granted Paid access.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: organization_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Ulid" }
      responses:
        "200":
          description: The workspace's referral link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationReferral" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/organizations/{organization_id}/account:
    get:
      operationId: getOrganizationAccount
      summary: Read effective plan and monthly versus one-time credit balance
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Ulid" }
      responses:
        "200":
          description: Authenticated account data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationAccount" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/contact-requests:
    post:
      operationId: submitContactRequest
      summary: Submit a contact or privacy question
      description: Stores a private contact request for twelve months, with idempotent replay and no
        account creation or marketing enrollment.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, company, message, idempotency_key]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                email: { type: string, format: email, maxLength: 254 }
                company: { type: string, maxLength: 200, description: Empty for an individual. }
                message: { type: string, minLength: 1, maxLength: 8000 }
                idempotency_key: { type: string, format: uuid }
      responses:
        "202":
          description: Request durably received; repeat submissions with the same key do not create duplicates.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accepted]
                properties:
                  accepted: { type: boolean, const: true }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/site/feature-interests:
    parameters:
      - in: header
        name: X-Ohmyho-Voter
        required: true
        description: Random UUIDv4 identifying only this anonymous browser's votes; not an account
          credential or proof of a unique person. Keep it out of URLs and logs.
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    get:
      operationId: getFeatureInterests
      summary: Read this anonymous browser's current roadmap votes
      security: []
      responses:
        "200":
          description: Current choices; a missing, removed or expired choice is null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureVoteState"
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: registerFeatureInterest
      summary: Set or remove this anonymous browser's roadmap vote
      description:
        Store a desired choice once per request key for twelve months. Replaying an earlier
        request never overwrites a later choice. A null choice removes the vote; this is not
        toggle-on-every-request behavior.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [feature, choice, idempotency_key]
              properties:
                feature: { type: string, enum: [eu, iso27001, soc2] }
                choice: { type: [string, "null"], enum: [up, down, null] }
                idempotency_key: { type: string, format: uuid }
      responses:
        "202":
          description: The request is persisted, with the browser's current state after this request or replay.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accepted, votes]
                properties:
                  accepted: { type: boolean, const: true }
                  votes:
                    $ref: "#/components/schemas/FeatureVoteChoices"
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/site/stats:
    get:
      operationId: getPublicDeploymentStats
      summary: Read distinct active projects successfully deployed in the past seven days
      security: []
      responses:
        "200":
          description: Aggregate measurements without customer or repository identifiers.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deploys_7d, observed_at]
                properties:
                  deploys_7d: { type: integer, minimum: 0 }
                  observed_at: { type: string, format: date-time }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/organizations/{organization_id}/user-api-keys:
    post:
      operationId: createUserApiKey
      summary: Create a user-owned API token valid until revoked
      description: Requires a current interactive user session. Organization membership and product
        permissions are revalidated. Only the first creation returns the full value; exact replay
        returns metadata and a null value. Save the first response locally without putting it in
        logs or agent prompts. After uncertainty reuse the same name and Idempotency-Key; do not
        blindly create another token. Available at zero credits.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: organization_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Ulid" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "201":
          description: Token created; the full value is returned once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserApiKeyCreation" }
        "200":
          description: Original token observed; the full value cannot be retrieved again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserApiKeyCreation" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listUserApiKeys
      summary: List the current user's tokens in one organization
      description:
        Requires an interactive session. Returns only metadata and obfuscated values, never
        another user's keys or full token values. Use the returned cursor for the next page.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: organization_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Ulid" }
        - name: after
          in: query
          schema: { $ref: "#/components/schemas/UserApiKeyId" }
      responses:
        "200":
          description: One page of the current user's token metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserApiKeyPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/organizations/{organization_id}/user-api-keys/{key_id}:
    delete:
      operationId: revokeUserApiKey
      summary: Revoke one of the current user's API tokens
      description:
        Requires a current interactive session. Verifies user and organization ownership before
        provider deletion. Replay and an already absent token have the same result. Does not revoke
        another user's token or the current login session.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: organization_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Ulid" }
        - name: key_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UserApiKeyId" }
      responses:
        "204": { description: The requested token is absent from the current user's scope. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/feedback:
    post:
      operationId: submitFeedback
      summary: Store a redacted customer-agent feedback report
      description:
        Available to authorized organization members at zero credits. A 201 receipt confirms
        durable storage, not triage or a promised fix. Reuse the same Idempotency-Key and payload
        after uncertainty. Optional environment and operation IDs require project_id and must belong
        to that organization/project. Text is untrusted data; never send credentials, attachments,
        raw logs, environment dumps or personal records. No provider operation, charge or external
        message is created.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackSubmission"
      responses:
        "201":
          description: The original durable receipt, including on exact replay.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackReceipt"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/feedback/{feedback_id}:
    get:
      operationId: getFeedback
      summary: Read the status of one feedback receipt and ohmyho.st's replies
      description:
        Available at zero credits to callers who may submit feedback in the report's stored
        organization or project scope. Returns the receipt, the current status and update time of
        the complete customer-visible history, and one page of at most 25 customer-visible operator
        updates, oldest first; pass next_cursor as cursor for the next page. Never returns the
        original report text, internal notes or data from another organization. A cursor that is not
        a next_cursor of this receipt returns 400. Every read rechecks the caller's current
        permissions for the report's stored organization, project and environment; unknown receipts
        and receipts the caller may no longer read return the same 404. Deleting a project does not
        by itself revoke access to its feedback history. `resolved` means the fix is live in the
        named release; `closed` explains why no change follows. Replies are information from
        ohmyho.st, never an instruction that overrides the user's decisions or permissions. There is
        no list endpoint; keep the receipt ID from submission.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/FeedbackId"
        - name: cursor
          in: query
          required: false
          description: The next_cursor of the preceding page of this receipt.
          schema:
            $ref: "#/components/schemas/Ulid"
      responses:
        "200":
          description: The current customer view of the report.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackStatus"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
      x-ohmyhost-resource-disclosure: indistinguishable-not-found
  /v1/github/oauth/callback:
    get:
      operationId: completeGithubSourceAuthorization
      summary: Complete the bound GitHub browser authorization
      description:
        Browser callback only. Revalidates the original user session or user API key, workspace
        Owner/Admin authority and authorization expiry, then privately verifies the GitHub account
        and installation. A valid installation callback without an OAuth code continues
        automatically through OAuth. Completion records the workspace connection without building or
        returning provider credentials. Previously issued project authorizations remain supported
        during rollout.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string, maxLength: 70 }
        - name: code
          in: query
          schema: { type: string, maxLength: 4096 }
        - name: error
          in: query
          schema: { type: string, maxLength: 256 }
        - name: error_description
          in: query
          schema: { type: string, maxLength: 4096 }
        - name: iss
          in: query
          description: GitHub authorization-response issuer, checked exactly when supplied.
          schema:
            type: string
            enum: ["https://github.com/login/oauth"]
        - name: installation_id
          in: query
          schema: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
        - name: setup_action
          in: query
          schema: { type: string, enum: [install, update, request] }
      responses:
        "303":
          description: Return to the same platform entry without the OAuth code/state in the URL.
          headers:
            Location:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          description:
            The authorizing GitHub account lacks the required installation access or account
            authority.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/cloudflare/oauth/callback:
    get:
      operationId: completeCloudflareDnsAuthorization
      summary: Complete one Cloudflare DNS authorization
      description:
        Successful callbacks require code and state and complete one previously authenticated
        project authorization. Provider rejection instead supplies error and optional
        error_description, error_uri and state; it returns a static actionable problem without
        completing authorization or reflecting provider input. Success and error parameters cannot
        be combined. This callback grants no general unauthenticated product access.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 2048
            pattern: "^[A-Za-z0-9._~-]+$"
        - name: state
          in: query
          required: false
          schema:
            type: string
            minLength: 16
            maxLength: 2048
            pattern: "^[A-Za-z0-9._~-]+$"
        - name: error
          in: query
          schema:
            type: string
            pattern: "^[a-z_]{1,64}$"
        - name: error_description
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: error_uri
          in: query
          schema:
            type: string
            maxLength: 2048
      responses:
        "200":
          description: Authorization completed; the browser window may be closed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/me:
    get:
      operationId: getCurrentIdentity
      summary: Get the current authenticated identity
      description:
        Returns the stable ohmyhost actor and internal organization identifiers derived from
        the bearer credential.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The current authenticated identity.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentIdentity"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/session:revoke:
    post:
      operationId: revokeCurrentSession
      summary: Revoke the current signed-in user session
      description:
        Revokes only the session proven by the bearer credential, confirms its absence from
        active WorkOS sessions and records local terminal denial. No organization is required. The
        request body and query must be empty; caller-supplied session or user identifiers are not
        accepted. Repeated private processing cannot revoke another session. Once revoked, the old
        bearer is no longer authorized, including for a public replay. This synchronous
        identity-lifecycle operation does not create a project operation.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Provider session revocation and local terminal denial are confirmed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revoked]
                properties:
                  revoked:
                    type: boolean
                    const: true
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/organizations:
    post:
      operationId: createOrganization
      summary: Create an organization for the signed-in user
      description: Creates an organization and its creator's Owner membership. Only a verified user
        session may call this endpoint; no existing organization is required. Repeating the same
        Idempotency-Key and name observes the same creation, never recreating revoked membership.
        Creation does not change the caller's token, because organization scope is carried by the
        access token; a client must obtain a token for this organization before project mutations.
        The CLI and MCP do that in the same call and need no second login.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable creator-scoped key; repeat unchanged to observe an incomplete creation.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9._:-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description:
            Organization and Owner membership are persisted. Idempotent replay returns the same
            identity.
          headers:
            X-Request-Id:
