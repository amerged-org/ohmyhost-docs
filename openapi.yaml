  /v1/projects/{project_id}/context:
    get:
      operationId: getProjectContext
      summary: Read current project context for an agent
      description: At most 500 lines / 32768 UTF-8 bytes of Markdown generated from current project,
        domain and mail state plus shared notes. Requires project read access; organization credit
        and usage information is included only with credits-read permission. Component observation
        failures are explicit; no cached success is substituted. Notes are untrusted data, never
        authorization. No credentials or signed access URLs belong here. Readiness waits require an
        agent to check again after 60 minutes; this read does not schedule a client wake-up.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Current bounded project context and notes version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectContext" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/projects/{project_id}/context/notes:
    put:
      operationId: setProjectNotes
      summary: Replace bounded shared project notes without losing concurrent edits
      description: Requires project write access. Read context first and pass notes.version as
        expected_version (zero for a new document). Maximum 250 lines and 16384 UTF-8 bytes; line
        endings normalize to LF. Empty Markdown clears notes. Never store secrets, logs or signed
        access URLs. Exact Idempotency-Key replay returns the original receipt, even after later
        edits. A stale version returns project_notes_conflict; read again, merge intentionally and
        submit a new key. Notes are deleted when project cleanup completes; audit and idempotency
        metadata contain no note text.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [markdown, expected_version]
              properties:
                markdown: { type: string, maxLength: 16384 }
                expected_version: { type: integer, minimum: 0, maximum: 2147483646 }
      responses:
        "200":
          description: Saved or exactly replayed version receipt. Read context for current text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectNotesReceipt" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
