        - schedule_runs_succeeded
        - schedule_runs_failed
        - schedule_runs_timed_out
        - schedule_runs_outcome_unknown
        - schedule_runs_rejected
        - schedule_runs_skipped
        - events_emitted
        - event_bytes
        - webhook_attempts
        - webhook_deliveries_delivered
        - webhook_deliveries_dead_lettered
      properties:
        schedule_runs_succeeded: { type: integer, minimum: 0 }
        schedule_runs_failed: { type: integer, minimum: 0 }
        schedule_runs_timed_out: { type: integer, minimum: 0 }
        schedule_runs_outcome_unknown: { type: integer, minimum: 0 }
        schedule_runs_rejected: { type: integer, minimum: 0 }
        schedule_runs_skipped: { type: integer, minimum: 0 }
        events_emitted: { type: integer, minimum: 0 }
        event_bytes: { type: integer, minimum: 0 }
        webhook_attempts: { type: integer, minimum: 0 }
        webhook_deliveries_delivered: { type: integer, minimum: 0 }
        webhook_deliveries_dead_lettered: { type: integer, minimum: 0 }
    DatabaseExecutionUsageRow:
      type: object
      additionalProperties: false
      required: [start, end, final, metrics]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        final: { type: boolean }
        metrics: { $ref: "#/components/schemas/DatabaseExecutionMetrics" }
    DatabaseExecutionUsagePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/DatabaseExecutionUsageRow" }
        next_cursor:
          type: [string, "null"]
          minLength: 1
          maxLength: 200
    SetDevAccessModeRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [protected, public]
    OrganizationReferral:
      type: object
      additionalProperties: false
      required: [organization_id, referral_url]
      properties:
        organization_id:
          $ref: "#/components/schemas/Ulid"
        referral_url:
          type: string
          format: uri
          pattern: ^https://ohmyho\.st/\?r=ref-[0-7][0-9a-hjkmnp-tv-z]{25}$
    SetPoweredByFlagRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
    PoweredByFlag:
      type: object
      additionalProperties: false
      required: [project_id, enabled, enabled_at]
      properties:
        project_id:
          $ref: "#/components/schemas/Ulid"
        enabled: { type: boolean }
        enabled_at:
          description: When the current owner switched the flag on; null while it is hidden.
          type: [string, "null"]
          format: date-time
    DevAccessState:
      type: object
      additionalProperties: false
      required: [project_id, mode, share_url]
      properties:
        project_id:
          $ref: "#/components/schemas/Ulid"
        mode:
          type: string
          enum: [protected, public]
        share_url:
          description: Owner-only persistent bearer link in protected mode; null when public or revoked.
          oneOf:
            - type: string
              format: uri
              pattern: ^https://dev-[a-z0-9]+(?:-[a-z0-9]+){0,4}\.(?:dev\.)?check\.omh\.st/\.ohmyhost/dev-access/redeem\?stage=dev&ticket=[A-Za-z0-9_-]{43}$
            - type: "null"
    DevAccessTicket:
      type: object
      additionalProperties: false
      required:
        - ticket_id
        - project_id
        - environment_id
        - origin
        - redeem_url
        - expires_at
      properties:
        ticket_id:
          $ref: "#/components/schemas/Ulid"
        project_id:
          $ref: "#/components/schemas/Ulid"
        environment_id:
          $ref: "#/components/schemas/Ulid"
        origin:
          type: string
          format: uri
          pattern: ^https://dev-[a-z0-9]+(?:-[a-z0-9]+){0,4}\.(?:dev\.)?check\.omh\.st$
        redeem_url:
          type: string
          format: uri
          pattern: ^https://dev-[a-z0-9]+(?:-[a-z0-9]+){0,4}\.(?:dev\.)?check\.omh\.st/\.ohmyhost/dev-access/redeem\?stage=dev&ticket=[A-Za-z0-9_-]{43}$
        expires_at:
          type: string
          format: date-time
    PlanDeploymentRequest:
      type: object
      additionalProperties: false
      required:
        - commit_sha
      properties:
        commit_sha:
          $ref: "#/components/schemas/GitCommitSha"
        environment:
          type: string
          enum:
            - dev
            - prod
          description:
            The environment the deployment builds into. Omission selects Dev when it exists,
            otherwise Prod. Prod switches Prod traffic once activated.
    CreateDeploymentRequest:
      type: object
      additionalProperties: false
      required:
        - plan_id
      properties:
        plan_id:
          $ref: "#/components/schemas/Ulid"
    DeploymentPlan:
      type: object
      description: Immutable pre-build deployment plan. It expires exactly 24 hours after creation.
      additionalProperties: false
      x-ohmyhost-ttl-seconds: 86400
      required:
        - id
        - project_id
        - environment
        - commit_sha
        - source_digest
        - build_plan_digest
        - application_root
        - runtime
        - route
        - resource_effects
        - limits
        - estimated_cost
        - risks
        - destructive_effects
        - required_confirmations
        - created_at
        - expires_at
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        project_id:
          $ref: "#/components/schemas/Ulid"
        environment:
          type: string
          enum:
            - dev
            - prod
          description: The environment this plan builds into.
        commit_sha:
          $ref: "#/components/schemas/GitCommitSha"
        source_digest:
          $ref: "#/components/schemas/Sha256Digest"
        build_plan_digest:
          $ref: "#/components/schemas/Sha256Digest"
        application_root:
          type: string
          description: Canonical repository-relative application root selected from immutable source evidence.
          readOnly: true
          maxLength: 64
          pattern: '^(?:\.|[A-Za-z0-9][A-Za-z0-9._-]{0,62}(?:/[A-Za-z0-9][A-Za-z0-9._-]{0,62}){0,7})$'
        artifact_digest:
          $ref: "#/components/schemas/Sha256Digest"
        runtime:
          type: string
          enum:
            - cloudflare_workers_static_assets
            - cloudflare_workers_edge_ssr
        route:
          type: string
          description:
            Server-derived project-isolated public deployment URL; clients cannot select its
            gateway host or target Worker.
          format: uri
          pattern: ^https://
        resource_effects:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
        limits:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
        estimated_cost:
          $ref: "#/components/schemas/CostEstimate"
        risks:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
        destructive_effects:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
        required_confirmations:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    CostEstimate:
      type: object
      description:
        Build-compute reservation quote, not the lifetime cost of the application. credits is
        the reserved amount in credits as a decimal (credit_micros divided by one million), the
        figure to show people. amount_micros is the customer USD equivalent of credit_micros;
        provider_cost_micros is the corresponding published provider-list basis. The versioned price
        is fixed by this immutable deployment plan. reserved_seconds is the reserved build time in
        seconds. The measured build seconds settle the reservation and unused credits are released.
        Storage, mail and runtime costs are separate.
      additionalProperties: false
      required:
        - amount_micros
        - currency
        - rate_card_version
        - credit_micros
        - credits
        - provider_cost_micros
        - scope
        - reserved_seconds
      properties:
        amount_micros:
          type: string
          pattern: ^[0-9]+$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        rate_card_version:
          type: string
          minLength: 1
          maxLength: 128
        credit_micros:
          type: string
          pattern: ^[0-9]+$
        credits:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        provider_cost_micros:
          type: string
          pattern: ^[0-9]+$
        scope:
          type: string
          const: build_compute
        reserved_seconds:
          type: string
          pattern: ^[1-9][0-9]*$
    Deployment:
      type: object
      additionalProperties: false
      required:
        - id
        - project_id
        - operation_id
        - commit_sha
        - source_digest
        - build_plan_digest
        - status
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        project_id:
          $ref: "#/components/schemas/Ulid"
        operation_id:
          $ref: "#/components/schemas/Ulid"
        commit_sha:
          $ref: "#/components/schemas/GitCommitSha"
        source_digest:
          $ref: "#/components/schemas/Sha256Digest"
        build_plan_digest:
          $ref: "#/components/schemas/Sha256Digest"
        artifact_digest:
          $ref: "#/components/schemas/Sha256Digest"
        status:
          type: string
          enum:
            - queued
            - building
            - publishing
            - active
            - failed
            - rolled_back
            - deleting
            - deleted
            - reconciliation_required
        url:
          type: string
          description: Project-isolated public gateway URL for the observed deployment.
          format: uri
          pattern: ^https://
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DeploymentPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Deployment"
        next_cursor:
          type:
            - string
            - "null"
          pattern: ^[A-Za-z0-9_-]+$
    GuardedActionPlan:
      type: object
      description:
        Non-mutating guarded-action plan with a confirmation token that expires exactly ten
        minutes after creation.
      additionalProperties: false
      x-ohmyhost-ttl-seconds: 600
      required:
        - action
        - project_id
        - resource_etag
        - effects
        - risks
        - confirmation_token
        - created_at
        - expires_at
      properties:
        action:
          type: string
          enum:
            - rollback
            - promote
            - delete
        project_id:
          $ref: "#/components/schemas/Ulid"
        target_deployment_id:
          $ref: "#/components/schemas/Ulid"
        target_artifact_digest:
          $ref: "#/components/schemas/Sha256Digest"
        source_deployment_id:
          $ref: "#/components/schemas/Ulid"
        source_artifact_digest:
          $ref: "#/components/schemas/Sha256Digest"
        source_environment:
          type: string
          const: dev
        target_environment:
          type: string
          const: prod
        resource_etag:
          type: string
          minLength: 3
          maxLength: 128
          description: Send as If-Match with this plan's confirmation token.
        effects:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
        risks:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
        confirmation_token:
          $ref: "#/components/schemas/ConfirmationToken"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      oneOf:
        - properties:
            action:
              const: rollback
          required:
            - target_deployment_id
            - target_artifact_digest
        - properties:
            action:
              const: promote
          required:
            - source_deployment_id
            - source_artifact_digest
            - source_environment
            - target_environment
        - properties:
            action:
              const: delete
          not:
            anyOf:
              - required:
                  - target_deployment_id
              - required:
                  - target_artifact_digest
              - required:
                  - source_deployment_id
              - required:
                  - source_artifact_digest
              - required:
                  - source_environment
              - required:
                  - target_environment
    ConfirmationToken:
      type: string
      description:
        Opaque, single-action token bound to the planned action, project, target resource, and
        resource ETag.
      minLength: 32
      maxLength: 4096
      pattern: ^[A-Za-z0-9._~-]+$
    GitCommitSha:
      type: string
      description: Exact full Git commit object identifier; abbreviated or branch references are forbidden.
      pattern: ^[0-9a-f]{40}$
    Sha256Digest:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    ProjectDataMode:
      type: string
      enum: [shared, isolated]
      default: shared
      description: Optional at creation, default shared. shared uses one data area across Dev/Prod;
        isolated gives each environment its own database/Auth records and file namespace. The four
        Owner-confirmed data-change actions reassign or reset areas without copying data or files
        and without a special change fee; ordinary measured resource consumption still applies.
        A reset or merge removes the named Dev resources. Promotion applies pending schema
        migrations to isolated Prod without copying Dev data.
    HostingRegion:
      type: string
      enum: [us, eu]
      default: us
      description:
        Chosen at project creation and immutable through customer operations. us (default) or eu
        places new build resources and, when no storage is already assigned, new file buckets.
        Existing buckets, source repositories and historical artifacts retain their recorded
        locations independently of a platform-authorized project-region migration. New PGCF
        application databases follow the selected project region; existing owner-authorized
        migrations target US1. Read database compute for the actual database region.
        storage.jurisdiction must match the project's recorded storage location, or this region
        when no storage custody exists. Project context reports the authoritative storage
        jurisdiction. Prices are identical in both project regions.
    FeedbackSubmission:
      type: object
      additionalProperties: false
      required: [organization_id, kind, title, description]
      dependentRequired:
        environment_id: [project_id]
        operation_id: [project_id]
      properties:
        organization_id:
          $ref: "#/components/schemas/Ulid"
        project_id:
          $ref: "#/components/schemas/Ulid"
        environment_id:
          $ref: "#/components/schemas/Ulid"
        operation_id:
          $ref: "#/components/schemas/Ulid"
        kind:
          type: string
          enum: [bug, issue, feature_request]
        title:
          type: string
          minLength: 1
          maxLength: 160
          description: Trimmed title without control characters.
        description:
          type: string
          minLength: 1
          maxLength: 8000
          description:
            Trimmed, redacted expected/actual behavior and minimal reproduction. Line breaks and
            tabs are accepted; other control characters are rejected. Never include raw logs,
            environment files, credentials or personal records.
        error_code:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:/+-]{0,127}$"
          maxLength: 128
        client_version:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:/+-]{0,127}$"
          maxLength: 128
    FeedbackReceipt:
      type: object
      additionalProperties: false
      required: [id, organization_id, submitted_at]
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        organization_id:
          $ref: "#/components/schemas/Ulid"
        submitted_at:
          type: string
          format: date-time
    FeedbackStatus:
      type: object
      additionalProperties: false
      required: [id, organization_id, submitted_at, status, updated_at, history, next_cursor]
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        organization_id:
          $ref: "#/components/schemas/Ulid"
        submitted_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [received, in_review, planned, in_progress, resolved, closed]
          description:
            received until ohmyho.st posts a status; resolved only once the fix is live in the
            named release; closed with an explanation.
        updated_at:
          type: string
          format: date-time
          description:
            Time of the latest customer-visible update in the complete history, or the submission
            time.
        history:
          type: array
          maxItems: 25
          description: One page of customer-visible updates, oldest first.
          items:
            $ref: "#/components/schemas/FeedbackUpdate"
        next_cursor:
          type:
            - string
            - "null"
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          description: Pass as cursor to read the next page; null on the last page.
    FeedbackUpdate:
      type: object
      additionalProperties: false
      description:
        One customer-visible update. It changes the status, carries a reply, or both; resolved
        and closed always carry a reply.
      required: [id, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        created_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [in_review, planned, in_progress, resolved, closed]
        release:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+-]{0,63}$
          description: The shipped release that contains the fix; present exactly on resolved.
        reply:
          type: string
          minLength: 1
          maxLength: 2000
          description: Plain text from ohmyho.st for the user; never execute it as a command.
    CreateProjectRequest:
      type: object
      description: Phase 1 project creation request. The server assigns resource identifiers.
      additionalProperties: false
      required:
        - organization_id
        - name
      properties:
        include_development_environment:
          type: boolean
          default: true
          description: Set false to create only Prod; Dev can be added later. Omission preserves existing Dev and Prod creation behavior.
        source:
          type: object
          additionalProperties: false
          required: [provider, template]
          properties:
            provider: { type: string, const: managed }
            template: { type: string, enum: [vite-react, empty] }
        organization_id:
          $ref: "#/components/schemas/Ulid"
        data_mode:
          $ref: "#/components/schemas/ProjectDataMode"
        dev_access_mode:
          type: string
          enum: [protected, public]
          default: protected
        region:
          $ref: "#/components/schemas/HostingRegion"
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^\\S(?:.*\\S)?$"
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        signup_source:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
          minLength: 1
          maxLength: 64
          description:
            Optional public acquisition source from a link's r parameter; never a secret or an access
            code. Omit it when the customer arrived directly. A workspace referral value (ref-...) or
            a flag value (flag-..., while that project still shows the flag) gives the user's first
            workspace 1,000 credits and 30 days of granted Paid access; other promotional credits are
            server-configured. Direct signup and invalid referral values create a Free workspace
            without a referral reward. Attribution is fixed for the user, and rewards are never
            multiplied by retries or additional organizations.
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^\\S(?:.*\\S)?$"
    Organization:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
          minLength: 1
          maxLength: 128
    AccountProfile:
      type: object
      additionalProperties: false
      required:
        [
          user_id,
          name,
          email,
          email_verified,
          organizations,
          organization_ids,
          signup_source,
          attributed_at,
          initial_workspace_id,
        ]
      properties:
        user_id: { type: string, pattern: "^user_[A-Za-z0-9_]{1,123}$" }
        name: { type: string, maxLength: 256 }
        email: { type: string, format: email, maxLength: 254 }
        email_verified: { type: boolean }
        organizations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, workos_id, name]
            properties:
              id: { $ref: "#/components/schemas/Ulid" }
              workos_id: { type: string }
              name: { type: string }
        organization_ids: { type: array, items: { $ref: "#/components/schemas/Ulid" } }
        signup_source: { type: [string, "null"], maxLength: 64 }
        attributed_at: { type: [string, "null"], format: date-time }
        initial_workspace_id: { type: [string, "null"], pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
    OrganizationAccount:
      type: object
      additionalProperties: false
      required:
        [
          organization_id,
          name,
          workos_organization_id,
          plan,
          plan_source,
          paid_until,
          available_micros,
          monthly_micros,
          one_time_micros,
          reserved_micros,
          next_expiry,
          as_of,
        ]
      properties:
        organization_id: { $ref: "#/components/schemas/Ulid" }
        name: { type: string }
        workos_organization_id: { type: string }
        plan: { type: string, enum: [free, paid] }
        plan_source: { type: string, enum: [free, stripe, granted, manual] }
        paid_until:
          {
            type: [string, "null"],
            format: date-time,
            description: "End of the paid coverage: the Stripe billing period plus its 14-day renewal grace, or the end of the grant; null on Free. Paid features stay available until this instant.",
          }
        available_micros:
          {
            $ref: "#/components/schemas/CreditMicros",
            description: "Spendable credit: monthly plus one-time credit minus the open reservations, never below zero.",
          }
        monthly_micros:
          {
            $ref: "#/components/schemas/CreditMicros",
            description: "The monthly credit, which ends at next_expiry; the Free allowance is 200 credits and the Paid allowance 1000 credits per period.",
          }
        one_time_micros:
          {
            $ref: "#/components/schemas/CreditMicros",
            description: "Top-up, bonus and referral credit. It does not expire.",
          }
        reserved_micros:
          {
            $ref: "#/components/schemas/CreditMicros",
            description: "Credit held for open builds; it is part of the monthly and one-time credit until the build settles.",
          }
        next_expiry:
          {
            type: [string, "null"],
            format: date-time,
            description: "When the monthly credit ends and renews; null when none is left.",
          }
        as_of: { type: string, format: date-time }
    CurrentIdentity:
      type: object
      description: Customer-visible current account and credential organization scope for authenticated agent clients.
      additionalProperties: false
      required:
        - actor_id
        - email
        - organization_ids
        - organizations
      properties:
        actor_id:
          type: string
          minLength: 1
          maxLength: 256
        email:
          type: [string, "null"]
          format: email
          minLength: 3
          maxLength: 254
          pattern: '^(?!.*[\p{Cc}\p{Cf}\p{Zl}\p{Zp}])[^\s@]+@[^\s@.]+(?:\.[^\s@.]+)+$'
          description: Email of the current user or user API-key owner; null for machine-to-machine credentials.
        organization_ids:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Ulid"
        organizations:
          type: array
          description: Current names for exactly the organization_ids scope, in the same order, plus effective plan and available credits where the caller can read the workspace account.
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id:
                $ref: "#/components/schemas/Ulid"
              name:
                type: string
                minLength: 1
                maxLength: 128
                pattern: '^(?![\s\S]*[\u0000-\u001F\u007F])\S(?:[\s\S]*\S)?(?![\s\S])'
                description: Current organization display name without surrounding whitespace or ASCII control characters.
              plan:
                type: string
                enum: [free, paid]
              remaining_credits_micros:
                type: string
                pattern: "^(0|[1-9][0-9]{0,18})$"
                description: Available credits in millionths, after open reservations.
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - organization_id
        - name
        - handle
        - data_mode
        - region
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        organization_id:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^\\S(?:.*\\S)?$"
        handle:
          type: string
          minLength: 3
          maxLength: 59
          pattern: ^[a-z0-9]+(-[a-z0-9]+){0,4}$
        data_mode:
          $ref: "#/components/schemas/ProjectDataMode"
        region:
          $ref: "#/components/schemas/HostingRegion"
        created_at:
          type: string
          format: date-time
    ProjectPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        next_cursor:
          type:
            - string
            - "null"
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
    ProjectEnvironment:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
          minLength: 1
          maxLength: 128
    ProjectHandleAvailability:
      type: object
      additionalProperties: false
      required:
        - handle
        - available
        - alternatives
      properties:
        handle:
          type: string
          description: The handle exactly as it was asked about.
        available:
          type: boolean
          description: True when a project may take this handle now.
        reason:
          type: string
          description: Why the handle cannot be used. Absent when it is available.
          enum:
            - taken
            - too_short
            - too_long
            - invalid_shape
            - prohibited_word
        alternatives:
          type: array
          description: Free handles to offer instead, empty when the handle is available.
          maxItems: 5
          items:
            type: string
    ProjectStatus:
      type: object
      additionalProperties: false
      required:
        - project_id
        - etag
        - handle
        - region
        - dev_access_mode
        - lifecycle
        - source
        - default_environment
        - head_deployment
        - dev_url
        - prod_url
        - latest_operation
        - cleanup_state
      properties:
        custom_domains:
          type: array
          maxItems: 64
          description: Custom hostnames of this project with their environment and current configuration state.
          items:
            type: object
            additionalProperties: false
            required: [hostname, environment, state]
            properties:
              hostname: { type: string, minLength: 1, maxLength: 253 }
              environment: { type: string, const: prod }
              state: { type: string, enum: [awaiting_deployment, pending, active, deleting] }
        etag:
          type: string
          pattern: '^"sha256-[a-f0-9]{64}"$'
          description:
            Optimistic-concurrency token for changing this project address; use it as If-Match on
            the handle endpoint.
        project_id:
          $ref: "#/components/schemas/Ulid"
        handle:
          type: string
          minLength: 3
          maxLength: 59
          pattern: ^[a-z0-9]+(-[a-z0-9]+){0,4}$
        region:
          $ref: "#/components/schemas/HostingRegion"
        dev_access_mode:
          type: string
          enum: [protected, public]
        lifecycle:
          type: string
          enum:
            - active
            - deleting
            - deleted
        source:
          oneOf:
            - $ref: "#/components/schemas/ProjectSource"
            - type: "null"
        default_environment:
          oneOf:
            - $ref: "#/components/schemas/ProjectEnvironment"
            - type: "null"
        environments:
          type: array
          maxItems: 2
          description:
            Tenant-scoped Dev and Prod environment IDs for secrets and other environment-scoped
            commands. Select by name; never infer the Prod ID from the default Dev environment.
          items:
            $ref: "#/components/schemas/ProjectEnvironment"
        head_deployment:
          oneOf:
            - $ref: "#/components/schemas/Deployment"
            - type: "null"
        dev_url:
          oneOf:
            - type: string
              format: uri
              pattern: ^https://dev-[a-z0-9]+(?:-[a-z0-9]+){0,4}\.(?:dev\.)?check\.omh\.st$
            - type: "null"
        prod_url:
          oneOf:
            - type: string
              format: uri
              pattern: ^https://[a-z0-9]+(?:-[a-z0-9]+){0,4}\.(?:dev\.)?check\.omh\.st$
            - type: "null"
        expected_dev_url:
          description:
            Deterministic Dev gateway address this project will receive once deployed, or null when
            the project has no Dev environment.
          oneOf:
            - type: string
              format: uri
              pattern: ^https://dev-[a-z0-9]+(?:-[a-z0-9]+){0,4}\.(?:dev\.)?check\.omh\.st$
            - type: "null"
        expected_prod_url:
          description: Deterministic Prod gateway address this project will receive once deployed.
          oneOf:
            - type: string
              format: uri
              pattern: ^https://[a-z0-9]+(?:-[a-z0-9]+){0,4}\.(?:dev\.)?check\.omh\.st$
            - type: "null"
        latest_operation:
          oneOf:
            - $ref: "#/components/schemas/Operation"
            - type: "null"
        cleanup_state:
          type: string
          enum:
            - not_started
            - pending
            - completed
            - reconciliation_required
