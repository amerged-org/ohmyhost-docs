            properties:
              commit_sha: { $ref: "#/components/schemas/CommitSha" }
              parent_commit_sha: { $ref: "#/components/schemas/NullableCommitSha" }
              message: { type: string, maxLength: 20000 }
              created_at: { type: string, format: date-time }
    ManagedSourceDiff:
      type: object
      additionalProperties: false
      required: [from_commit_sha, to_commit_sha, changes]
      properties:
        from_commit_sha: { $ref: "#/components/schemas/CommitSha" }
        to_commit_sha: { $ref: "#/components/schemas/CommitSha" }
        changes:
          type: array
          maxItems: 4000
          items:
            type: object
            additionalProperties: false
            required:
              [path, change, before_sha256, after_sha256, before_executable, after_executable]
            properties:
              path: { $ref: "#/components/schemas/ManagedSourcePath" }
              change: { type: string, enum: [added, modified, deleted] }
              before_sha256: { type: [string, "null"], pattern: "^sha256:[a-f0-9]{64}$" }
              after_sha256: { type: [string, "null"], pattern: "^sha256:[a-f0-9]{64}$" }
              before_executable: { type: [boolean, "null"] }
              after_executable: { type: [boolean, "null"] }
    FunctionRun:
      type: object
