  /v1/github/oauth/callback:
    get:
      operationId: completeGithubSourceAuthorization
      x-ohmyhost-mcp:
        disposition: excluded
        tool_names: []
        reason: Browser OAuth callback; github_connect starts the existing protected authorization handoff.
      summary: Complete the bound GitHub browser authorization
      description:
        Browser callback only. Requires the portal session of the same user who started the
        authorization (a browser with no session, another user's session or an unknown state is
        answered as an unknown state and consumes nothing). Revalidates the original user session
        or user API key, workspace Owner/Admin authority and authorization expiry, then privately
        verifies the GitHub account and installation. A valid installation callback without an
        OAuth code continues automatically through OAuth. Completion records the workspace
        connection without building or returning provider credentials. Previously issued project
        authorizations remain supported during rollout.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string, maxLength: 70 }
        - name: code
          in: query
          schema: { type: string, maxLength: 4096 }
        - name: error
          in: query
          schema: { type: string, maxLength: 256 }
        - name: error_description
          in: query
          schema: { type: string, maxLength: 4096 }
        - name: iss
          in: query
          description: GitHub authorization-response issuer, checked exactly when supplied.
          schema:
            type: string
            enum: ["https://github.com/login/oauth"]
        - name: installation_id
          in: query
          schema: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
        - name: setup_action
          in: query
          schema: { type: string, enum: [install, update, request] }
      responses:
        "303":
          description: Return to the same platform entry without the OAuth code/state in the URL.
          headers:
            Location:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          description:
            The authorizing GitHub account lacks the required installation access or account
            authority. It is also the answer, for a machine client, to an unknown state, to another
            user's portal session and to a missing portal session; a browser is sent to the
            unknown-state page instead.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/cloudflare/oauth/callback:
    get:
      operationId: completeCloudflareDnsAuthorization
      x-ohmyhost-mcp:
        disposition: excluded
        tool_names: []
        reason: Browser OAuth callback; use the existing protected DNS authorization workflow.
      summary: Complete one Cloudflare DNS authorization
      description:
        Successful callbacks require code and state. A project DNS authorization completes in the
        same browser that confirmed the ohmyho.st handoff, with no ohmyho.st sign-in required.
        The exchange uses S256 PKCE. A missing or invalid browser confirmation consumes nothing.
        The project callback explains whether to reopen the same link, request a new link, or revoke
        the Cloudflare authorization after a failed cleanup. Separate application identity and workspace sender authorizations require the
        initiating user's portal session.
        Provider rejection instead supplies error and optional error_description, error_uri and
        state; it returns a static actionable problem without completing authorization or
        reflecting provider input. Success and error parameters cannot be combined. This callback
        grants no general unauthenticated product access.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 2048
            pattern: "^[A-Za-z0-9._~-]+$"
        - name: state
          in: query
          required: false
          schema:
            type: string
            minLength: 16
            maxLength: 2048
            pattern: "^[A-Za-z0-9._~-]+$"
        - name: error
          in: query
          schema:
            type: string
            pattern: "^[a-z_]{1,64}$"
        - name: error_description
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: error_uri
          in: query
          schema:
            type: string
            maxLength: 2048
      responses:
        "200":
          description: Authorization completed; the browser window may be closed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          description: The authorization could not complete. Follow the recovery instructions.
          content:
            text/html:
              schema:
                type: string
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
