components:
  headers:
    ETag:
      description: Opaque version of this response body. Not accepted as If-Match.
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 128
    XRequestId:
      description: Correlates the request with operations, events, logs, and audit records.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  parameters:
    PreviewEnvironment:
      name: environment
      in: query
      required: true
      description: The concrete project environment to preview.
      schema: { type: string, enum: [dev, prod] }
    AuditCursor:
      name: cursor
      in: query
      description: Opaque continuation cursor returned by the preceding page.
      required: false
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]+$
    AuditLimit:
      name: limit
      in: query
      description: Maximum number of audit events to return.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Identifies one mutation and its canonical request payload.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKeyToken:
      name: Idempotency-Key
      in: header
      description: "Identifies one mutation and its canonical request payload; only letters, digits and the characters . _ : - are accepted."
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    IfMatch:
      name: If-Match
      in: header
      description:
        Use resource_etag from a fresh rollback, promotion, deletion or data-change plan. For a
        project address change, use etag from project status; an ETag from another representation is
        not accepted.
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 128
    ConfirmationToken:
      name: X-Confirmation-Token
      in: header
      description: Ten-minute token bound to the planned action, project, target resource, and resource ETag.
      required: true
      schema:
        $ref: "#/components/schemas/ConfirmationToken"
    RequestId:
      name: X-Request-Id
      in: header
      description: Optional caller-provided correlation identifier.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ProjectId:
      name: project_id
      in: path
      description: Project identifier.
      required: true
      schema:
        $ref: "#/components/schemas/Ulid"
    DatabaseAccessId:
      name: access_id
      in: path
      description: Issued database credential identifier.
      required: true
      schema:
        $ref: "#/components/schemas/Ulid"
    DatabaseEnvironmentRead:
      name: environment
      in: query
      description: Application environment to read; dev when omitted.
      required: false
      schema:
        type: string
        enum: [dev, prod]
        default: dev
    DatabaseEnvironmentFilter:
      name: environment
      in: query
      description: Restrict the listing to one application environment.
      required: false
      schema:
        type: string
        enum: [dev, prod]
    DatabaseEnvironment:
      name: environment
      in: query
      description: Application environment the mutation applies to.
      required: true
      schema:
        type: string
        enum: [dev, prod]
    DatabaseWebhookId:
      name: webhook_id
      in: path
      description: Database webhook identifier.
      required: true
      schema:
        type: string
        pattern: ^whk_[a-z0-9]{20}$
    DatabaseWebhookSubscriptionId:
      name: subscription_id
      in: path
      required: true
      description: Stable, client-chosen subscription ULID.
      schema: { $ref: "#/components/schemas/Ulid" }
    DatabaseWebhookGeneration:
      name: generation
