          description: Owner-only persistent bearer link in protected mode; null when public or revoked.
          oneOf:
            - type: string
              format: uri
              pattern: ^https://dev-[a-z0-9]+(?:-[a-z0-9]+){0,4}\.(?:dev\.)?check\.omh\.st/\.ohmyhost/dev-access/redeem\?stage=dev&ticket=[A-Za-z0-9_-]{43}$
            - type: "null"
    DevAccessTicket:
      type: object
      additionalProperties: false
      required:
        - ticket_id
        - project_id
        - environment_id
        - origin
        - redeem_url
        - expires_at
      properties:
        ticket_id:
          $ref: "#/components/schemas/Ulid"
        project_id:
          $ref: "#/components/schemas/Ulid"
        environment_id:
          $ref: "#/components/schemas/Ulid"
        origin:
          type: string
          format: uri
          pattern: ^https://dev-[a-z0-9]+(?:-[a-z0-9]+){0,4}\.(?:dev\.)?check\.omh\.st$
        redeem_url:
          type: string
          format: uri
          pattern: ^https://dev-[a-z0-9]+(?:-[a-z0-9]+){0,4}\.(?:dev\.)?check\.omh\.st/\.ohmyhost/dev-access/redeem\?stage=dev&ticket=[A-Za-z0-9_-]{43}$
        expires_at:
          type: string
          format: date-time
    PlanDeploymentRequest:
      type: object
      additionalProperties: false
      required:
        - commit_sha
      properties:
        commit_sha:
          $ref: "#/components/schemas/GitCommitSha"
        environment:
          type: string
          enum:
            - dev
            - prod
          default: dev
          description:
            The environment the deployment builds into. Prod skips Dev and switches Prod traffic
            once activated.
    CreateDeploymentRequest:
      type: object
      additionalProperties: false
      required:
        - plan_id
      properties:
        plan_id:
          $ref: "#/components/schemas/Ulid"
    DeploymentPlan:
      type: object
      description: Immutable pre-build deployment plan. It expires exactly 24 hours after creation.
      additionalProperties: false
      x-ohmyhost-ttl-seconds: 86400
      required:
        - id
        - project_id
        - environment
        - commit_sha
        - source_digest
        - build_plan_digest
        - application_root
        - runtime
        - route
        - resource_effects
        - limits
        - estimated_cost
        - risks
        - destructive_effects
        - required_confirmations
        - created_at
        - expires_at
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        project_id:
          $ref: "#/components/schemas/Ulid"
        environment:
          type: string
          enum:
            - dev
            - prod
          description: The environment this plan builds into.
        commit_sha:
          $ref: "#/components/schemas/GitCommitSha"
        source_digest:
          $ref: "#/components/schemas/Sha256Digest"
        build_plan_digest:
          $ref: "#/components/schemas/Sha256Digest"
        application_root:
          type: string
          description: Canonical repository-relative application root selected from immutable source evidence.
          readOnly: true
          maxLength: 64
          pattern: '^(?:\.|[A-Za-z0-9][A-Za-z0-9._-]{0,62}(?:/[A-Za-z0-9][A-Za-z0-9._-]{0,62}){0,7})$'
        artifact_digest:
          $ref: "#/components/schemas/Sha256Digest"
        runtime:
          type: string
          enum:
            - cloudflare_workers_static_assets
            - cloudflare_workers_edge_ssr
        route:
          type: string
          description:
            Server-derived project-isolated public deployment URL; clients cannot select its
            gateway host or target Worker.
          format: uri
          pattern: ^https://
        resource_effects:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
        limits:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
        estimated_cost:
          $ref: "#/components/schemas/CostEstimate"
        risks:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
        destructive_effects:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
        required_confirmations:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    CostEstimate:
      type: object
      description:
        Build-compute reservation quote, not the lifetime cost of the application. credits is
        the reserved amount in credits as a decimal (credit_micros divided by one million), the
        figure to show people. amount_micros is the customer USD equivalent of credit_micros;
        provider_cost_micros is the corresponding published provider-list basis. The versioned price
        is fixed by this immutable deployment plan. reserved_seconds is the reserved build time in
        seconds. The measured build seconds settle the reservation and unused credits are released.
        Storage, mail and runtime costs are separate.
      additionalProperties: false
      required:
        - amount_micros
        - currency
        - rate_card_version
        - credit_micros
        - credits
        - provider_cost_micros
        - scope
        - reserved_seconds
      properties:
        amount_micros:
          type: string
          pattern: ^[0-9]+$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        rate_card_version:
          type: string
          minLength: 1
          maxLength: 128
        credit_micros:
          type: string
          pattern: ^[0-9]+$
        credits:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        provider_cost_micros:
          type: string
          pattern: ^[0-9]+$
        scope:
          type: string
          const: build_compute
        reserved_seconds:
          type: string
          pattern: ^[1-9][0-9]*$
    Deployment:
      type: object
      additionalProperties: false
      required:
        - id
        - project_id
        - operation_id
        - commit_sha
        - source_digest
        - build_plan_digest
        - status
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        project_id:
          $ref: "#/components/schemas/Ulid"
        operation_id:
          $ref: "#/components/schemas/Ulid"
        commit_sha:
          $ref: "#/components/schemas/GitCommitSha"
        source_digest:
          $ref: "#/components/schemas/Sha256Digest"
        build_plan_digest:
          $ref: "#/components/schemas/Sha256Digest"
        artifact_digest:
          $ref: "#/components/schemas/Sha256Digest"
        status:
          type: string
          enum:
            - queued
            - building
            - publishing
            - active
            - failed
            - rolled_back
            - deleting
            - deleted
            - reconciliation_required
        url:
          type: string
          description: Project-isolated public gateway URL for the observed deployment.
          format: uri
          pattern: ^https://
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DeploymentPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Deployment"
        next_cursor:
          type:
            - string
            - "null"
          pattern: ^[A-Za-z0-9_-]+$
    GuardedActionPlan:
      type: object
      description:
        Non-mutating guarded-action plan with a confirmation token that expires exactly ten
        minutes after creation.
      additionalProperties: false
      x-ohmyhost-ttl-seconds: 600
      required:
        - action
        - project_id
        - resource_etag
        - effects
        - risks
        - confirmation_token
        - created_at
        - expires_at
      properties:
        action:
          type: string
          enum:
            - rollback
            - promote
            - delete
        project_id:
          $ref: "#/components/schemas/Ulid"
        target_deployment_id:
          $ref: "#/components/schemas/Ulid"
        target_artifact_digest:
          $ref: "#/components/schemas/Sha256Digest"
        source_deployment_id:
          $ref: "#/components/schemas/Ulid"
        source_artifact_digest:
          $ref: "#/components/schemas/Sha256Digest"
        source_environment:
          type: string
          const: dev
        target_environment:
          type: string
          const: prod
        resource_etag:
          type: string
          minLength: 3
          maxLength: 128
          description: Send as If-Match with this plan's confirmation token.
        effects:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
        risks:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
        confirmation_token:
          $ref: "#/components/schemas/ConfirmationToken"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      oneOf:
        - properties:
            action:
              const: rollback
          required:
            - target_deployment_id
            - target_artifact_digest
        - properties:
            action:
              const: promote
          required:
            - source_deployment_id
            - source_artifact_digest
            - source_environment
            - target_environment
        - properties:
            action:
              const: delete
          not:
            anyOf:
              - required:
                  - target_deployment_id
              - required:
                  - target_artifact_digest
              - required:
                  - source_deployment_id
              - required:
                  - source_artifact_digest
              - required:
                  - source_environment
              - required:
                  - target_environment
    ConfirmationToken:
      type: string
      description:
        Opaque, single-action token bound to the planned action, project, target resource, and
        resource ETag.
      minLength: 32
      maxLength: 4096
      pattern: ^[A-Za-z0-9._~-]+$
    GitCommitSha:
      type: string
      description: Exact full Git commit object identifier; abbreviated or branch references are forbidden.
      pattern: ^[0-9a-f]{40}$
    Sha256Digest:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    ProjectDataMode:
      type: string
      enum: [shared, isolated]
      default: shared
      description: Optional at creation, default shared. shared uses one data area across Dev/Prod;
        isolated gives each environment its own database/Auth records and file namespace. The four
        Owner-confirmed data-change actions reassign or reset areas without copying data or files
        and without a special change fee; ordinary measured resource consumption still applies.
        A reset or merge removes the named Dev resources. Promotion applies pending schema
        migrations to isolated Prod without copying Dev data.
    HostingRegion:
      type: string
      enum: [us, eu]
      default: us
      description:
        Chosen when the project is created and immutable afterwards. us (default) places the
        project's database, files, build sandbox and build objects in the US; eu places them in the
        EU. Prices are identical. ohmyhost.yaml storage.jurisdiction must equal this value.
    FeedbackSubmission:
      type: object
      additionalProperties: false
      required: [organization_id, kind, title, description]
      dependentRequired:
        environment_id: [project_id]
        operation_id: [project_id]
      properties:
        organization_id:
          $ref: "#/components/schemas/Ulid"
        project_id:
          $ref: "#/components/schemas/Ulid"
        environment_id:
          $ref: "#/components/schemas/Ulid"
        operation_id:
          $ref: "#/components/schemas/Ulid"
        kind:
          type: string
          enum: [bug, issue, feature_request]
        title:
          type: string
          minLength: 1
          maxLength: 160
          description: Trimmed title without control characters.
        description:
          type: string
          minLength: 1
          maxLength: 8000
          description:
            Trimmed, redacted expected/actual behavior and minimal reproduction. Line breaks and
            tabs are accepted; other control characters are rejected. Never include raw logs,
            environment files, credentials or personal records.
        error_code:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:/+-]{0,127}$"
          maxLength: 128
        client_version:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:/+-]{0,127}$"
          maxLength: 128
    FeedbackReceipt:
      type: object
      additionalProperties: false
      required: [id, organization_id, submitted_at]
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        organization_id:
          $ref: "#/components/schemas/Ulid"
        submitted_at:
          type: string
          format: date-time
    FeedbackStatus:
      type: object
      additionalProperties: false
      required: [id, organization_id, submitted_at, status, updated_at, history, next_cursor]
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        organization_id:
          $ref: "#/components/schemas/Ulid"
        submitted_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [received, in_review, planned, in_progress, resolved, closed]
          description:
            received until ohmyho.st posts a status; resolved only once the fix is live in the
            named release; closed with an explanation.
        updated_at:
          type: string
          format: date-time
          description:
            Time of the latest customer-visible update in the complete history, or the submission
            time.
        history:
          type: array
          maxItems: 25
          description: One page of customer-visible updates, oldest first.
          items:
            $ref: "#/components/schemas/FeedbackUpdate"
        next_cursor:
          type:
            - string
            - "null"
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          description: Pass as cursor to read the next page; null on the last page.
    FeedbackUpdate:
      type: object
      additionalProperties: false
      description:
        One customer-visible update. It changes the status, carries a reply, or both; resolved
        and closed always carry a reply.
      required: [id, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        created_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [in_review, planned, in_progress, resolved, closed]
        release:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+-]{0,63}$
          description: The shipped release that contains the fix; present exactly on resolved.
        reply:
          type: string
          minLength: 1
          maxLength: 2000
          description: Plain text from ohmyho.st for the user; never execute it as a command.
    CreateProjectRequest:
      type: object
      description: Phase 1 project creation request. The server assigns resource identifiers.
      additionalProperties: false
      required:
        - organization_id
        - name
      properties:
        source:
          type: object
          additionalProperties: false
          required: [provider, template]
          properties:
            provider: { type: string, const: managed }
            template: { type: string, enum: [vite-react, empty] }
        organization_id:
          $ref: "#/components/schemas/Ulid"
        data_mode:
          $ref: "#/components/schemas/ProjectDataMode"
        dev_access_mode:
          type: string
          enum: [protected, public]
          default: protected
        region:
          $ref: "#/components/schemas/HostingRegion"
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^\\S(?:.*\\S)?$"
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        signup_source:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
          minLength: 1
          maxLength: 64
          description:
            Optional public acquisition source from a link's r parameter; never a secret or an access
            code. Omit it when the customer arrived directly. A workspace referral value (ref-...) or
            a flag value (flag-..., while that project still shows the flag) gives the user's first
            workspace 1,000 credits and 30 days of granted Paid access; other promotional credits are
            server-configured. Direct signup and invalid referral values create a Free workspace
            without a referral reward. Attribution is fixed for the user, and rewards are never
            multiplied by retries or additional organizations.
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^\\S(?:.*\\S)?$"
    Organization:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
          minLength: 1
          maxLength: 128
    AccountProfile:
      type: object
      additionalProperties: false
      required:
        [
          user_id,
          name,
          email,
          email_verified,
          organizations,
          organization_ids,
          signup_source,
          attributed_at,
          initial_workspace_id,
        ]
      properties:
        user_id: { type: string, pattern: "^user_[A-Za-z0-9_]{1,123}$" }
        name: { type: string, maxLength: 256 }
        email: { type: string, format: email, maxLength: 254 }
        email_verified: { type: boolean }
        organizations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, workos_id, name]
            properties:
              id: { $ref: "#/components/schemas/Ulid" }
              workos_id: { type: string }
              name: { type: string }
        organization_ids: { type: array, items: { $ref: "#/components/schemas/Ulid" } }
        signup_source: { type: [string, "null"], maxLength: 64 }
        attributed_at: { type: [string, "null"], format: date-time }
        initial_workspace_id: { type: [string, "null"], pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
    OrganizationAccount:
      type: object
      additionalProperties: false
      required:
        [
          organization_id,
          name,
          workos_organization_id,
          plan,
          plan_source,
          paid_until,
          available_micros,
          monthly_micros,
          one_time_micros,
          reserved_micros,
          next_expiry,
          as_of,
        ]
      properties:
        organization_id: { $ref: "#/components/schemas/Ulid" }
        name: { type: string }
        workos_organization_id: { type: string }
        plan: { type: string, enum: [free, paid] }
        plan_source: { type: string, enum: [free, stripe, granted, manual] }
        paid_until:
          {
            type: [string, "null"],
            format: date-time,
            description: "End of the paid Stripe billing period or the applicable grant; null on Free or for an unbounded grant. During an unpaid renewal the effective Paid plan may remain available for up to 14 days after this Stripe period end, without new monthly credits.",
          }
        available_micros: { $ref: "#/components/schemas/CreditMicros" }
        monthly_micros: { $ref: "#/components/schemas/CreditMicros" }
        one_time_micros: { $ref: "#/components/schemas/CreditMicros" }
        reserved_micros: { $ref: "#/components/schemas/CreditMicros" }
        next_expiry: { type: [string, "null"], format: date-time }
        as_of: { type: string, format: date-time }
    CurrentIdentity:
      type: object
      description: Minimal customer-visible identity and organization scope for authenticated agent clients.
      additionalProperties: false
      required:
        - actor_id
        - organization_ids
      properties:
        actor_id:
          type: string
          minLength: 1
          maxLength: 256
        organization_ids:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Ulid"
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - organization_id
        - name
        - handle
        - data_mode
        - region
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        organization_id:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^\\S(?:.*\\S)?$"
        handle:
          type: string
          minLength: 3
          maxLength: 59
          pattern: ^[a-z0-9]+(-[a-z0-9]+){0,4}$
        data_mode:
          $ref: "#/components/schemas/ProjectDataMode"
        region:
          $ref: "#/components/schemas/HostingRegion"
        created_at:
          type: string
          format: date-time
    ProjectPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        next_cursor:
          type:
            - string
            - "null"
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
    ProjectEnvironment:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
          minLength: 1
          maxLength: 128
    ProjectHandleAvailability:
      type: object
      additionalProperties: false
      required:
        - handle
        - available
        - alternatives
      properties:
        handle:
          type: string
          description: The handle exactly as it was asked about.
        available:
          type: boolean
          description: True when a project may take this handle now.
        reason:
          type: string
          description: Why the handle cannot be used. Absent when it is available.
          enum:
            - taken
            - too_short
            - too_long
            - invalid_shape
            - prohibited_word
        alternatives:
          type: array
          description: Free handles to offer instead, empty when the handle is available.
          maxItems: 5
          items:
            type: string
    ProjectStatus:
      type: object
      additionalProperties: false
      required:
        - project_id
        - etag
        - handle
        - region
        - dev_access_mode
        - lifecycle
        - source
        - default_environment
        - head_deployment
        - dev_url
        - prod_url
        - latest_operation
        - cleanup_state
      properties:
        etag:
          type: string
          pattern: '^"sha256-[a-f0-9]{64}"$'
          description:
            Optimistic-concurrency token for changing this project address; use it as If-Match on
            the handle endpoint.
        project_id:
          $ref: "#/components/schemas/Ulid"
        handle:
          type: string
          minLength: 3
          maxLength: 59
          pattern: ^[a-z0-9]+(-[a-z0-9]+){0,4}$
        region:
          $ref: "#/components/schemas/HostingRegion"
        dev_access_mode:
          type: string
          enum: [protected, public]
        lifecycle:
          type: string
          enum:
            - active
            - deleting
            - deleted
        source:
          oneOf:
            - $ref: "#/components/schemas/ProjectSource"
            - type: "null"
        default_environment:
          oneOf:
            - $ref: "#/components/schemas/ProjectEnvironment"
            - type: "null"
        environments:
          type: array
          maxItems: 2
          description:
            Tenant-scoped Dev and Prod environment IDs for secrets and other environment-scoped
            commands. Select by name; never infer the Prod ID from the default Dev environment.
          items:
            $ref: "#/components/schemas/ProjectEnvironment"
        head_deployment:
          oneOf:
            - $ref: "#/components/schemas/Deployment"
            - type: "null"
        dev_url:
          oneOf:
            - type: string
              format: uri
              pattern: ^https://dev-[a-z0-9]+(?:-[a-z0-9]+){0,4}\.(?:dev\.)?check\.omh\.st$
            - type: "null"
        prod_url:
          oneOf:
            - type: string
              format: uri
              pattern: ^https://[a-z0-9]+(?:-[a-z0-9]+){0,4}\.(?:dev\.)?check\.omh\.st$
            - type: "null"
        latest_operation:
          oneOf:
            - $ref: "#/components/schemas/Operation"
            - type: "null"
        cleanup_state:
          type: string
          enum:
            - not_started
            - pending
            - completed
            - reconciliation_required
    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details extended with stable ohmyhost recovery fields.
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - request_id
        - retryable
        - suggested_action
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          enum:
            - invalid_request
            - unauthenticated
            - forbidden
            - organization_required
            - resource_not_found
            - idempotency_key_reused
            - project_handle_unavailable
            - project_identity_unavailable
            - deployment_plan_expired
            - deployment_plan_incompatible
            - confirmation_expired
            - confirmation_invalid
            - etag_mismatch
            - promotion_source_stale
            - promotion_target_stale
            - promotion_invalid_target
            - mail_domain_conflict
            - mail_domain_required
            - mail_capacity_unavailable
            - storage_jurisdiction_conflict
            - shared_data_requires_promotion
            - production_deployment_required
            - framework_conversion_required
            - repository_configuration_missing
            - migration_filename_noncanonical
            - environment_secret_mutation_blocked
            - workers_runtime_incompatible
            - project_handle_invalid
            - project_handle_taken
            - project_handle_unchanged
            - project_rename_blocked
            - payload_too_large
            - rate_limited
            - insufficient_organization_credits
            - paid_plan_required
            - project_budget_exceeded
            - compute_performance_paid_required
            - compute_performance_unavailable
            - database_write_pending
            - database_access_limit
            - compute_change_pending
            - compute_change_conflict
            - billing_purchase_conflict
            - billing_recharge_conflict
            - github_connection_required
            - github_connection_revoked
            - repository_not_installed
            - cloudflare_zone_not_bound
            - cloudflare_authorization_closed
            - project_notes_conflict
            - project_export_not_ready
            - powered_by_flag_required
            - interactive_login_required
            - api_key_creation_uncertain
            - api_key_permissions_unavailable
            - reconciliation_exhausted
            - service_unavailable
            - source_commit_not_found
            - domain_hostname_taken
            - domain_dns_conflict
            - data_change_blocked
            - data_change_in_progress
            - data_change_not_applicable
            - rollback_target_data_changed
            - project_domain_delete_required
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        retryable:
          type: boolean
        retry_after_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: Optional machine-readable retry delay for a rate limit, matching Retry-After.
        suggested_action:
          type: string
          minLength: 1
    Operation:
      type: object
      description:
        Durable record returned for an accepted asynchronous mutation. Optional reconciliation
        is a current observation for queued/running work, separate from immutable terminal state. A
        completed reconciliation attempt alone does not mean the operation succeeded.
      additionalProperties: false
      required:
        - id
        - state
        - created_at
        - updated_at
      properties:
        blocking_operation_id:
          description: The active operation holding this queued operation's project mutation claim.
          $ref: "#/components/schemas/Ulid"
        deployment_id:
          description:
            The deployment this operation created (deploy, promotion or rollback), in every state.
            After a failure, read its diagnostics with deployment logs.
          $ref: "#/components/schemas/Ulid"
        id:
          $ref: "#/components/schemas/Ulid"
        state:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - cancelled
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        result:
          type: object
          additionalProperties: true
        error:
          $ref: "#/components/schemas/OperationFailure"
        progress:
          $ref: "#/components/schemas/OperationDeploymentProgress"
        reconciliation:
          $ref: "#/components/schemas/OperationReconciliation"
    OperationDeploymentProgress:
      type: object
      additionalProperties: false
      description:
        Current deployment dependency observation, separate from immutable operation history.
        Poll the same operation; mail readiness does not mean application activation.
      required:
        [phase, project_id, deployment_id, observed_at, next_poll_after_seconds, suggested_action]
      properties:
        build_completed_at:
          type: string
          format: date-time
          description:
            Actual successful build completion time when this operation ran a build; omitted for
            reused artifacts without a current build.
        phase:
          type: string
          enum: [queued, building, publishing, waiting_for_mail, mail_status_unavailable]
        project_id:
          $ref: "#/components/schemas/Ulid"
        deployment_id:
          $ref: "#/components/schemas/Ulid"
        observed_at:
          type: string
          format: date-time
        next_poll_after_seconds:
          type: integer
          const: 60
        suggested_action:
          type: string
          minLength: 1
          maxLength: 500
    OperationReconciliation:
      type: object
      additionalProperties: false
      required: [state, attempt_id, observed_at, suggested_action]
      properties:
        state:
          type: string
          enum: [required, pending]
        attempt_id:
          oneOf:
            - $ref: "#/components/schemas/Ulid"
            - type: "null"
          description:
            Active attempt for pending reconciliation; null when a new confirmed reconciliation is
            required.
        observed_at:
          type: string
          format: date-time
        suggested_action:
          type: string
          minLength: 1
          maxLength: 500
    ProviderReconciliationAttempt:
      type: object
      description: Provider-neutral status of one idempotent reconciliation attempt.
      additionalProperties: false
      required:
        - reconciliation_id
        - operation_id
        - state
      properties:
        reconciliation_id:
          $ref: "#/components/schemas/Ulid"
        operation_id:
          $ref: "#/components/schemas/Ulid"
        state:
          type: string
          enum:
            - completed
            - pending
            - uncertain
    IdempotencyConflictProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          properties:
            code:
              const: idempotency_key_reused
    OperationEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - operation_id
        - project_id
        - type
        - occurred_at
      properties:
        event_id:
          $ref: "#/components/schemas/Ulid"
        operation_id:
          $ref: "#/components/schemas/Ulid"
        project_id:
          $ref: "#/components/schemas/Ulid"
        type:
          type: string
          enum:
            - OperationQueued
            - OperationStarted
            - OperationSucceeded
            - OperationFailed
            - OperationCancelled
        occurred_at:
          type: string
          format: date-time
        failure:
          $ref: "#/components/schemas/OperationFailure"
    ProjectNotesReceipt:
      type: object
      additionalProperties: false
      required: [version, updated_at]
      properties:
        version: { type: integer, minimum: 1, maximum: 2147483647 }
        updated_at: { type: string, format: date-time }
    DatabaseCompute:
      type: object
      additionalProperties: false
      required: [project_id, environment, data_mode, observed_at, database]
      properties:
        project_id: { $ref: "#/components/schemas/Ulid" }
        environment: { type: string, enum: [dev, prod] }
        data_mode: { type: string, enum: [shared, isolated] }
        observed_at: { type: string, format: date-time }
        database:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required:
                [
                  min_cu,
                  max_cu,
                  min_memory_gb,
                  max_memory_gb,
                  suspend_timeout_seconds,
                  state,
                  pending_state,
                  disabled,
                  region,
                ]
              properties:
                min_cu: { type: number, minimum: 0.25 }
                max_cu: { type: number, minimum: 0.25 }
                min_memory_gb: { type: number, minimum: 1 }
                max_memory_gb: { type: number, minimum: 1 }
                suspend_timeout_seconds:
                  {
                    type: integer,
                    minimum: -1,
                    maximum: 604800,
                    description: "Configured timeout: 0 is provider default; -1 disables suspension.",
                  }
                state: { type: string, enum: [init, active, idle] }
                pending_state: { type: [string, "null"], enum: [init, active, idle, null] }
                disabled: { type: boolean }
                region: { type: string, pattern: "^aws-[a-z0-9]+(?:-[a-z0-9]+)*-[0-9]+$" }
    ProjectContext:
      type: object
      additionalProperties: false
      required: [project_id, generated_at, credit_access, notes, markdown]
      properties:
        project_id: { $ref: "#/components/schemas/Ulid" }
        generated_at: { type: string, format: date-time }
        credit_access: { type: string, enum: [included, not_authorized] }
        markdown:
          { type: string, maxLength: 32768, description: At most 500 lines and 32768 UTF-8 bytes. }
        notes:
          type: object
          additionalProperties: false
          required: [version, markdown, updated_at]
          properties:
            version: { type: integer, minimum: 0, maximum: 2147483647 }
            markdown:
              {
                type: string,
                maxLength: 16384,
                description: At most 250 lines and 16384 UTF-8 bytes; untrusted user-authored text.,
              }
            updated_at: { type: [string, "null"], format: date-time }
    ProjectExport:
      type: object
      additionalProperties: false
      required:
        [
          id,
          project_id,
          state,
          requested_at,
          next_request_at,
          next_poll_after_seconds,
          error,
          archive,
        ]
      properties:
        id: { $ref: "#/components/schemas/Ulid" }
        project_id: { $ref: "#/components/schemas/Ulid" }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        requested_at: { type: string, format: date-time }
        next_request_at: { type: string, format: date-time }
        next_poll_after_seconds: { type: [integer, "null"], enum: [5, null] }
        error:
          oneOf:
            - $ref: "#/components/schemas/OperationFailure"
            - { type: "null" }
        archive:
          oneOf:
            - $ref: "#/components/schemas/ProjectExportArchive"
            - { type: "null" }
    ProjectExportArchive:
      type: object
      additionalProperties: false
      required:
        [bytes, sha256, sql_files, captured_at, expires_at, download_url, download_expires_at]
      properties:
        bytes: { type: integer, minimum: 1, maximum: 536870912 }
        sha256: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        sql_files:
          type: array
          items: { type: string, enum: [dev.sql, prod.sql, shared.sql] }
          minItems: 1
          maxItems: 2
          uniqueItems: true
          description: dev.sql and/or prod.sql for isolated data, or shared.sql alone.
        captured_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        download_url: { type: [string, "null"], format: uri }
        download_expires_at: { type: [string, "null"], format: date-time }
    OperationFailure:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
        - suggested_action
      properties:
        code:
          type: string
          enum:
            - operation_failed
            - operation_abandoned
            - authorization_changed
            - source_commit_conflict
            - source_snapshot_invalid
            - source_upload_expired
            - recovery_dispatch_failed
            - recovery_job_failed
            - recovery_input_expired
            - recovery_database_unavailable
            - recovery_checksum_mismatch
            - recovery_scope_unavailable
            - recovery_archive_too_large
            - build_not_started
            - build_failed
            - database_write_rejected
            - database_write_unavailable
            - database_write_outcome_unknown
            - database_compute_failed
            - database_compute_plan_changed
            - database_compute_rejected
            - database_migration_failed
            - insufficient_organization_credits
            - paid_plan_required
            - runtime_candidate_failed
            - runtime_candidate_rejected
            - storage_jurisdiction_conflict
            - provider_state_absent
            - auto_deploy_plan_rejected
            - promotion_source_stale
            - promotion_target_stale
        message:
          type: string
          minLength: 1
          maxLength: 512
        retryable:
          type: boolean
          const: false
          description: A terminal operation cannot be retried in place; follow suggested_action.
        suggested_action:
          type: string
          minLength: 1
          maxLength: 500
        detail:
          type: string
          minLength: 1
          maxLength: 2000
          description:
            Present only on auto_deploy_plan_rejected when planning the pushed commit returned a
            typed refusal. It is the same fixed catalog sentence that the planning 409 problem
            returns as detail, naming the file, the rule and the required change.
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - audit_event_id
        - project_id
        - event_type
        - actor_type
        - actor_id
        - payload
        - occurred_at
      properties:
        audit_event_id:
          $ref: "#/components/schemas/Ulid"
        project_id:
          $ref: "#/components/schemas/Ulid"
        operation_id:
          $ref: "#/components/schemas/Ulid"
        event_type:
          type: string
          minLength: 1
        actor_type:
          type: string
          minLength: 1
        actor_id:
          type: string
          minLength: 1
        payload:
          $ref: "#/components/schemas/AuditPayloadSummary"
        occurred_at:
          type: string
          format: date-time
    AuditPayloadSummary:
      type: object
      description: A redacted, public summary of an internal audit payload.
      additionalProperties: false
      required:
        - summary
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 512
    AuditEventPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        next_cursor:
          type:
            - string
            - "null"
          pattern: ^[A-Za-z0-9_-]+$
    Ulid:
      type: string
      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
    ProjectDataChangeKind:
      type: string
      enum:
        - isolate_prod_keeps_data
        - isolate_dev_keeps_data
        - share_prod_keeps_data
        - reset_dev
      description:
        Owner-confirmed assignment change. No application data is copied; physical resources
        are provisioned lazily.
    ProjectDataChangeRequest:
      type: object
      additionalProperties: false
      required:
        - change
      properties:
        change:
          $ref: "#/components/schemas/ProjectDataChangeKind"
    ProjectDataChangePlan:
      type: object
      additionalProperties: false
      required:
        - action
        - project_id
        - change
        - data_mode_before
        - data_mode_after
        - effects
        - destructive_effects
        - redeploy_environments
        - risks
        - resource_etag
        - confirmation_token
        - created_at
        - expires_at
      properties:
        action:
          type: string
          const: data_change
        project_id:
          $ref: "#/components/schemas/Ulid"
        change:
          $ref: "#/components/schemas/ProjectDataChangeKind"
        data_mode_before:
          type: string
          enum:
            - shared
            - isolated
        data_mode_after:
          type: string
          enum:
            - shared
            - isolated
        effects: &a1
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 2000
        destructive_effects: *a1
        redeploy_environments:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum:
              - dev
              - prod
        risks: *a1
        resource_etag:
          type: string
          pattern: ^"sha256-[a-f0-9]{64}"$
          description: Send as If-Match with this plan's confirmation token.
        confirmation_token:
          $ref: "#/components/schemas/ConfirmationToken"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      description:
        An action-bound ten-minute plan naming retained, retired and lazily created data areas.
        The workspace Owner confirms its destructive effects before execution.
