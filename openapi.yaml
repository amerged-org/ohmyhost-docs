        state: { type: string, enum: [open, complete, expired] }
        payment_confirmed: { type: boolean }
        url: { type: [string, "null"], format: uri, maxLength: 8192 }
        expires_at: { type: string, format: date-time }
        packs: { type: integer, minimum: 1, maximum: 100 }
        credited_micros: { type: string, pattern: "^(0|[1-9][0-9]{0,18})$" }
        revoked_micros: { type: string, pattern: "^(0|[1-9][0-9]{0,18})$" }
        paid_until: { type: [string, "null"], format: date-time }
        required_action:
          type: string
          enum: [none, complete_checkout, open_billing_portal, contact_support]
          description:
            Human payment handoff. Complete the returned Checkout URL, request a fresh billing
            portal URL to correct billing details, or contact ohmyho.st when tax configuration
            requires review. none includes a draft invoice awaiting automatic processing; it is not
            a claim of current Paid coverage. Never infer renewal success from the historical
            payment_confirmed flag.
        billing_issue: { $ref: "#/components/schemas/BillingTaxIssue" }
    BillingPortal:
      type: object
      additionalProperties: false
      required: [organization_id, url, created_at]
      properties:
        organization_id: { $ref: "#/components/schemas/Ulid" }
        url: { type: string, format: uri, maxLength: 8192 }
        created_at: { type: string, format: date-time }
    OrganizationCredits:
      type: object
      additionalProperties: false
      required:
        [
          organization_id,
          unit,
          as_of,
          available_micros,
          reserved_micros,
          grace_started_at,
          grace_expires_at,
        ]
      properties:
        organization_id:
          $ref: "#/components/schemas/Ulid"
        unit:
          type: string
          const: microcredits
        as_of:
          type: string
          format: date-time
        available_micros:
          $ref: "#/components/schemas/CreditMicros"
        reserved_micros:
          $ref: "#/components/schemas/CreditMicros"
        grace_started_at:
          type: [string, "null"]
          format: date-time
          description: When the credit was used up; null while funded or after the monthly credit renewed.
        grace_expires_at:
          type: [string, "null"]
          format: date-time
          description:
            Seven days after the credit was used up. Existing services and domains are retained
            during this grace; no automatic data deletion. Explicit project stop budgets are
            separate.
    UsageTotal:
      type: string
      description: Non-negative integer aggregate, serialized exactly without floating-point rounding.
      pattern: "^(0|[1-9][0-9]{0,37})$"
    OrganizationCreditUsage:
      type: object
      additionalProperties: false
      required: [organization_id, as_of, unit, period, from, projects, days]
      properties:
        organization_id:
          $ref: "#/components/schemas/Ulid"
        as_of:
          type: string
          format: date-time
        unit:
          type: string
          const: microcredits
        period:
          type: string
          description: The UTC month that projects[].used_micros counts.
          pattern: "^20[0-9]{2}-(0[1-9]|1[0-2])$"
        from:
          type: string
          format: date-time
          description: The start of the oldest UTC day in days.
        projects:
          type: array
          maxItems: 1000
          description: What each project has used so far in period, in ID order; projects without use are left out.
          items:
            type: object
            additionalProperties: false
            required: [project_id, used_micros]
            properties:
              project_id:
                $ref: "#/components/schemas/Ulid"
              used_micros:
                $ref: "#/components/schemas/UsageTotal"
        days:
          type: array
          maxItems: 15
          description: Billed charges of the last up to 14 UTC days, oldest first.
          items:
            type: object
            additionalProperties: false
            required: [day, projects]
            properties:
              day:
                type: string
                pattern: "^20[0-9]{2}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
              projects:
                type: array
                maxItems: 1000
                items:
                  type: object
                  additionalProperties: false
                  required: [project_id, meters]
                  properties:
                    project_id:
                      $ref: "#/components/schemas/Ulid"
                    meters:
                      type: array
                      maxItems: 1000
                      items:
                        type: object
                        additionalProperties: false
                        required:
                          [environment_id, meter, unit, rate_card_id, quantity, charged_micros]
                        properties:
                          environment_id:
                            oneOf:
                              - $ref: "#/components/schemas/Ulid"
                              - type: "null"
                          meter:
                            type: string
                            pattern: "^[A-Za-z0-9_.:/-]{1,128}$"
                          unit:
                            type: string
                            pattern: "^[A-Za-z0-9_.:/-]{1,128}$"
                          rate_card_id:
                            type: string
                            pattern: "^[A-Za-z0-9_.:/-]{1,128}$"
                          quantity:
                            type: string
                            pattern: "^(0|[1-9][0-9]{0,29})(\\.[0-9]{1,20})?$"
                          charged_micros:
                            $ref: "#/components/schemas/UsageTotal"
    SetProjectCreditBudgetRequest:
      type: object
      additionalProperties: false
      required: [amount_micros, mode]
      properties:
        amount_micros:
          description: The monthly budget, at most 9007199254740991 microcredits (about 9 billion credits); null removes it.
          oneOf:
            - $ref: "#/components/schemas/CreditMicros"
            - type: "null"
        mode:
          type: string
          enum: [continue, stop]
    ProjectCreditBudget:
      type: object
      additionalProperties: false
      required:
        [
          project_id,
          amount_micros,
          mode,
          used_micros,
          reserved_micros,
          period_start,
          period_end,
          as_of,
        ]
      properties:
        project_id:
          $ref: "#/components/schemas/Ulid"
        amount_micros:
          oneOf:
            - $ref: "#/components/schemas/CreditMicros"
            - type: "null"
        mode:
          type: string
          enum: [continue, stop]
        used_micros:
          $ref: "#/components/schemas/CreditMicros"
        reserved_micros:
          $ref: "#/components/schemas/CreditMicros"
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        as_of:
          type: string
          format: date-time
    CreateCloudflareDnsAuthorizationRequest:
      type: object
      additionalProperties: false
      required:
        - zone
      properties:
        zone:
          type: string
          minLength: 4
          maxLength: 253
          pattern: '^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'
    CloudflareDnsAuthorization:
      type: object
      description: Private browser link for one Cloudflare OAuth authorization. Project DNS uses an
        ohmyho.st confirmation link. Application identity and workspace sender DNS use direct
        Cloudflare links with the initiating portal session.
      additionalProperties: false
      required:
        - authorization_id
        - authorization_url
        - expires_at
      properties:
        authorization_id:
          $ref: "#/components/schemas/Ulid"
        authorization_url:
          type: string
          format: uri
          minLength: 20
          maxLength: 4096
          pattern: '^https://(?:(?:dev\.)?app\.ohmyho\.st/v1/cloudflare/oauth/authorize\?request=f1\.[0-7][0-9A-HJKMNP-TV-Z]{25}\.[A-Za-z0-9_-]{43}$|dash\.cloudflare\.com/oauth2/auth\?)'
        expires_at:
          type: string
          format: date-time
        verification_code:
          type: string
          pattern: "^[0-9A-F]{6}$"
          description: Present for project confirmation links. Tell the DNS admin this code through a channel they trust.
    CloudflareDnsAuthorizationStatus:
      type: object
      description: Credential-free project authorization state. Without an authorization, status is
        not_authorized, zone and expires_at are null, and scopes is empty. When the consenting user
        no longer holds project write authority, status is reauthorization_required, which names the
        zone while scopes is empty and expires_at is null until the owner authorizes the zone again.
        All other states name the actual customer zone; no platform or customer zone is inferred.
      additionalProperties: false
      required:
        - status
        - zone
        - scopes
        - expires_at
      properties:
        status:
          type: string
          enum:
            - not_authorized
            - pending
            - authorized
            - reauthorization_required
            - expired
            - revoked
        zone:
          type: [string, "null"]
          minLength: 4
          maxLength: 253
          pattern: '^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'
        scopes:
          type: array
          uniqueItems: true
          maxItems: 2
          items:
            type: string
            enum:
              - dns.write
              - zone.read
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    PaidDomainRequest:
      type: object
      additionalProperties: false
      required: [hostname]
      properties:
        hostname:
          type: string
          minLength: 4
          maxLength: 253
          pattern: '^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'
    PaidDomainPlan:
      type: object
      additionalProperties: false
      required: [status, hostname, environment, cname_target, effects, risks]
      properties:
        status: { type: string, const: planned }
        hostname: { type: string, minLength: 4, maxLength: 253 }
        environment: { type: string, const: prod }
        cname_target: { type: string, enum: [customers.omh.st, customers.ohmyho.st] }
        effects:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 512 }
        risks:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 512 }
    PaidDomain:
      type: object
      description:
        awaiting_deployment means the requested hostname is declared but not provisioned. Its hostname
        is present, suspension_reason, custom_hostname_status, ssl_status and url are null.
        validation_records holds only the _omh-project TXT ownership record while the hostname is not yet
        proven, and is empty once it is proven. Publish that record, authorize Cloudflare, deploy to Prod,
        then repeat the same apply.
      additionalProperties: false
      required:
        - status
        - suspension_reason
        - hostname
        - environment
        - cname_target
        - custom_hostname_status
        - ssl_status
        - validation_records
        - url
      properties:
        status:
          type: string
          enum:
            [
              not_configured,
              awaiting_deployment,
              pending,
              active,
              reconciliation_required,
              deleted,
              suspended,
            ]
        suspension_reason:
          type: [string, "null"]
          enum:
            [paid_plan_required, insufficient_organization_credits, project_budget_exceeded, null]
          description:
            Non-null only while suspended by the same Paid, credit-grace or stop-budget policy used
            by the gateway. DNS/TLS receipts remain intact; url is null while suspended.
        hostname:
          oneOf:
            - type: string
              minLength: 4
              maxLength: 253
            - type: "null"
        environment: { type: string, const: prod }
        cname_target: { type: string, enum: [customers.omh.st, customers.ohmyho.st] }
        custom_hostname_status:
          type: [string, "null"]
        ssl_status:
          type: [string, "null"]
        validation_records:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [type, name, content, purpose]
            properties:
              type: { type: string, enum: [CNAME, TXT] }
              name: { type: string, minLength: 1, maxLength: 253 }
              content: { type: string, minLength: 1, maxLength: 2048 }
              purpose: { type: string, enum: [traffic, ownership, ssl, dcv_delegation] }
        url:
          oneOf:
            - type: string
              format: uri
              pattern: ^https://
            - type: "null"
    PutEnvironmentSecretRequest:
      type: object
      additionalProperties: false
      required:
        - value
      properties:
        value:
          type: string
          description: Write-only plaintext value. It is encrypted before persistence and never returned.
          minLength: 1
          maxLength: 5120
          writeOnly: true
    CreateSecretInputRequest:
      type: object
      additionalProperties: false
      required:
        - names
      properties:
        names:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: The secret names the form asks for, each with its own masked field.
          items:
            type: string
            pattern: "^[A-Z][A-Z0-9_]{0,127}$"
    SecretInputRequest:
      type: object
      additionalProperties: false
      required:
        - request_id
        - url
        - expires_at
      properties:
        request_id:
          type: string
          pattern: "^[a-f0-9]{64}$"
        url:
          type: string
          format: uri
          description: The protected form link. It is a capability; hand it only to the person who enters the values.
        expires_at:
          type: string
          format: date-time
    SecretInputRequestStatus:
      type: object
      additionalProperties: false
      required:
        - request_id
        - state
        - expires_at
      properties:
        request_id:
          type: string
          pattern: "^[a-f0-9]{64}$"
        state:
          type: string
          enum: [pending, expired, saved, incomplete]
          description: >-
            pending: not saved yet, or saving now. expired: the link ran out unused. saved: every name was saved.
            incomplete: at least one name failed or could not be confirmed.
        expires_at:
          type: string
          format: date-time
        secrets:
          type: array
          description: Present once the form was submitted or expired; a name that was never written is unconfirmed.
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - state
            properties:
              name:
                type: string
              state:
                type: string
                enum: [saved, failed, unconfirmed]
    EnvironmentSecret:
      type: object
      description: Environment secret metadata. The plaintext and ciphertext are never returned.
      additionalProperties: false
      required:
        - name
        - revision
        - key_version
        - created_at
        - updated_at
        - desired_generation
        - applied_generation
        - delivery_state
        - runtime_provider
        - applied_secret_count
        - last_error
      properties:
        name:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,127}$
        revision:
          type: integer
          minimum: 1
        key_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        desired_generation:
          type: integer
          minimum: 0
        applied_generation:
          type: integer
          minimum: 0
        delivery_state:
          type: string
          enum: [not_deployed, pending, ready, failed]
        runtime_provider:
          type: [string, "null"]
          enum: [wfp, null]
        applied_secret_count:
          type: integer
          minimum: 0
          maximum: 100
        last_error:
          type: [string, "null"]
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
    EnvironmentSecretPage:
      type: object
      additionalProperties: false
      required:
        - items
        - desired_generation
        - applied_generation
        - delivery_state
        - runtime_provider
        - applied_secret_count
        - last_error
      properties:
        items:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/EnvironmentSecret"
        desired_generation:
          type: integer
          minimum: 0
        applied_generation:
          type: integer
          minimum: 0
        delivery_state:
          type: string
          enum: [not_deployed, pending, ready, failed]
        runtime_provider:
          type: [string, "null"]
          enum: [wfp, null]
        applied_secret_count:
          type: integer
          minimum: 0
          maximum: 100
        last_error:
          type: [string, "null"]
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
    DeleteEnvironmentSecretResult:
      type: object
      additionalProperties: false
      required:
        - name
        - status
        - desired_generation
        - applied_generation
        - delivery_state
        - runtime_provider
        - applied_secret_count
        - last_error
      properties:
        name:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,127}$
        status:
          type: string
          enum:
            - deleted
            - absent
        desired_generation:
          type: integer
          minimum: 0
        applied_generation:
          type: integer
          minimum: 0
        delivery_state:
          type: string
          enum: [not_deployed, pending, ready, failed]
        runtime_provider:
          type: [string, "null"]
          enum: [wfp, null]
        applied_secret_count:
          type: integer
          minimum: 0
          maximum: 100
        last_error:
          type: [string, "null"]
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
    LinkProjectSourceRequest:
      type: object
      additionalProperties: false
      required:
        - repository_owner
        - repository_name
      properties:
        repository_owner:
          type: string
          minLength: 1
          maxLength: 39
          pattern: ^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$
        repository_name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9._-]+$
    ConfigureSourceAutoDeployRequest:
      type: object
      additionalProperties: false
      required: [branch, enabled]
      properties:
        branch:
          type: string
          description:
            Exact Git branch accepted by Git check-ref-format branch rules; control/space,
            dot-lock, reflog, range and metacharacter forms are rejected.
          minLength: 1
          maxLength: 1024
          pattern: '^(?!.*(?:\.\.|@\{|//|\\|[~^:?*\[\]\x00-\x20\x7f]))(?!.*(?:^|/)\.)(?!.*(?:^|/)[^/]*\.lock(?:/|$))(?!.*\.$)[A-Za-z0-9][A-Za-z0-9._/-]{0,1023}$'
        enabled:
          type: boolean
    SourceAutoDeploy:
      type: object
      additionalProperties: false
      description:
        Push-to-deploy configuration. Generation 0 with null branch, ref, grant_status and
        updated_at means auto-deploy was never configured for this project.
      required: [branch, ref, environment, enabled, generation, grant_status, updated_at]
      properties:
        branch:
          type: [string, "null"]
        ref:
          type: [string, "null"]
          pattern: ^refs/heads/
        environment:
          type: string
          enum: [dev]
        enabled:
          type: boolean
        generation:
          type: integer
          minimum: 0
        grant_status:
          type: [string, "null"]
          enum: [active, revoked, null]
        updated_at:
          type: [string, "null"]
          format: date-time
    ConnectGithubOrganizationRequest:
      type: object
      additionalProperties: false
    GithubOrganizationConnection:
      type: object
      additionalProperties: false
      required:
        [
          connection_id,
          organization_id,
          installation_id,
          account_id,
          account_login,
          account_type,
          github_user_id,
          github_user_login,
          connected_at,
          revoked_at,
          settings_url,
        ]
      properties:
        connection_id: { $ref: "#/components/schemas/Ulid" }
        organization_id: { $ref: "#/components/schemas/Ulid" }
        installation_id: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
        account_id: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
        account_login: { type: string, minLength: 1, maxLength: 39 }
        account_type: { type: string, enum: [User, Organization] }
        github_user_id: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
        github_user_login: { type: string, minLength: 1, maxLength: 39 }
        connected_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        settings_url: { type: string, format: uri }
    GithubOrganizationConnectionStatus:
      type: object
      additionalProperties: false
      required: [status, connection]
      properties:
        status: { type: string, enum: [not_connected, connected, revoked] }
        connection:
          oneOf:
            - $ref: "#/components/schemas/GithubOrganizationConnection"
            - type: "null"
    OrganizationMcpConnection:
      type: object
      additionalProperties: false
      required: [connection_id, client_id, user_id, connected_at]
      properties:
        connection_id: { type: string, format: uuid }
        client_id: { type: string, minLength: 1, maxLength: 2048 }
        user_id: { type: string }
        connected_at: { type: string, format: date-time }
    OrganizationMcpConnectionList:
      type: object
      additionalProperties: false
      required: [connections]
      properties:
        connections:
          type: array
          items: { $ref: "#/components/schemas/OrganizationMcpConnection" }
    OrganizationMcpConnectionRevocation:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, enum: [pending, revoked] }
    GithubConnectionAuthorization:
      type: object
      additionalProperties: false
      required: [authorization_id, status, last_failure, authorization_url, expires_at, connection]
      properties:
        authorization_id: { type: [string, "null"], pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$" }
        status: { type: string, enum: [pending, authorizing, connected, failed, expired] }
        last_failure:
          type: [string, "null"]
          enum:
            [
              installation_access_required,
              account_admin_required,
              authorization_code_rejected,
              provider_unavailable,
              expired,
              session_inactive,
              denied,
              code_spent,
              state_unknown,
              null,
            ]
        authorization_url:
          type: [string, "null"]
          format: uri
          description:
            One GitHub browser authorization link when pending; contains only the bound single-use
            state, never a provider credential.
        expires_at: { type: [string, "null"], format: date-time }
        connection:
          oneOf:
            - $ref: "#/components/schemas/GithubOrganizationConnection"
            - type: "null"
    GithubSourceAuthorization:
      type: object
      additionalProperties: false
      required:
        [
          authorization_id,
          status,
          last_failure,
          authorization_url,
          installation_url,
          expires_at,
          operation_id,
          installation_id,
          repository_id,
          repository_owner,
          repository_name,
        ]
      properties:
        authorization_id:
          $ref: "#/components/schemas/Ulid"
        status:
          type: string
          enum: [pending, authorizing, authorized, failed, expired]
        last_failure:
          type: [string, "null"]
          description:
            Why the last callback did not finish. A pending authorization that carries one is
            resumable; resolve the named cause, then open authorization_url again without a new key.
          enum:
            - repository_not_installed
            - repository_access_required
            - authorization_code_rejected
            - provider_unavailable
            - expired
            - session_inactive
            - denied
            - code_spent
            - null
        authorization_url:
          type: [string, "null"]
          format: uri
          description:
            Open only when pending; contains the single-use state and PKCE challenge, never a
            provider credential.
        installation_url:
          type: [string, "null"]
          format: uri
          description:
            Install or update the GitHub App's selected repository access before authorizing, if
            required.
        expires_at:
          type: string
          format: date-time
        operation_id:
          type: [string, "null"]
          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
        installation_id:
          type: [string, "null"]
          pattern: ^[1-9][0-9]*$
        repository_id:
          type: [string, "null"]
          pattern: ^[1-9][0-9]*$
        repository_owner:
          type: string
        repository_name:
          type: string
    ProjectSource:
      oneOf:
        - $ref: "#/components/schemas/GithubProjectSource"
        - $ref: "#/components/schemas/ManagedProjectSource"
    ProjectSourceBinding:
      oneOf:
        - $ref: "#/components/schemas/GithubSourceBinding"
        - $ref: "#/components/schemas/ManagedProjectSource"
    ProjectSourceResponse:
      oneOf:
        - $ref: "#/components/schemas/GithubProjectSource"
        - $ref: "#/components/schemas/GithubSourceBinding"
        - $ref: "#/components/schemas/ManagedProjectSource"
    GithubProjectSource:
      type: object
      additionalProperties: false
      required:
        - provider
        - installation_id
        - repository_full_name
        - status
        - linked_at
        - updated_at
      properties:
        usual_duration_seconds:
          type: integer
          const: 60
