  /v1/organizations/{organization_id}/credit-usage:
    get:
      operationId: getOrganizationCreditUsage
      summary: Read monthly measured usage by project and meter
      description:
        Owner-only event-month ledger totals, including signed corrections posted by as_of.
        Returns up to 20 projects per page in ID order; use next_cursor with the same month. Current
        unresolved reservations are separate from measured consumption. Null environment_id means
        project-shared cost, never guessed Dev allocation. Only posted measurements are included;
        this is not a complete provider invoice or zero-usage guarantee. Billing may arrive later.
        No credit is granted or charged by this read; it remains usable at zero credits.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: organization_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Ulid"
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: "^20[0-9]{2}-(0[1-9]|1[0-2])$"
        - name: cursor
          in: query
          schema:
            $ref: "#/components/schemas/Ulid"
      responses:
        "200":
          description: Current posted usage for the selected UTC month and project page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationCreditUsage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/projects/{project_id}/exports:
    post:
      operationId: createProjectExport
      summary: Request an asynchronous password-encrypted SQL ZIP
      description: Owner-only and available at zero credits. Exports each confirmed physical project
        database once, including separate Dev/Prod SQL or one shared SQL file. Excludes files,
        source code and configuration. At most one accepted export per project per rolling 24 hours;
        failed jobs still count and idempotent replay returns the original operation. The user
        retains the password. Poll getProjectExport; do not create another job while it is running.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  writeOnly: true
                  description:
                    Non-blank user-controlled ZIP password, at most 1024 UTF-8 bytes. Never include it in
                    logs or command-line arguments.
      responses:
        "202": { $ref: "#/components/responses/AcceptedOperation" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/Problem" }
        "429":
          description:
            Project export limit reached, or an ordinary API rate limit. Retry-After gives the
            delay before another attempt.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/projects/{project_id}/exports/{export_id}:
    get:
      operationId: getProjectExport
      summary: Read export progress and its verified 24-hour download capability
      description: Owner-only, including at zero credits. Poll queued/running jobs after
        next_poll_after_seconds. A verified SQL ZIP is retained seven days. Its signed download URL
        is valid 24 hours and is issued only with at least 24 hours of retention left; otherwise
        download fields are null. Treat the URL as a secret bearer capability. Neither the password
        nor any permanent storage credential can be retrieved. Generic operation reads never contain
        this capability.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RequestId"
        - name: export_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Ulid" }
      responses:
        "200":
          description: Current export state and optional verified SQL ZIP download.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectExport" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/projects/{project_id}/credit-budget:
    get:
      operationId: getProjectCreditBudget
      summary: Read a project's optional monthly credit budget
      description:
        Owner-only snapshot of UTC-calendar-month measured usage and all open reservations. No
        budget means shared organization funds; continue mode does not stop at the threshold.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RequestId"
